    const v = String(value).trim();
    if (Array.isArray(kind)) return kind.includes(v) ? v : new Error(`one of ${kind.join(', ')}`);
    if (kind === 'colour') return rgba(v) ? v : new Error('a colour: #RRGGBB, rgb() or rgba()');
    // (whether a theme by that name is shipped is the answer's to say: it holds the themes)
    if (kind === 'theme') return v ? v : new Error('a theme\'s name, as lib/themes.json has it');
    // px may be 0 (a square corner); a line height may not
    const m = (kind === 'px' ? /^(\d*\.?\d+)(?:px)?$/ : /^(\d*\.?\d+)$/).exec(v);
    if (!m || (kind === 'number' && !(Number(m[1]) > 0))) return new Error(kind === 'px' ? 'a number of pixels' : 'a number above 0');
    return String(Number(m[1]));
  }

  // --- the file ----------------------------------------------------------

  // `## Colours`: a picture's category's slot by its name (`- dissent: pink`), any name, kept
  // lowercased, as pictures match names (SPEC.md, "Named colours"); not a section of the panel's
  const COLOURS_SECTION = 'Colours';
  const sectionOf = (words) => [...NAMES, COLOURS_SECTION].find((n) => n.toLowerCase() === String(words).trim().toLowerCase()) || null;
  const SLOT = 'a slot: 1 to 6, blue, ochre, pink, green, indigo or plum; or dot, square, diamond or triangle';

  /** A settings file's values, as cards.md reads its rows: each row under
   *  a section's heading; the pictures' `colours`, { name: slot as
   *  written }; what is not taken, with its line and why. */
  function read(lib, markdown) {
    const values = Object.fromEntries(NAMES.map((n) => [n, {}]));
    const colours = {};
    const at = {};
    const skipped = [];
    const st = lib.stack(markdown);
    const sectionFor = Array(st.cards.length).fill(null);
    for (const g of st.groups) {
      if (g.heading === null) continue;
      const s = sectionOf(st.cards[g.heading].blocks[0].markdown);
      for (const c of g.cards) sectionFor[c] = s;
    }
    st.cards.forEach((card, c) => {
      for (const b of card.blocks) {
        if (b.kind !== 'list' || b.as !== 'rows') continue;
        for (const row of b.rows) {
          const line = row.lines[0] + 1;
          const s = sectionFor[c];
          if (s === COLOURS_SECTION) {
            const name = row.key.trim().toLowerCase();
            if (lib.colourSlot(row.value) === null) { skipped.push({ line, key: row.key, value: row.value, why: SLOT }); continue; }
            if (`${s}/${name}` in at) { skipped.push({ line, key: row.key, value: row.value, why: `said already, on line ${at[`${s}/${name}`]}` }); continue; }
            at[`${s}/${name}`] = line;
            colours[name] = row.value.trim();
            continue;
          }
          const v = take(s, row.key, row.value);
          if (v instanceof Error) { skipped.push({ line, key: row.key, value: row.value, why: v.message }); continue; }
          if (`${s}/${row.key}` in at) { skipped.push({ line, key: row.key, value: row.value, why: `said already, on line ${at[`${s}/${row.key}`]}` }); continue; }
          at[`${s}/${row.key}`] = line;
          values[s][row.key] = v;
        }
      }
    });
    return { values, colours, skipped, lines: at };
  }

  const HEADER = `# Cards settings

How cards.md draws notes, in the editing bench (npm run edit) and on
cards-md.github.io. A key left out is cards.md's own; a folder's
.cards/config.md wins over this file, key by key. Space and sizes are
pixels.
`;

  /** The person's file with these values for the keys it exposes, every
   *  other line as it was: a key not given is taken out (cards.md's own
   *  again), save where its row was not read. A section not there is
   *  added at the end. */
  function write(lib, markdown, values) {
    let md = markdown || HEADER;
    for (const s of NAMES) {
      const want = values[s] || {};
      const st = lib.stack(md);
      const g = st.groups.find((x) => x.heading !== null && sectionOf(st.cards[x.heading].blocks[0].markdown) === s);
      const c = g ? g.cards.find((i) => i !== g.heading && st.cards[i].blocks[0].kind === 'list' && st.cards[i].blocks[0].as === 'rows') : undefined;
      const used = new Set();
      const rows = [];
      if (c !== undefined) {
        st.cards[c].blocks[0].rows.forEach((r, from) => {
          const given = r.key in want;
          if (given && !used.has(r.key)) { used.add(r.key); rows.push({ key: r.key, value: want[r.key], from }); }
          // a row not read (not a key here, or a value not taken) is the
          // person's to mend: kept, unless its key is given anew
          else if (!given && take(s, r.key, r.value) instanceof Error) rows.push({ key: r.key, value: r.value, from });
        });
      }
      const added = Object.keys(SECTIONS[s]).filter((k) => k in want && !used.has(k)).map((k) => ({ key: k, value: want[k] }));
      if (c !== undefined) { md = lib.editRows(md, c, [...rows, ...added]); continue; }
      if (!added.length) continue;
      const text = added.map((r) => `- ${r.key}: ${r.value}`).join('\n');
      md = g ? lib.insertCard(md, g.cards[g.cards.length - 1], text)
        : lib.insertCard(md, st.cards.length - 1, `## ${s}\n\n${text}`);
    }
    return md;
  }

  // --- what cards.md draws by default -------------------------------------

  /** cards.md's own values: space and type from tokens.json, the colours
   *  from cards.css (its light .cards-stack and its dark one). */
  function defaults(tokens, css, themes = {}, { aliases = {}, removed = {} } = {}) {
    const block = (sel) => {
      const at = css.indexOf(`${sel} {`);
      const body = css.slice(at, css.indexOf('}', at));
      return Object.fromEntries([...body.matchAll(/--cards-([a-z0-9-]+):\s*([^;]+);/g)]
        .filter(([, k]) => COLOURS.includes(k)).map(([, k, v]) => [k, v.trim()]));
    };
    return {
      Page: { ...PAGE_DEFAULTS },
      Space: Object.fromEntries(Object.keys(SECTIONS.Space).map((k) => [k, String(tokens.space[camel(k)])])),
      Type: Object.fromEntries(ROLES.flatMap((r) => [[`${r}-size`, String(tokens.type[r].size)], [`${r}-line`, String(tokens.type[r].lineHeight)]])
        .filter(([k]) => k in SECTIONS.Type)),
      Light: { scheme: '', ...block('\n.cards-stack') },
      Dark: { scheme: '', ...block('[data-theme="dark"] .cards-stack') },
      // the shipped themes (lib/themes.json), each a terminal palette, by name; a renamed one's old
      // name to its new, and one gone with the upstream commit it went at (databook-ansi-themes keeps both)
      themes,
      aliases,
      removed,
    };
  }

  /** A shipped theme (lib/themes.json) as a palette: its sixteen, background and foreground. */
  const paletteOf = (t) => ({ ansi: t.palette.map((c) => c.toUpperCase()), background: t.background.toUpperCase(), foreground: t.foreground.toUpperCase() });
  // a colour's hue (0-360) and saturation, as HSL reads them (brand's palette.js)
  const hueSat = (c) => {
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16) / 255);
    const M = Math.max(r, g, b), m = Math.min(r, g, b), d = M - m, l = (M + m) / 2;
    if (!d) return { h: 0, s: 0 };
    const h = M === r ? ((g - b) / d) % 6 : M === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return { h: (h * 60 + 360) % 360, s: d / (1 - Math.abs(2 * l - 1)) };
  };
  const hueGap = (x, y) => { const d = Math.abs(hueSat(x).h - hueSat(y).h) % 360; return Math.min(d, 360 - d); };
  /** A shipped theme's colours as a choice's tile shows them, what matters first (a tile shows its first
   *  four unless told), as brand orders them: its background, foreground, the stone (the accent cards.md
   *  picks for it, else, where none or a grey, its yellow), the stone's partner (of its colours with some saturation, the one
   *  furthest round the wheel from the stone; brand's palette.js partner()), then the rest of its palette. */
  const themeColours = (t) => {
    // the accent cards.md picks, unless none or its fallback, a grey: then its yellow
    const accent = scheme(paletteOf(t), t.dark ? 'Dark' : 'Light').colours.accent;
    const stone = accent && lch(accent)[1] >= 0.03 ? accent : t.palette[3];
    const pool = [...new Set([t.background, t.foreground, ...t.palette].map((c) => c.toLowerCase()))];
    const partner = pool.filter((c) => hueSat(c).s > 0.3).sort((x, y) => hueGap(y, stone) - hueGap(x, stone))[0] || stone;
    return [t.background, t.foreground, stone, partner, ...t.palette.filter((c) => c.toLowerCase() !== partner)];
  };
  /** A theme's colours for a mode, by its name among `themes`; null for none or one not shipped. */
  const themed = (themes, name, mode) => (name && themes && themes[name] ? scheme(paletteOf(themes[name]), mode).colours : null);
  /** A mode's values as drawn: its theme's colours, and over them each colour it sets itself. */
  const resolved = (values, themes, mode) => {
    const { scheme: name, ...own } = values || {};
    return { ...(themed(themes, name, mode) || {}), ...own };
  };

  /** Every key's value, and whose it is: the folder's over the person's
   *  over cards.md's. */
  function merged(defaultValues, person, folder) {
    const themes = defaultValues.themes || {};
    return NAMES.map((s) => {
      // a mode's theme, the folder's over the person's: its colours stand under what either sets
      const name = s === 'Light' || s === 'Dark' ? folder[s].scheme ?? person[s].scheme : null;
      const theme = name ? themed(themes, name, s) : null;
      return {
        name: s,
        keys: Object.keys(SECTIONS[s]).map((k) => {
          const kind = SECTIONS[s][k];
          const out = { key: k, kind: Array.isArray(kind) ? 'choice' : kind, default: defaultValues[s][k] };
          if (Array.isArray(kind)) out.choices = kind;
          if (kind === 'theme') out.choices = Object.keys(themes);
          if (theme && k in theme) out.theme = theme[k];
          if (k in person[s]) out.person = person[s][k];
          if (k in folder[s]) out.folder = folder[s][k];
          out.source = 'folder' in out ? 'folder' : 'person' in out ? 'person' : 'theme' in out ? 'theme' : 'cards.md';
          out.value = out[out.source === 'cards.md' ? 'default' : out.source];
          return out;
        }),
      };
    });
  }

  // --- the page: the settings as a style sheet over cards.css ---------------

  /** The values set (each section's {key: value}) as CSS, after cards.css:
   *  space and type on :root, the colours on .cards-stack, the dark ones
   *  under both of cards.css's dark selectors. The page choices are
   *  attributes, not CSS (attributes()). */
  /** The bench around the stack (proto/editing.css's own variables), from
   *  one mode's colours as drawn: the page a step off the ground (light:
   *  a little of the ink, as #E4DED6 to #F3F0EB; dark: darker, as #0A0908
   *  to #141210), its words ink2; the phone the ground; buttons and fields
   *  card, hair and ink; the pressed and the current the accent; the Md
   *  editor card and ink, its font as it was. */
  function chrome(c, mode) {
    return {
      desk: mode === 'Light' ? mix(c.ground, c.ink, 0.08) : mix(c.ground, '#000000', 0.5),
      'desk-ink': c.ink2,
      'desk-line': c.hair,
      phone: c.ground,
      field: c.card,
      'field-ink': c.ink,
      'button-ink': c.ink,
      sheet: c.card,
      bar: c.accent,
      'bar-ink': c.ground,
      lit: alpha(c.accent, 0.16),
    };
  }

  function css(given, defaultValues = null, themes = defaultValues && defaultValues.themes) {
    const values = { ...given, Light: given.Light && resolved(given.Light, themes, 'Light'), Dark: given.Dark && resolved(given.Dark, themes, 'Dark') };
    const decl = (o, unit) => Object.entries(o || {}).map(([k, v]) => `--cards-${k}: ${v}${unit(k)};`).join(' ');
    const out = [];
    const root = [decl(values.Space, () => 'px'), decl(values.Type, (k) => (k.endsWith('-size') ? 'px' : ''))].filter(Boolean).join(' ');
    if (root) out.push(`:root { ${root} }`);
    const light = decl(values.Light, () => '');
    if (light) out.push(`.cards-stack { ${light} }`);
    const dark = decl(values.Dark, () => '');
    if (dark) {
      out.push(`@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cards-stack { ${dark} } }`);
      out.push(`[data-theme="dark"] .cards-stack { ${dark} }`);
    }
    // the bench around it, when a mode's colours are set (none set, it is
    // drawn as editing.css draws it): over editing.css's selectors, mode by mode
    const around = (mode) => {
      if (!defaultValues || !Object.keys(values[mode] || {}).length) return '';
      const { scheme: _none, ...base } = defaultValues[mode];
      const vars = chrome({ ...base, ...values[mode] }, mode);
      return Object.entries(vars).map(([k, v]) => `--${k}: ${v};`).join(' ');
    };
    const lightAround = around('Light');
    if (lightAround) out.push(`:root { ${lightAround} }`);
    const darkAround = around('Dark');
    if (darkAround) {
      out.push(`@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { ${darkAround} } }`);
      out.push(`:root[data-theme="dark"] { ${darkAround} }`);
    }
    return out.join('\n');
  }

  /** The page choices as cards.css's attributes on the page's root: a
   *  name, or null for none. The width is always said: wide, unless phone. */
  function attributes(page = {}) {
    return {
      theme: page.theme && page.theme !== 'system' ? page.theme : null,
      prose: page.prose === 'card' ? 'card' : null,
      merge: page.merge === 'group' ? 'group' : null,
      width: page.width === 'phone' ? 'phone' : 'wide',
    };
  }

  // --- a terminal palette, as a scheme -------------------------------------

  /** A Ghostty theme (paletty.dev's export "Ghostty"): `palette = N=#hex`
   *  for the sixteen colours, `background = #hex`, `foreground = #hex`.
   *  Other lines are passed over. */
  function palette(text) {
    const p = { ansi: Array(16).fill(null), background: null, foreground: null };
    for (const line of String(text).split(/\r?\n/)) {
      let m = /^\s*palette\s*=\s*(\d{1,2})\s*=\s*(#?[0-9a-f]{6})\s*$/i.exec(line);
      if (m && Number(m[1]) < 16) { p.ansi[Number(m[1])] = `#${m[2].replace('#', '').toUpperCase()}`; continue; }
      m = /^\s*(background|foreground)\s*=\s*(#?[0-9a-f]{6})\s*$/i.exec(line);
      if (m) p[m[1].toLowerCase()] = `#${m[2].replace('#', '').toUpperCase()}`;
    }
    return p;
  }

  // the callouts by hue: the terminal's normal colour and its bright one
  const HUES = { note: [4, 12], tip: [2, 10], important: [5, 13], warning: [3, 11], caution: [1, 9] };
  // A card stands off its ground as cards.css's do: in light, lighter
  // (the ground this share of the way to white, the chip between); in
  // dark, a little of the ink in the ground.
  const LIGHT_CARD = 0.6; const DARK_CARD = 0.05; const DARK_CHIP = 0.1;
  // The lines, the ink at cards.css's own alphas for each mode (0:
  // none); dark's edge is a shadow, black, as cards.css writes it.
  const LINES = {
    Light: { hair: 0.14, sep: 0.1, 'code-border': 0, edge: 0.12 },
    Dark: { hair: 0.12, sep: 0.09, 'code-border': 0.1, edge: 'rgba(0,0,0,0.45)' },
  };
  const alpha = (ink, a) => (a === 0 ? 'transparent' : `rgba(${rgba(ink).slice(0, 3).join(',')},${a.toFixed(2)})`);
  // ink2 stands between ink and ink3: this share of ink3's way to the ground
  const INK2 = 0.6;

  /** A palette's colours for one scheme, by role: ground and ink from
   *  background and foreground; each callout its hue's colour that stands
   *  further from the ground; accent apart from the pictures' six (below); code from colours 0
   *  and 15; card and chip mixed (lighter than the ground in Light, a
   *  little of the ink in Dark); the lines the ink at cards.css's alphas
   *  for the mode; any colour of words under 4.5:1 on the ground, the card
   *  or the chip moved toward black or white, away from what it stands on,
   *  until it reaches 4.5:1 on all three; ink3 mixed as far toward the
   *  ground as keeps 4.5:1 on all three (none, when the ink itself is
   *  under), and ink2 between it and the ink. What the palette lacks is said, and
   *  its roles left as they were. */
  // Black or white, whichever stands further from a ground.
  const pole = (ground) => (contrast('#000000', ground) > contrast('#FFFFFF', ground) ? '#000000' : '#FFFFFF');
  // a colour's contrast on the hardest of its grounds (one, or several)
  const least = (colour, grounds) => Math.min(...[grounds].flat().map((g) => contrast(colour, g)));
  const hardest = (colour, grounds) => [grounds].flat().reduce((a, g) => (contrast(colour, g) < contrast(colour, a) ? g : a));
  /** A colour moved toward `toward` (by default black or white, whichever
   *  the ink's side of the hardest ground: a callout keeps its hue, where
   *  the ink itself would grey it), the least that reaches 4.5:1 on its
   *  ground, or on every one of several; toward black or white when
   *  `toward` cannot reach it. Where neither can read on all of several
   *  (a dark theme's ground under light cards), on the first alone. */
  function reach(colour, ground, toward = pole(hardest(colour, ground))) {
    if (least(colour, ground) >= ENOUGH) return colour;
    if (Array.isArray(ground) && ['#000000', '#FFFFFF'].every((c) => least(c, ground) < ENOUGH)) return reach(colour, ground[0], toward);
    const to = least(toward, ground) >= ENOUGH ? toward : pole(hardest(colour, ground));
    let t = 0;
    while (t < 1 && least(mix(colour, to, t), ground) < ENOUGH) t = Math.round((t + 0.01) * 100) / 100;
    return mix(colour, to, t);
  }

  function scheme(p, mode = 'Dark') {
    const out = {};
    const lacks = [];
    const bg = p.background;
    if (!bg || !p.foreground) {
      lacks.push(...['background', 'foreground'].filter((k) => !p[k]));
      return { colours: out, lacks };
    }
    // every colour of words reaches 4.5:1 on all it stands on, the ground,
    // a card and a chip: one under is moved toward black or white, the
    // ink's side, until it does. Card and chip are made first, from the
    // ink as it reads on the ground.
    const fg0 = reach(p.foreground, bg);
    out.ground = bg;
    out.card = mode === 'Light' ? mix(bg, '#FFFFFF', LIGHT_CARD) : mix(bg, fg0, DARK_CARD);
    out.chip = mode === 'Light' ? mix(bg, out.card, 0.5) : mix(bg, fg0, DARK_CHIP);
    const under = [bg, out.card, out.chip];
    const fg = reach(fg0, under);
    out.ink = fg;
    for (const [k, a] of Object.entries(LINES[mode])) out[k] = typeof a === 'string' ? a : alpha(fg, a);
    let t = 0.6;
    while (t > 0 && least(mix(fg, bg, t), under) < ENOUGH) t = Math.round((t - 0.01) * 100) / 100;
    out.ink2 = mix(fg, bg, t * INK2);
    out.ink3 = mix(fg, bg, t);
    for (const [role, [a, b]] of Object.entries(HUES)) {
      const have = [p.ansi[a], p.ansi[b]].filter(Boolean);
      if (!have.length) { lacks.push(`colour ${a} or ${b} (${role})`); continue; }
      out[role] = reach(have.reduce((x, y) => (contrast(y, bg) > contrast(x, bg) ? y : x)), under);
    }
    Object.assign(out, series(p, out.card));
    // the accent (links, buttons; a map's own places): the palette's colour that stands furthest from
    // every picture's six, cyan first, where one stands APART; else a quiet one from the ink, which no slot is
    out.accent = accentOf(p, out, under, fg);
    if (p.ansi[0]) out['code-bg'] = p.ansi[0]; else lacks.push('colour 0 (code)');
    if (p.ansi[15]) out['code-ink'] = out['code-bg'] ? reach(p.ansi[15], out['code-bg']) : p.ansi[15];
    else lacks.push('colour 15 (code)');
    return { colours: out, lacks };
  }

  // --- the pictures' six colours, by meaning ---------------------------------
  //
  // SPEC.md, "Named colours": 1 blue (transit), 2 ochre (food), 3 pink
  // (shops), 4 green (outdoors, and nothing else green), 5 indigo (health),
  // 6 plum (culture). Each is the palette's own colour nearest that hue,
  // where one stands within HUE_NEAR of it; else made at that hue, as
  // light and as strong as the palette's nearest; then moved toward
  // black or white until it reaches 3:1 on the card (a mark, not words);
  // and made again at its hue where it stands too near one already taken.

  // OKLab, where distance is how different two colours look
  const lin = (x) => { const v = x / 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
  const unlin = (v) => 255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055);
  function oklab(colour) {
    const [r, g, b] = rgba(colour).slice(0, 3).map(lin);
    const [l, m, q] = [0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b, 0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b,
      0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b].map(Math.cbrt);
    return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * q, 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * q,
      0.0259040371 * l + 0.7827717662 * m - 0.808675766 * q];
  }
  // [L, C, h°] and back; a colour past sRGB loses chroma until it is in
  const lch = (colour) => { const [L, a, b] = oklab(colour); return [L, Math.hypot(a, b), ((Math.atan2(b, a) * 180) / Math.PI + 360) % 360]; };
  function fromLch(lightness, C, h) {
    const L = Math.min(1, Math.max(0, lightness));
    for (let c = C; c >= 0; c -= 0.005) {
      const a = c * Math.cos((h * Math.PI) / 180); const b = c * Math.sin((h * Math.PI) / 180);
      const [l, m, q] = [L + 0.3963377774 * a + 0.2158037573 * b, L - 0.1055613458 * a - 0.0638541728 * b, L - 0.0894841775 * a - 1.291485548 * b].map((x) => x ** 3);
      const rgb = [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * q, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * q,
        -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * q];
      if (rgb.every((v) => v >= -0.0005 && v <= 1.0005)) return hex(rgb.map((v) => Math.min(255, Math.max(0, unlin(v)))));
    }
    return hex([L, L, L].map(() => Math.min(255, unlin(L ** 3))));
  }
  const apart = (x, y) => { const [a, b] = [oklab(x), oklab(y)]; return Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]); };
  // as a deuteranope and a protanope see it (Machado, Oliveira and Fernandes 2009, full severity)
  const CVD = [[[0.367322, 0.860646, -0.227968], [0.280085, 0.672501, 0.047413], [-0.01182, 0.04294, 0.968881]],
    [[0.152286, 1.052583, -0.204868], [0.114503, 0.786281, 0.099216], [-0.003882, -0.048116, 1.051998]]];

<script>// Where the bench's files come from: one face for the page (editing.js),
// whatever is behind it. Each source gives
//
//   name                   the folder's name, over the files pane
//   list(path)             a folder's { rows, front }, as paths.js's listing gives them
//   read(path)             { text, version }
//   write(path, text, version)   { version } | { conflict: true } | { error }; none where read-only

//   start                  the file to open first, if any; opened(path), told as each opens

        if (text === null) throw new Said(`${p} could not be read. Reloading asks again.`);

      raw,
      // the page's URL, as each file opens (the first, in the URL's place)
      opened(p, first) { go(`/${base}/blob/${enc(at.ref)}/${enc(p)}`, first); },

  // Nothing written back: a tap reads, and no card is edited
  const readOnly = !!served && !(source && source.write);
  // A path written in the file, as the source's URL for it: from the
  // file's own folder, as the markdown means it (proto/paths.js).
  function local(src) {
    const to = source && file() && file().path && linked(file().path, src);
    return to ? source.raw(to) : null;
  }
  // The host's part of an image: a local path resolved to its file; a
  // photos card's photo (photo:<name>) given to the engine as it draws.
  const photo = (src) => (src in images ? images[src] : /^photo:/i.test(src) ? null : local(src) || src);
  const resolve = (root) => root.querySelectorAll('img').forEach((img) => {
    const src = img.getAttribute('src');
    if (images[src]) img.src = images[src];
    else if (local(src)) img.src = local(src);
  });

  const $ = (sel, el = document) => el.querySelector(sel);
  function el(tag, props = {}, ...kids) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') node.className = v;
      else if (k === 'data') Object.assign(node.dataset, v);
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null && v !== false) node[k] = v;
    }
    node.append(...kids.flat().filter((k) => k !== null && k !== undefined));
    return node;
  }
  const grow = (ta) => { ta.style.height = 'auto'; ta.style.height = `${ta.scrollHeight}px`; };
  // The editors are shared with the metrics sheet (proto/editors.js).
  const { editorFor, surfaceFor, viewsOf, newCard } = window.cardsEditors({
    lib,
    source: () => file().source,
    finish: () => finish(),
    record: (g, key) => recordActions(g, key),
    cardActions: (i, remove = true) => cardActions(i, remove),
    refresh: () => drawBar(),
  });

  const files = samples.map((s) => ({ name: s.name, source: s.markdown, choices: s.choices, fields: s.fields, buffer: s.buffer, earlier: [] }));
  let current = 0;
  let editing = null; // { card, editor, base }
  let changed = null; // [start, end) lines the last edit touched, in the new text
  // how a change arrives: the Motion the settings give (none: cards.md's own, a quiet fade), and
  // what was drawn last, so the next drawing plays what changed (SPEC.md, "A change, shown as it happens")
  let motion = lib.readMotion('');
  // the pictures' colours the settings give (`## Colours`): a category's slot by its name
  let colours = {};
  let shown = { file: null, source: null };
  let author = 'person'; // a change read from disk is no one's the bench can name

  const stackHost = $('#stack');
  const accessory = $('#accessory');
  const file = () => files[current];
  // A buffer: its owner's markdown, drawn read-only; nothing in it is edited here
  const buffer = () => !!(file() && file().buffer);

  // --- what the user sees when an edit is refused --------------------

  function plain(message) {
    if (/would change how the file reads/.test(message)) return 'That would change how the rest of the file reads, so it was not made.';
    if (/is not a key/.test(message)) return 'A field name is words: letters, digits, spaces or a hyphen.';
    if (/nothing can follow/.test(message)) return 'Nothing can follow this record: it runs to the end of the file.';
    if (/one line of words/.test(message)) return 'A heading needs a line of words.';
    return message;
  }
  let toastTimer = null;
  function toast(text) {
    const t = $('#toast');
    t.textContent = text;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
  }

  // --- the file changes only here ---------------------------------------

  // Which lines of `after` differ from `before`: what the splice touched.
  function touched(before, after) {
    const a = before.split('\n');
    const b = after.split('\n');
    let s = 0;
    while (s < a.length && s < b.length && a[s] === b[s]) s++;
    let ea = a.length;
    let eb = b.length;
    while (ea > s && eb > s && a[ea - 1] === b[eb - 1]) { ea--; eb--; }
    return [s, eb];
  }

  function commit(next, label) {
    if (next === file().source) return;
    changed = touched(file().source, next);
    file().earlier.push({ source: file().source, label });
    file().source = next;
  }

  function undo() {
    if (served) settle(); // a run of typing in Md ends at Undo
    const last = file() && file().earlier.pop();
    if (!last) return;
    stopEditing();
    changed = touched(file().source, last.source);
    file().source = last.source;
    render();
    toast(`Undid: ${last.label}`);
  }

  // --- drawing --------------------------------------------------------

  function render() {
    if (!file()) {
      stackHost.replaceChildren(el('p', { class: 'hint none', textContent: 'Open a markdown file from Files, on the left.' }));
      $('#source-lines').replaceChildren();
      $('#source-count').textContent = '';
      $('#undo').disabled = true;
      if (served) drawServed();
      return;
    }
    const st = lib.stack(file().source);
    const before = shown.file === file() && shown.source !== file().source && window.cardsMotion && stackHost.firstElementChild
      ? { source: shown.source, cards: window.cardsMotion.snapshot(stackHost.firstElementChild) } : null;
    stackHost.innerHTML = lib.html(file().source, { choices: file().choices, fields: file().fields, images: photo, colours, ...(buffer() ? { ...file().buffer, buffer: true } : {}) });
    drawInputs();
    resolve(stackHost);
    const stackEl = stackHost.firstElementChild;
    if (!st.cards.length && !readOnly && !buffer()) stackEl.append(el('button', { type: 'button', class: 'start', textContent: 'Tap to write' }));
    const cardEls = stackEl.querySelectorAll('.cards-card');
    cardEls.forEach((c, i) => { c.dataset.card = i; });
    drawPictures(st);
    // A record's heading carries a way to its record's actions.
    const sections = stackEl.querySelectorAll('.cards-group');
    st.groups.forEach((g, gi) => {
      if (g.heading === null) return;
      const head = st.cards[g.heading].blocks[0];
      if (!head.record || readOnly || buffer()) return;
      const h = cardEls[g.heading];
      h.append(el('button', { type: 'button', class: 'record-more', title: `${head.record.key} actions`,
        ariaLabel: `${head.record.key} actions`, textContent: '···', data: { group: gi } }));
      sections[gi].dataset.group = gi;
    });
    // Light the cards the last edit landed in.
    if (changed) {
      st.cards.forEach((c, i) => {
        if (c.lines[0] < Math.max(changed[1], changed[0] + 1) && c.lines[1] > changed[0]) cardEls[i].classList.add('lit');
      });
    }
    if (before) window.cardsMotion.play(before.cards, stackEl, lib.motionEvents(before.source, file().source, { author }), motion, { author });
    shown = { file: file(), source: file().source };
    author = 'person';
    drawSource();
    const undoButton = $('#undo');
    const last = file().earlier[file().earlier.length - 1];
    undoButton.disabled = !last;
    undoButton.title = last ? `Undo: ${last.label}` : 'Nothing to undo';
    if (served) drawServed();
  }

  // Pictures at their card's width: each of bars, a line or a grid drawn
  // as wide as pictures.js's widthFor says (the measure, or wider where it
  // needs, never past the column; on a phone, the card's width), so its
  // words are never scaled. The stack is measured as its width changes,
  // and only the pictures are drawn again.
  const SIZED = ['bars', 'line', 'grid'];
  function drawPictures(st = file() && lib.stack(file().source)) {
    const stackEl = stackHost.firstElementChild;
    if (!st || !stackEl) return;
    const cs = getComputedStyle(stackEl);
    const inset = parseFloat(cs.getPropertyValue('--cards-inset')) || 0;
    const column = stackEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    if (!(column > 0)) return;
    // the measure as drawn: wide, the stylesheet's; else the column
    let measure = column;
    if (document.documentElement.dataset.width === 'wide') {
      const probe = el('div', { style: 'width: var(--cards-measure); position: absolute; visibility: hidden' });
      stackEl.append(probe);
      measure = Math.min(column, probe.getBoundingClientRect().width);
      probe.remove();
    }
    const room = { measure: measure - 2 * inset, column: column - 2 * inset };
    stackEl.querySelectorAll('.cards-picture').forEach((pic) => {
      if (!SIZED.includes(pic.dataset.picture)) return;
      const { card, title } = st.cards[Number(pic.dataset.card)].blocks[0].callout;
      const width = Math.floor(lib.pictureWidth(card, room, title));
      if (Number(pic.dataset.drawn) === width) return;
      pic.dataset.drawn = width;
      const label = pic.firstElementChild && pic.firstElementChild.matches('.cards-callout-label') ? pic.firstElementChild.outerHTML : '';
      pic.innerHTML = label + lib.drawPicture(card, title, { images: photo, width, colours });
    });
  }
  let drawnWidth = 0;
  new ResizeObserver(() => {
    if (stackHost.clientWidth === drawnWidth) return;
    drawnWidth = stackHost.clientWidth;
    // the next frame's: drawn inside the callback, a picture's new size is a resize it has not delivered (WebKit's loop error)
    requestAnimationFrame(() => drawPictures());
  }).observe(stackHost);

  function drawSource() {
    const lines = file().source.split('\n');
    const list = $('#source-lines');
    list.replaceChildren(...lines.map((l, i) => el('li', {
      class: changed && i >= changed[0] && i < changed[1] ? 'changed' : '', textContent: l || '​',
    })));
    $('#source-count').textContent = `${lines.length} lines${changed && changed[1] > changed[0] ? `, ${changed[1] - changed[0]} changed` : ''}`;
    const first = list.querySelector('.changed');
    if (first) first.scrollIntoView({ block: 'nearest' });
  }

  // --- editing one card -------------------------------------------------

  function startEditing(i, options = {}) {
    const st = lib.stack(file().source);
    const card = st.cards[i];
    if (!card) return;
    const old = stackHost.querySelector(`[data-card="${i}"]`);
    // The card's own view goes with it: a row that stood beside its key
    // stays there. The editor stands exactly where the card stood.
    const editor = editorFor(st, i, { ...options, view: old });
    stackHost.firstElementChild.classList.add('is-editing');
    editing = { card: i, kind: card.kind, editor, base: file().source, restore: options.restore };
    showAccessory();
    // a kind with no editor in place (this time) opens on its surface
    if (!editor) { surface(i); return; }
    editor.el.classList.add('editor');
    old.replaceWith(editor.el);
    editor.focus();
  }

  // A card's surface: full screen, risen over the stack, the same edit
  // drawn with room, its kind's views a tap apart (its own, then
  // Markdown), the draft carried between them. The bar is the same bar.
  function surface(i, first) {
    const { editor, base, kind } = editing;
    const fresh = editing.newAfter !== undefined;
    let draft = base;
    if (editor && fresh) {
      editor.el.inert = true;
    } else if (editor) {
      try { draft = editor.apply(base); } catch (e) { say(plain(e.message)); return; }
      editor.el.inert = true;
    }
    const names = fresh ? ['Markdown'] : viewsOf(kind);
    const views = el('div', { class: 'views', role: 'tablist', hidden: names.length < 2 },
      names.map((name) => el('button', { type: 'button', role: 'tab', textContent: name,
        onpointerdown: keep, onclick: () => view(name) })));
    const body = el('div', { class: 'surface-body' });
    const sheet = el('div', { class: 'surface cards-stack', role: 'dialog', ariaLabel: kind }, el('header', { class: 'surface-head' }, views), body);
    document.body.append(sheet);
    editing.surface = sheet;
    editing.view = null;
    editing.show = view;
    open(first || names[0], draft);
    // it rises as the phone's full screen cover does
    sheet.animate([{ transform: 'translateY(100%)' }, { transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)' });

    // `name`, showing the card as `next` (the file with the draft in it) has it
    function open(name, next) {
      const st = lib.stack(next);
      if (!fresh && name !== 'Markdown' && (!st.cards[i] || st.cards[i].kind !== kind)) { toast(`This is no longer a ${kind}.`); return; }
      let shown;
      if (fresh) {
        shown = newCard(editing.newAfter, { text: editor ? editor.text() : '', markdown: true });
      } else if (name === 'Markdown') {
        const [s0, e0] = st.cards[i].lines;
        const lines = next.split('\n').slice(s0, e0);
        while (lines.length > 1 && !lines[lines.length - 1].trim()) lines.pop();
        shown = surfaceFor(lib.stack(base), i, name, lines.join('\n'));
      } else {
        shown = surfaceFor(st, i, name);
      }
      shown.el.classList.add('editor');
      body.replaceChildren(shown.el);
      editing.editor = shown;
      editing.view = name;
      views.querySelectorAll('button').forEach((v) => v.setAttribute('aria-selected', String(v.textContent === name)));
      drawBar();
      shown.focus();
    }
    function view(name) {
      if (name === editing.view) return;
      let next;
      try { next = editing.editor.apply(base); } catch (e) { say(plain(e.message)); return; }
      open(name, next);
    }
  }

  function stopEditing() {
    if (editing && editing.surface) editing.surface.remove();
    editing = null;
    accessory.classList.remove('open');
  }

  // A refusal, said under the card being edited: the bar keeps one height.
  function say(text) {
    const { editor } = editing;
    let p = editor.el.nextElementSibling;
    if (!p || !p.classList.contains('edit-problem')) {
      p = el('p', { class: 'edit-problem', role: 'status' });
      editor.el.after(p);
    }
    p.textContent = text;
  }

  // Done: the editor's change, written by the engine, or a reason not.
  function finish() {
    if (!editing) return true;
    const { editor, base, restore } = editing;
    let next;
    try {
      next = editor.apply(base);
    } catch (e) {
      say(plain(e.message));
      return false;
    }
    stopEditing();
    if (restore !== undefined) {
      // A new record: it and its naming are one edit, undone as one.
      file().source = restore;
      commit(next, editor.label);
    } else {
      commit(next, editor.label);
    }
    render();
    return true;
  }

  function cancel() {
    if (!editing) return;
    const { restore } = editing;
    stopEditing();
    if (restore !== undefined) file().source = restore;
    render();
  }

  // The bar, as the phone draws it (CardsUI/KeyboardBar.swift): one row,
  // one height, its places fixed so the hand learns them --
  //   [✕] [the kind's control] [chips …] [⤢] [⋯] [✓]
  // Cancel first, Done last, ⋯ (what is rare: moves, deletes) just
  // before Done. The control is the heading's level, a callout's type, or Arrange. ⤢, for
  // a kind with a surface, takes the draft up to it.
  const keep = (e) => e.preventDefault(); // a tap on the bar keeps the caret where it is
  function key(label, symbol, run, cls = '') {
    return el('button', { type: 'button', class: `key ${cls}`, ariaLabel: label, title: label, textContent: symbol,
      onpointerdown: keep, onclick: run });
  }
  function showAccessory() {
    accessory.classList.add('open');
    drawBar();
    placeAccessory();
  }
  function drawBar() {
    if (!editing || !editing.editor) return;
    const bar = editing.editor.bar;
    const c = bar.control;
    let control = null;
    if (c && c.level) control = levelPill(c.level(), c.setLevel);
    else if (c && c.step) control = typePill(c);
    else if (c && c.arrange) {
      control = key(c.arranging() ? 'Done arranging' : 'Arrange', '⇅', () => { c.arrange(); drawBar(); }, 'toggle');
      control.setAttribute('aria-pressed', String(c.arranging()));
      if (c.depth) control = [control, depthPill(c.depth)];
    }
    const chips = el('div', { class: 'chips' }, bar.chips().map((ch) =>
      el('button', { type: 'button', class: `chip${ch.dashed ? ' dashed' : ''}`, textContent: ch.label, onpointerdown: keep, onclick: ch.run })));
    const more = key('More', '⋯', () => {
      const open = accessory.querySelector('.more-menu');
      if (open) { open.remove(); return; }
      accessory.querySelector('.accessory-inner').append(el('div', { class: 'more-menu', role: 'menu' },
        bar.more().map((m) => el('button', { type: 'button', role: 'menuitem', class: m.danger ? 'danger' : '', textContent: m.label,
          onpointerdown: keep, onclick: (e) => { e.currentTarget.parentElement.remove(); m.run(e); } }))));
    });
    accessory.querySelector('.accessory-inner').replaceChildren(...[
      key('Cancel', '✕', cancel),
      ...[control].flat(),
      chips,
      !editing.surface && viewsOf(editing.kind).length > 1 ? key('Open full screen', '⤢', () => surface(editing.card), 'way-up') : null,
      more,
      key('Done', '✓', finish, 'done')].filter(Boolean));
  }

  // A list item's depth, in a pill of the level pill's shape: its left
  // half out a level, its right half in (right is deeper, as a smaller
  // heading is); each dimmed where it cannot go. The caret stays.
  function depthPill(d) {
    const half = (label, symbol, can, run) => el('button', { type: 'button', class: 'chev', textContent: symbol, ariaLabel: label,
      disabled: !can(), onpointerdown: keep, onclick: () => { run(); drawBar(); } });
    return el('div', { class: 'level-pill depth-pill', role: 'group', ariaLabel: 'Depth' },
      half('Outdent', '‹', d.canOut, d.outdent), el('span', { class: 'pill-level', textContent: '•' }), half('Indent', '›', d.canIn, d.indent));
  }

  // A callout's type, in a pill of the level pill's shape: its halves
  // step back and on through the types. The caret stays in the words.
  function typePill(t) {
    const half = (label, symbol, by) => el('button', { type: 'button', class: 'chev', textContent: symbol, ariaLabel: label,
      onpointerdown: keep, onclick: () => { t.step(by); drawBar(); } });
    return el('div', { class: 'level-pill type-pill', role: 'group', ariaLabel: 'Callout type' },
      half('Previous type', '‹', -1), el('span', { class: 'pill-level', textContent: t.type(), style: `color: ${t.color()}` }), half('Next type', '›', 1));
  }

  // A heading's level, H1 to H6, in a pill: tap its left half for a
  // bigger heading, its right half for a smaller, or drag along it (a
  // step every 22px); arrow keys step it. The caret stays in the words.
  function levelPill(start, onLevel) {
    let level = start;
    const shown = el('span', { class: 'pill-level', textContent: `H${level}` });
    const pill = el('div', { class: 'level-pill', role: 'slider', tabIndex: -1, ariaLabel: 'Heading level' },
      el('span', { class: 'chev', textContent: '‹' }), shown, el('span', { class: 'chev', textContent: '›' }));
    const set = (n) => {
      n = Math.min(6, Math.max(1, n));
      if (n === level) return;
      level = n;
      shown.textContent = `H${n}`;
      pill.setAttribute('aria-valuenow', String(n));
      onLevel(n);
    };
    pill.setAttribute('aria-valuemin', '1');
    pill.setAttribute('aria-valuemax', '6');
    pill.setAttribute('aria-valuenow', String(level));
    pill.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      pill.setPointerCapture(e.pointerId);
      const x0 = e.clientX;
      const from = level;
      let dragged = false;
      const move = (ev) => {
        const dx = ev.clientX - x0;
        if (Math.abs(dx) > 4) dragged = true;
        if (dragged) set(from + Math.trunc(dx / 22));
      };
      const up = (ev) => {
        pill.removeEventListener('pointermove', move);
        pill.removeEventListener('pointerup', up);
        if (!dragged) { const r = pill.getBoundingClientRect(); set(level + (ev.clientX < r.left + r.width / 2 ? -1 : 1)); }
      };
      pill.addEventListener('pointermove', move);
      pill.addEventListener('pointerup', up);
    });
    pill.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); set(level - 1); }
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); set(level + 1); }
    });
    return pill;
  }

  // Keep the bar just above the keyboard.
  function placeAccessory() {
    const vv = window.visualViewport;
    if (!vv) return;
    const hidden = window.innerHeight - vv.height - vv.offsetTop;
    accessory.style.bottom = `${Math.max(0, hidden)}px`;
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', placeAccessory);
    window.visualViewport.addEventListener('scroll', placeAccessory);
  }

  // What ⋯ holds for every card, after what its kind offers: a card
  // added below it, it as its markdown, and its deleting.
  function cardActions(i, remove) {
    return [
      { label: 'Add card below', run: () => addBelow() },
      ...(editing && editing.view === 'Markdown' ? [] : [{ label: 'Edit as markdown',
        run: () => (editing.surface ? editing.show('Markdown') : surface(i, 'Markdown')) }]),
      ...(remove ? [removeAction(i)] : []),
    ];
  }

  // Done with this card, then a new one under what it became.
  function addBelow() {
    const { card } = editing;
    const before = file().source;
    if (!finish()) return;
    let after = card;
    if (file().source !== before) {
      const end = Math.max(changed[1], changed[0] + 1);
      after = lib.stack(file().source).cards.filter((c) => c.lines[0] < end).length - 1;
    }
    startNew(after);
  }

  // A new card after card `after` (-1: at the top), edited where it will
  // stand; written when done, and nothing if left empty.
  function startNew(after) {
    const editor = newCard(after);
    editor.el.classList.add('editor');
    const stackEl = stackHost.firstElementChild;
    const prev = stackHost.querySelector(`[data-card="${after}"]`);
    if (prev) prev.after(editor.el);
    else (stackEl.querySelector('.cards-group') || stackEl).prepend(editor.el);
    const start = stackEl.querySelector('.start');
    if (start) start.remove();
    stackEl.classList.add('is-editing');
    editing = { card: after, newAfter: after, kind: 'prose', editor, base: file().source };
    showAccessory();
    editor.focus();
  }

  function removeAction(i) {
    return {
      label: 'Delete card',
      danger: true,
      run: () => {
        const base = editing.base;
        stopEditing();
        try { commit(lib.replaceCard(base, i, null), 'Delete card'); } catch (err) { toast(plain(err.message)); }
        render();
      },
    };
  }

  // --- a record's actions ----------------------------------------------

  // What a record's heading offers in the bar: another like it, as a
  // chip; its moves and its deleting, under ⋯.
  function recordActions(g, key) {
    return {
      chips: [{ label: `+ ${key}`, run: () => { if (finish()) addRecord(g); } }],
      more: [
        { label: 'Move up', run: () => { if (finish()) moveRecord(g, -1); } },
        { label: 'Move down', run: () => { if (finish()) moveRecord(g, +1); } },
        { label: `Delete this ${key}`, danger: true, run: () => { cancel(); removeRecord(g); } },
      ],
    };
  }

  function moveRecord(g, by) {
    const st = lib.stack(file().source);
    try {
      if (by < 0) {
        if (g === 0 || st.groups[g - 1].heading === null) { toast('This is as high as it goes.'); return; }
        commit(lib.move(file().source, g, g - 1), 'Move up');
      } else {
        if (g + 1 >= st.groups.length) { toast('This is as low as it goes.'); return; }
        commit(lib.move(file().source, g, g + 2), 'Move down');
      }
    } catch (e) { toast(plain(e.message)); }
    render();
  }

  // Another record like this one, its name asked for in place.
  function addRecord(g) {
    const before = file().source;
    let next;
    try { next = lib.add(before, g, ''); } catch (e) { toast(plain(e.message)); return; }
    const st = lib.stack(next);
    const key = lib.stack(before).cards[lib.stack(before).groups[g].heading].blocks[0].record.key;
    file().source = next;
    render();
    startEditing(st.groups[g + 1].heading, { recordKey: key, restore: before });
  }

  function removeRecord(g) {
    try { commit(lib.remove(file().source, g), 'Delete record'); } catch (e) { toast(plain(e.message)); }
    render();
  }

  function openRecordSheet(g) {
    const st = lib.stack(file().source);
    const head = st.cards[st.groups[g].heading].blocks[0];
    const { key, name } = head.record;
    const shade = $('#shade');
    const close = () => { shade.hidden = true; };
    const del = el('button', { type: 'button', class: 'danger', textContent: `Delete this ${key}` });
    del.onclick = () => {
      if (!del.classList.contains('armed')) { del.classList.add('armed'); del.textContent = `Delete ${key}: ${name}`; return; }
      close(); removeRecord(g);
    };
    shade.replaceChildren(el('div', { class: 'sheet', role: 'dialog', ariaLabel: `${key}: ${name}` },
      el('h2', { textContent: `${key}: ${name}` }),
      el('button', { type: 'button', textContent: 'Move up', onclick: () => { close(); moveRecord(g, -1); } }),
      el('button', { type: 'button', textContent: 'Move down', onclick: () => { close(); moveRecord(g, +1); } }),
      el('button', { type: 'button', textContent: `Add another ${key}`, onclick: () => { close(); addRecord(g); } }),
      del,
      el('button', { type: 'button', textContent: 'Cancel', onclick: close })));
    shade.hidden = false;
    shade.onclick = (e) => { if (e.target === shade) close(); };
  }

  // --- taps ------------------------------------------------------------

  // --- done, while reading ------------------------------------------------

  // A list item swiped right uncovers a check; a tap on it marks the item
  // done, or not done again (the list's own way: a task item's box, any
  // other struck through). A task item's box, tapped, does it at once.
  // Only a list's own items; one edit each, undone as any other.
  const REVEAL = 56;
  let swipe = null;
  let swiped = false;
  const itemOf = (node) => {
    const li = node.closest('li');
    const card = li && li.closest('.cards-card');
    return card && card.classList.contains('cards-list') && !card.classList.contains('cards-rows') ? li : null;
  };
  // An item at any depth, found by the line it starts on.
  function markDone(li) {
    const card = Number(li.closest('.cards-card').dataset.card);
    const [start] = li.dataset.lines.split('-').map(Number);
    const n = lib.stack(file().source).cards[card].blocks[0].items.findIndex((it) => it.lines[0] === start);
    const done = li.classList.contains('cards-done');
    try { commit(lib.toggleDone(file().source, card, n), done ? 'Not done' : 'Done'); } catch (e) { toast(plain(e.message)); }
    render();
  }
  // --- a choice, while reading --------------------------------------------

  // A value taken in a select (lib/select.js: a step, a choice from its
  // wheel, New…'s words), or a rocker tapped: its row given it, one rows
  // edit (setRow, or insertRow where the file does not write it), undone
  // as any other. The words a written row already has write nothing.
  stackHost.addEventListener('cards-select', (e) => {
    if (readOnly || editing) return;
    if (buffer()) send(e.target, e.detail.value, e.detail.ends); else write(e.target, e.detail.value, e.detail.ends);
  });
  // A row given a value: written anew; or, where the file does not write it,
  // inserted where its field's map lists it (insertRow), the file one line longer
  // (a span's two rows, in one edit: writeSpan)
  function write(node, value, ends) {
    const { card, row, after } = placeOf(node);
    const st = lib.stack(file().source);
    const key = typeof row === 'string' ? row : st.cards[card].blocks[0].rows[row].key;
    try {
      if (ends !== undefined) commit(lib.writeSpan(file().source, (buffer() ? file().buffer : file()).fields, card, key, value, ends), `${key}: ${value} – ${ends}`);
      else commit(typeof row === 'string' ? lib.insertRow(file().source, card, after, row, value) : lib.setRow(file().source, card, row, value), `${key}: ${value}`);
    } catch (e) { toast(plain(e.message)); }
    render();
  }
  // A tap on a row the file does not write writes it, with its default
  function writeUnwritten(rowEl) {
    // a span's: written by its chip, both its lines at once, never one with no words
    if (rowEl.querySelector('[data-turn="span"]')) return;
    const { st, card, row } = placeOf(rowEl);
    const u = lib.unwritten(st, file().fields, card).find((x) => x.key === row);
    write(rowEl, (u && u.field.default) || '');
  }

  // --- a buffer: inputs go to the owner -----------------------------------

  // What the owner would hear (onInput, onAction), logged under the stack
  // as it arrives; the markdown is the owner's to draw again, never edited
  // here. The bench is no owner: the next version never comes.
  function hear(kind, said) {
    file().inputs = [...(file().inputs || []), `${kind} ${JSON.stringify(said)}`];
    drawInputs();
    toast(`${kind}: ${said.key}${'value' in said ? `: ${said.value}` : ` · ${said.name}`}`);
  }
  function drawInputs() {
    const log = $('#inputs');
    log.hidden = !buffer();
    log.replaceChildren(...(buffer() ? file().inputs || [] : []).map((t) => el('li', { textContent: t })));
    $('.phone > .hint').textContent = buffer()
      ? 'This page is its owner\'s. What you choose or write goes to the owner, logged below.'
      : HINT;
  }
  const HINT = $('.phone > .hint').textContent;
  // where a control stands: its card and row, by the lines they start on
  // (a row the file does not write: its key, and the row it would follow)
  function placeOf(node) {
    const card = Number(node.closest('.cards-card').dataset.card);
    const st = lib.stack(file().source);
    const fresh = node.closest('.cards-unwritten');
    if (fresh) return { st, card, row: fresh.dataset.key, after: Number(fresh.dataset.after) };
    const [start] = node.closest('[data-lines]:not(.cards-card)').dataset.lines.split('-').map(Number);
    return { st, card, row: st.cards[card].blocks[0].rows.findIndex((r) => r.lines[0] === start) };
  }
  function send(node, value, ends) {
    const { st, card, row } = placeOf(node);
    const input = lib.rowInput(st, file().buffer, card, row, value, ends);
    if (input) hear('onInput', input);
  }
  function buffered(e) {
    const rocker = e.target.closest('.cards-rocker');
    if (rocker) { send(rocker, rocker.dataset.value); return; }
    const act = e.target.closest('button[data-action]');
    if (act) {
      const { st, card, row } = placeOf(act);
      hear('onAction', { card, row, key: st.cards[card].blocks[0].rows[row].key, name: act.dataset.action });
    }
  }
  // a text row's words, committed (Return, or leaving the field)
  stackHost.addEventListener('change', (e) => {
    const text = e.target.closest('[data-text]');
    if (text && buffer()) send(text, text.value);
  });

  function cover() {
    stackHost.querySelectorAll('li.revealed').forEach((li) => {
      li.classList.remove('revealed');
      li.style.transform = '';
      li.querySelector(':scope > .done-reveal')?.remove();
    });
  }
  function reveal(li) {
    li.classList.add('revealed');
    li.style.transform = `translateX(${REVEAL}px)`;
    const done = li.classList.contains('cards-done');
    li.append(el('button', { type: 'button', class: 'done-reveal', ariaLabel: done ? 'Not done' : 'Done', textContent: '✓',
      onclick: (e) => { e.stopPropagation(); markDone(li); } }));
  }
  stackHost.addEventListener('pointerdown', (e) => {
    if (readOnly || buffer() || editing || e.target.closest('.done-reveal, .cards-check')) return;
    if (!e.target.closest('li.revealed')) cover();
    const li = itemOf(e.target);
    if (li && !li.classList.contains('revealed')) swipe = { li, x: e.clientX, y: e.clientY, dx: 0, on: false };
  });
  stackHost.addEventListener('pointermove', (e) => {
    if (!swipe) return;
    swipe.dx = e.clientX - swipe.x;
    const dy = e.clientY - swipe.y;
    if (!swipe.on && swipe.dx > 8 && swipe.dx > Math.abs(dy)) {
      swipe.on = true;
      swipe.li.setPointerCapture?.(e.pointerId);
      stackHost.classList.add('swiping'); // a swipe selects no words
      window.getSelection().removeAllRanges();
    }
    if (swipe.on) swipe.li.style.transform = `translateX(${Math.max(0, Math.min(swipe.dx, REVEAL + 16))}px)`;
  });
  stackHost.addEventListener('pointerup', () => {
    stackHost.classList.remove('swiping');
    if (!swipe) return;
    if (swipe.on) {
      swiped = true;
      if (swipe.dx > REVEAL * 0.6) reveal(swipe.li); else swipe.li.style.transform = '';
    }
    swipe = null;
  });
  stackHost.addEventListener('pointercancel', () => { if (swipe) swipe.li.style.transform = ''; swipe = null; });

  let pressTimer = null;
  let pressed = false;
  stackHost.addEventListener('pointerdown', (e) => {
    pressed = false;
    if (readOnly || buffer() || editing) return;
    const section = e.target.closest('.cards-group[data-group]');
    if (!section || e.target.closest('.record-more')) return;
    pressTimer = setTimeout(() => { pressed = true; openRecordSheet(Number(section.dataset.group)); }, 520);
  });
  const unpress = () => clearTimeout(pressTimer);
  stackHost.addEventListener('pointerup', unpress);
  stackHost.addEventListener('pointercancel', unpress);
  stackHost.addEventListener('pointermove', (e) => { if (Math.abs(e.movementY) + Math.abs(e.movementX) > 4) unpress(); });
  stackHost.addEventListener('contextmenu', (e) => { if (e.target.closest('.cards-group[data-group]')) e.preventDefault(); });

  stackHost.addEventListener('click', (e) => {
    if (pressed) { pressed = false; return; }
    if (swiped) { swiped = false; return; } // a swipe is no tap
    // a buffer: what the person does goes to its owner, never into the markdown
    if (buffer()) { buffered(e); return; }
    // read only: a link of the repo opens here, any other is followed; nothing is edited
    if (readOnly) {
      const a = e.target.closest('a');
      const to = a && source && file() && file().path && linked(file().path, a.getAttribute('href'));
      if (to) { e.preventDefault(); openFile(to); }
      return;
    }
    if (!editing && e.target.closest('.cards-check')) { const li = itemOf(e.target); if (li) markDone(li); return; }
    if (!editing && e.target.closest('.cards-rocker')) { const r = e.target.closest('.cards-rocker'); write(r, r.dataset.value); return; }
    // a row the file does not write: a tap writes it (it opens no editor)
    if (!editing && e.target.closest('.cards-unwritten')) { writeUnwritten(e.target.closest('.cards-unwritten')); return; }
    if (!editing && e.target.closest('li.revealed')) { cover(); return; }
    const more = e.target.closest('.record-more');
    if (more && !editing) { openRecordSheet(Number(more.dataset.group)); return; }
    if (editing) {
      // A tap outside the card is Done. (A tap whose target the editor
      // has just redrawn away is not outside: it came from inside.)
      if (e.target.isConnected && !e.target.closest('.editor')) finish();
      return;
    }
    // A link to a file of the folder opens it here, read from the open
    // file's folder; any other is followed, not edited.
    const a = e.target.closest('a');
    const to = a && source && file() && file().path && linked(file().path, a.getAttribute('href'));
    if (to) { e.preventDefault(); openFile(to); return; }
    if (a) return;
    if (e.target.closest('.start')) { startNew(-1); return; }
    const card = e.target.closest('.cards-card');
    // Where the finger landed: the caret goes there, in the same word.
    if (card) startEditing(Number(card.dataset.card), { point: { x: e.clientX, y: e.clientY } });
  });

  // --- the phone's bar ---------------------------------------------------

  const picker = $('#file');
  let made = 0; // files made here (New, Paste), named in turn
  function fillPicker() {
    picker.replaceChildren(...(files.length ? [] : [el('option', { value: '', textContent: 'No file open', selected: true, disabled: true })]),
      ...files.map((f, i) => el('option', { value: i, textContent: `${unsaved(f) ? '• ' : ''}${f.name}`, selected: i === current })),
      ...(served ? [] : [el('option', { value: 'new', textContent: 'New file' }),
        el('option', { value: 'paste', textContent: 'Paste markdown…' })]));
  }
  picker.addEventListener('change', () => {
    if (picker.value === 'paste') { fillPicker(); openPasteSheet(); return; }
    if (picker.value === 'new') {
      if (editing && !finish()) cancel();
      files.push({ name: `New ${++made}`, source: '', earlier: [] });
      current = files.length - 1; changed = null; fillPicker(); render();
      return;
    }
    if (editing && !finish()) cancel();
    if (served) settle();
    current = Number(picker.value);
    changed = null;
    render();
  });

  function openPasteSheet() {
    const shade = $('#shade');
    const ta = el('textarea', { placeholder: 'Paste any markdown here', ariaLabel: 'Markdown' });
    shade.replaceChildren(el('div', { class: 'sheet', role: 'dialog', ariaLabel: 'Paste markdown' },
      el('h2', { textContent: 'Your own markdown' }), ta,
      el('button', { type: 'button', textContent: 'Open as cards', onclick: () => {
        if (!ta.value.trim()) return;
        files.push({ name: `Pasted ${++made}`, source: ta.value, earlier: [] });
        current = files.length - 1; changed = null; shade.hidden = true; fillPicker(); render();
      } }),
      el('button', { type: 'button', textContent: 'Cancel', onclick: () => { shade.hidden = true; } })));
    shade.hidden = false;
    ta.focus();
  }

  $('#undo').addEventListener('click', undo);
  // How much of the edit state shows: the page's choice, CSS alone.
  const STYLES = ['quiet', 'fields', 'paper'];
  const styleButton = $('#edit-style');
  const setStyle = (name) => { document.documentElement.dataset.edit = name; styleButton.textContent = `Edit: ${name}`; };
  styleButton.addEventListener('click', () => setStyle(STYLES[(STYLES.indexOf(document.documentElement.dataset.edit) + 1) % STYLES.length]));
  setStyle('fields');
  $('#show-source').addEventListener('click', () => $('.source').classList.toggle('open'));
  $('#hide-source').addEventListener('click', () => $('.source').classList.remove('open'));

  // --- the folder's files, on the left (served only) ---------------------

  // A markdown file opens in the bench, once: opened again, it is the
  // one already open, with its edits. Any other opens in a tab of its own.
  let openedOne = false;
  // `stay`: the files stay shown on a phone's width (a folder's front page, opened with the folder, under its list)
  async function openFile(p, { stay = false } = {}) {
    if (!/\.(md|markdown)$/i.test(p)) { window.open(source.raw(p), '_blank', 'noopener'); return; }
    const open = files.findIndex((f) => f.path === p);
    if (open < 0) {
      let got;
      try { got = await source.read(p); } catch (e) { toast(e.message); return; }
      files.push({ name: p, path: p, source: got.text, saved: got.text, version: got.version, view: 'cards', earlier: [] });
    }
    // the first file opened takes the URL's place in the history; each after, a step of its own
    if (source.opened) source.opened(p, !openedOne);
    openedOne = true;
    settle();
    if (editing && !finish()) cancel();
    const was = current;
    current = open < 0 ? files.length - 1 : open;
    changed = null;
    fillPicker();
    render();
    markOpen();
    // another file opens at its top, not where the last was read
    if (current !== was) window.scrollTo(0, 0);
    // On a phone's width the files stand above the page: opened, it is
    // the page that is wanted, so they fold away (the button brings them back).
    if (NARROW.matches && !stay) fold(true);
  }
  // The files folded away, or shown. Narrow: editing.css's phone width.
  const NARROW = window.matchMedia('(max-width: 920px)');
  function fold(folded) {
    const button = $('#fold-files');
    document.body.classList.toggle('files-folded', folded);
    button.textContent = folded ? '>' : '<';
    button.title = folded ? 'Show the files' : 'Fold the files away';
    button.setAttribute('aria-expanded', String(!folded));
  }
  const markOpen = () => document.querySelectorAll('#files-tree button.file').forEach((b) => {
    b.classList.toggle('current', !!file() && b.dataset.path === file().path);
    const f = files.find((o) => o.path === b.dataset.path);
    b.classList.toggle('unsaved', !!f && unsaved(f));
  });

  // --- Cards | Md | Split, Save and Cancel (served only) -----------------

  // Unsaved: the file differs from what was last read or written.
  function unsaved(f) { return f.saved !== undefined && f.source !== f.saved; }
  const text = $('#source-text');
  const note = (f, words) => { f.note = { words, at: f.source }; };

  // What shows of the open file: its view, its markdown as text (set only
  // when the file changed elsewhere: typing keeps the two the same), and
  // whether there is aught to save.
  function drawServed() {
    const f = file();
    const view = f ? f.view : 'cards';
    document.body.dataset.view = view;
    document.querySelectorAll('#views button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === view)));
    text.disabled = !f;
    text.readOnly = readOnly;
    if (text.value !== (f ? f.source : '')) text.value = f ? f.source : '';
    const dirty = !!f && unsaved(f);
    $('#save').disabled = !dirty;
    $('#cancel').disabled = !dirty;
    // a note stands until the file changes again
    $('#save-note').textContent = f && f.note && f.note.at === f.source ? f.note.words : '';
    fillPicker();
    markOpen();
  }

  // Typing in Md: the cards follow once the typing pauses, and a run of
  // typing is one undo.
  let typing = null; // { file, before, timer }
  function settle() {
    if (!typing) return;
    clearTimeout(typing.timer);
    const { before } = typing;
    typing = null;
    if (file() && before !== file().source) { changed = touched(before, file().source); render(); }
  }

  async function save() {
    const f = file();
    if (!f || !unsaved(f)) return;
    if (editing && !finish()) cancel();
    settle();
    if (readOnly) return;
    const mine = f.source;
    const res = await source.write(f.path, mine, f.version);
    if (res.version) {
      f.saved = mine;
      f.version = res.version;
      note(f, 'Saved.');
    } else if (res.conflict) {
      // Changed on disk since it was opened: not written over. Opened
      // again from disk; the edits made here are one Undo away.
      let again;
      try { again = await source.read(f.path); } catch (e) { note(f, `Not saved: ${f.path} changed on disk, and could not be read again (${e.message}).`); render(); return; }
      const disk = again.text;
      f.earlier.push({ source: mine, label: 'Your earlier edits' });
      f.source = disk;
      f.saved = disk;
      f.version = again.version;
      changed = null;
      author = 'elsewhere'; // what another wrote, played as theirs
      note(f, `Not saved. ${f.path} changed on disk, so it was opened again. Undo brings your edits back.`);
    } else {
      note(f, `Not saved: ${res.error}`);
    }
    if (file() === f) render();
  }

  // Cancel: back to what was last saved, as one edit (Undo undoes it).
  function cancelAll() {
    const f = file();
    if (!f || !unsaved(f)) return;
    if (editing) cancel();
    settle();
    commit(f.saved, 'Cancel');
    render();
  }

  // A folder's rows, as a list (paths.js's listing: folders first, then
  // files, each its own row); a folder opens in place, below its name, and
  // opens its front page (its README.md, not a row) with the list kept.
  async function folder(p, into) {
    let listed;
    try { listed = await source.list(p); } catch (e) { toast(e.message); return { rows: [], front: null }; }
    into.replaceChildren(...listed.rows.map((f) => {
      const li = el('li');
      if (f.dir) {
        const kids = el('ul', { hidden: true });
        let inside = null;
        const toggle = async (e) => {
          const opening = kids.hidden;
          kids.hidden = !opening;
          e.currentTarget.setAttribute('aria-expanded', String(opening));
          if (!opening) return;
          inside ??= folder(f.path, kids);
          const { front } = await inside;
          if (front) openFile(front, { stay: true });
        };
        li.append(el('button', { type: 'button', class: 'dir', textContent: f.name, ariaExpanded: 'false', data: { path: f.path }, onclick: toggle }), kids);
      } else {
        li.append(el('button', { type: 'button', class: /\.(md|markdown)$/i.test(f.name) ? 'file' : 'file other',
          textContent: f.name, title: f.path, data: { path: f.path }, onclick: () => openFile(f.path) }));
      }
      return li;
    }));
    markOpen();
    return listed;
  }

  // --- settings (served only): cards.md's own choices, kept --------------
  //
  // What the server gives (GET /settings): each section's keys, each with
  // cards.md's value, the person's (~/.cards/config.md) and the folder's
  // (.cards/config.md), and whose is drawn; and the presets. The panel
  // stands over the files, at their width. The page's choices are
  // selects; space, type and the colours a preset each, whose values are
  // written as rows (Custom, when the values drawn match none). The
  // folder's values win, and are said once, at the top.
  function settingsPanel() {
    const S = window.cardsSettings;
    const panel = $('#settings');
    const body = $('#settings-body');
    const sheet = $('#cards-settings');
    let given = null; // the server's last answer
    let draft = null; // the person's values, as changed here: { Section: { key: value } }

    const keyOf = (sec, k) => given.sections.find((x) => x.name === sec).keys.find((x) => x.key === k);
    const defaultsOf = () => Object.fromEntries(given.sections.map((sec) => [sec.name, Object.fromEntries(sec.keys.map((k) => [k.key, k.default]))]));
    const saved = () => Object.fromEntries(given.sections.map((sec) => [sec.name,
      Object.fromEntries(sec.keys.filter((k) => 'person' in k).map((k) => [k.key, k.person]))]));
    const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
    // what is drawn: the folder's, else the person's as changed here, else cards.md's
    const drawn = (sec, k) => { const o = keyOf(sec, k); return 'folder' in o ? o.folder : k in draft[sec] ? draft[sec][k] : o.default; };
    const drawnAll = () => Object.fromEntries(given.sections.map((sec) => [sec.name, Object.fromEntries(sec.keys.map((o) => [o.key, drawn(sec.name, o.key)]))]));

    function apply() {
      const set = {};
      for (const sec of given.sections) {
        set[sec.name] = {};
        for (const o of sec.keys) if ('folder' in o || o.key in draft[sec.name]) set[sec.name][o.key] = drawn(sec.name, o.key);
      }
      sheet.textContent = S.css(set, defaultsOf(), given.themes);
      for (const [k, v] of Object.entries(S.attributes(set.Page))) {
        if (v) document.documentElement.dataset[k] = v; else delete document.documentElement.dataset[k];
      }
      drawPictures(); // the measure may have moved with the type
      const dirty = !same(draft, saved());
      $('#settings-save').disabled = !dirty;
      $('#settings-cancel').disabled = !dirty;
      $('#open-settings').classList.toggle('unsaved', dirty);
    }

    // A choice, as a labelled select; Custom offered only when it is so.
    function select(label, options, value, onchange) {
      const id = `set-${label.toLowerCase()}`;
      return el('div', { class: 'setting' },
        el('label', { htmlFor: id, textContent: label }),
        el('select', { id, onchange: (e) => onchange(e.target.value) },
          options.map((o) => el('option', { value: o, textContent: o, selected: o === value }))));
    }

    function draw() {
      $('#settings-file').textContent = given.person;
      // the folder's file, said once: which keys it sets
      const theirs = given.sections.flatMap((sec) => sec.keys.filter((o) => 'folder' in o)
        .map((o) => (sec.name === 'Light' || sec.name === 'Dark' ? `${sec.name.toLowerCase()} ${o.key}` : o.key)));
      const folderNote = $('#settings-folder');
      folderNote.hidden = !theirs.length;
      folderNote.textContent = theirs.length
        ? `This folder's ${given.folder} sets ${theirs.length > 1 ? `${theirs.slice(0, -1).join(', ')} and ${theirs[theirs.length - 1]}` : theirs[0]}.` : '';
      $('#settings-skipped').replaceChildren(...given.skipped.map((x) => el('li', {
        textContent: `${x.file === 'folder' ? given.folder : given.person}, line ${x.line}: ${x.key}: ${x.value} is not read (${x.why}).` })));
      const now = drawnAll();
      const defaults = defaultsOf();
      const page = given.sections.find((x) => x.name === 'Page').keys.map((o) => select(o.key[0].toUpperCase() + o.key.slice(1), o.choices, now.Page[o.key], (v) => {
        if (v === o.default) delete draft.Page[o.key]; else draft.Page[o.key] = v;
        changed();
      }));
      const presets = Object.entries(given.presets).map(([group, list]) => {
        const at = S.presetOf(list, now);
        const names = list.map((p) => p.name).concat(at === 'Custom' ? ['Custom'] : []);
        return select(group, names, at, (name) => {
          const p = list.find((x) => x.name === name);
          if (!p) return; // Custom: nothing changes
          Object.assign(draft, S.chosen(p, defaults));
          changed();
        });
      });
      body.replaceChildren(...page, ...presets);
      apply();
    }
    function changed() { $('#settings-note').textContent = ''; draw(); }

    function adopt(answer) {
      given = answer;
      if (answer.motion) motion = answer.motion;
      const was = JSON.stringify(colours);
      colours = answer.colours || {};
      if (JSON.stringify(colours) !== was) render();
      draft = saved();
      draw();
    }

    async function load() {
      try { adopt(await source.settings.load()); } catch (e) { toast(e.message); }
    }

    async function save() {
      const res = await source.settings.save(draft, given.version);
      if (res.answer) {
        adopt(res.answer);
        $('#settings-note').textContent = `Saved to ${given.person}.`;
      } else if (res.conflict) {
        // Changed on disk since it was read: not written over. Read again,
        // and the changes made here are one step away, as a file's Undo.
        const mine = draft;
        await load();
        const noteEl = $('#settings-note');
        noteEl.textContent = `Not saved: ${given.person} changed on disk since it was read, so it is read again. `;
        noteEl.append(el('button', { type: 'button', class: 'pill', textContent: 'Apply mine again',
          onclick: () => { draft = mine; draw(); noteEl.textContent = 'Yours again, over what is on disk now: Save writes them.'; } }));
      } else {
        $('#settings-note').textContent = `Not saved: ${res.error}`;
      }
    }

    const opener = $('#open-settings');
    const show = (open) => {
      panel.hidden = !open;
      document.body.classList.toggle('settings-open', open);
      opener.setAttribute('aria-expanded', String(open));
      if (open) $('#close-settings').focus(); else opener.focus();
    };
    opener.addEventListener('click', () => show(panel.hidden));
    $('#close-settings').addEventListener('click', () => show(false));
    $('#settings-save').addEventListener('click', save);
    $('#settings-cancel').addEventListener('click', () => { draft = saved(); changed(); });
    window.addEventListener('beforeunload', (e) => { if (given && !same(draft, saved())) e.preventDefault(); });
    load();
  }

  if (served) {
    document.body.classList.add('served');
    // wide until the settings say otherwise (proto/settings.js)
    document.documentElement.dataset.width = 'wide';
    $('#views').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-view]');
      if (!b || !file()) return;
      if (b.dataset.view === 'md' && editing && !finish()) cancel();
      settle();
      file().view = b.dataset.view;
      drawServed();
    });
    // An edit begun in Md ends the card being edited, as a tap outside it does.
    text.addEventListener('focus', () => { if (editing && !finish()) cancel(); });
    text.addEventListener('input', () => {
      const f = file();
      if (!f) return;
      if (!typing) {
        typing = { before: f.source };
        f.earlier.push({ source: f.source, label: 'Typing in Md' });
      }
      f.source = text.value;
      clearTimeout(typing.timer);
      typing.timer = setTimeout(settle, 250);
      $('#save').disabled = $('#cancel').disabled = !unsaved(f);
    });
    text.addEventListener('blur', settle);
    $('#save').addEventListener('click', save);
    $('#cancel').addEventListener('click', cancelAll);
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); }
    });
    window.addEventListener('beforeunload', (e) => { if (files.some(unsaved)) e.preventDefault(); });
    $('#fold-files').addEventListener('click', () => fold(!document.body.classList.contains('files-folded')));
    if (readOnly) document.body.classList.add('readonly');
    if (source) {
      $('.files h2 span').textContent = source.name;
      const top = folder('', $('#files-tree'));
      settingsPanel();
      // the file the URL names, or the folder's front page (its README.md), opened first
      (source.start ? source.start() : top.then((l) => l.front)).then((p) => (p ? openFile(p) : null), (e) => toast(e.message));
      // back and forward: the file the URL then names
      window.addEventListener('popstate', () => { const r = S.route(location.pathname); if (r && r.kind === 'blob' && r.path) openFile(r.path); });
    } else {
      // no repo named: what this is, and how to open one
      $('.files h2 span').textContent = 'cards.md';
      files.push({ name: 'Start', path: null, source: served.start || '', view: 'cards', earlier: [] });
      current = 0;
      $('#open-settings').hidden = true;
    }
  }

  fillPicker();
  render();
}());
</script>
