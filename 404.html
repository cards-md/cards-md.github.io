/* cards.md: a stack of cards. Warm ground, white cards, hairline
   borders; Public Sans and IBM Plex Mono when the page loads them.

   Headings and prose sit on the ground; lists, code, quotes, tables,
   HTML and images are boxed cards. Four choices belong to the page,
   each an ancestor attribute: data-theme ("light", "dark"; the system
   otherwise), data-prose="card" (prose boxed too),
   data-merge="group" (a heading's cards drawn as one), and
   data-width="wide" (cards at the measure, tables and pictures as wide
   as they are). A fifth, data-trim, trims text to its ink.

   The layout, the same in CardsUI (StackView.swift), in three rules:

   1. One column. Every block starts at margin + inset from the stack's
      edge, on the ground or in a card: its first mark stands there, be
      it a letter, a list's marker or a quote's rule. A card's box hangs
      outward from the column, its edge at margin. Borders take no space
      (drawn inside, as a shadow).
   2. Space belongs to containers. The stack parts groups, a group parts
      its cards, a card parts its lines; no card has an outer margin.
   3. The column's measures, the type and the edit state are tokens
      (design/tokens.json), written below; the smaller spacings are this
      file's own. */

/* tokens: written from design/tokens.json by `npm run tokens`; do not edit */
:root {
  --cards-margin: 10px;
  --cards-inset: 15px;
  --cards-inset-block: 12px;
  --cards-group-gap: 20px;
  --cards-card-gap: 10px;
  --cards-line-gap: 10px;
  --cards-marker-gap: 6px;
  --cards-quote-rule: 3px;
  --cards-quote-gap: 10px;
  --cards-radius: 10px;
  --cards-hairline: 1px;
  --cards-cell-max: 240px;
  --cards-target: 44px;
  --cards-h1-size: 28px;
  --cards-h1-weight: 700;
  --cards-h1-line: 1.2;
  --cards-h1-tracking: 0em;
  --cards-h2-size: 20px;
  --cards-h2-weight: 650;
  --cards-h2-line: 1.25;
  --cards-h2-tracking: 0em;
  --cards-h3-size: 18px;
  --cards-h3-weight: 600;
  --cards-h3-line: 1.35;
  --cards-h3-tracking: 0em;
  --cards-h4-size: 16px;
  --cards-h4-weight: 700;
  --cards-h4-line: 1.5;
  --cards-h4-tracking: 0em;
  --cards-body-size: 16px;
  --cards-body-weight: 400;
  --cards-body-line: 1.5;
  --cards-body-tracking: 0em;
  --cards-row-size: 15px;
  --cards-row-weight: 400;
  --cards-row-line: 1.4;
  --cards-row-tracking: 0em;
  --cards-label-size: 11px;
  --cards-label-weight: 600;
  --cards-label-line: 1.3;
  --cards-label-tracking: 0em;
  --cards-mono-size: 13px;
  --cards-mono-weight: 400;
  --cards-mono-line: 1.55;
  --cards-mono-tracking: 0em;
  --cards-quiet-size: 13px;
  --cards-quiet-weight: 400;
  --cards-quiet-line: 1.4;
  --cards-quiet-tracking: 0em;
  --cards-font-bullet: 0.313em;
  --cards-font-figure: 0.688em;
  --cards-font-period: 0.313em;
  --cards-edit-ring: 2px;
  --cards-edit-bleed: 4px;
  --cards-edit-field: 8%;
  --cards-edit-field-focus: 16%;
  --cards-edit-surface: 5%;
  --cards-edit-dim-others: 0.35;
  --cards-edit-dim-group: 0.6;

/* end tokens */

.cards-stack {
  --cards-ground: #F3F0EB; --cards-card: #FFFFFF;
  --cards-hair: rgba(36,31,26,0.14); --cards-sep: rgba(36,31,26,0.10);
  --cards-ink: #241F1A; --cards-ink2: #5F554C; --cards-ink3: #71665B;
  --cards-accent: #74604A; --cards-chip: #ECE6DE;
  --cards-code-bg: #241F1A; --cards-code-ink: #EDE6DC; --cards-code-border: transparent;
  --cards-edge: rgba(36,31,26,0.12);
  --cards-note: #0964CF; --cards-tip: #187734; --cards-important: #794ACF; --cards-warning: #8C5E00; --cards-caution: #C9212D;
  /* a chart's series, six apart for every eye; the seventh on, ink3 */
  --cards-series-1: #259CDE; --cards-series-2: #B28C39; --cards-series-3: #E15E8E; --cards-series-4: #5C6C14; --cards-series-5: #395EB2; --cards-series-6: #A32C74;

    --cards-ink: #EDE6DC; --cards-ink2: #BDB2A6; --cards-ink3: #A09488;
    --cards-accent: #CDB594; --cards-chip: #2F2924;
    --cards-code-bg: #0E0C0B; --cards-code-ink: #E6DED3; --cards-code-border: rgba(237,230,220,0.10);
    --cards-edge: rgba(0,0,0,0.45);
    --cards-note: #4493F8; --cards-tip: #3FB950; --cards-important: #AB7DF8; --cards-warning: #D29922; --cards-caution: #F85B54;
    --cards-series-1: #6BBAF0; --cards-series-2: #F7BF77; --cards-series-3: #F889AD; --cards-series-4: #3CB173; --cards-series-5: #A97CF0; --cards-series-6: #B85AA8;
  }
}
[data-theme="dark"] .cards-stack {
  --cards-ground: #141210; --cards-card: #201C18;
  --cards-hair: rgba(237,230,220,0.12); --cards-sep: rgba(237,230,220,0.09);
  --cards-ink: #EDE6DC; --cards-ink2: #BDB2A6; --cards-ink3: #A09488;
  --cards-accent: #CDB594; --cards-chip: #2F2924;
  --cards-code-bg: #0E0C0B; --cards-code-ink: #E6DED3; --cards-code-border: rgba(237,230,220,0.10);
  --cards-edge: rgba(0,0,0,0.45);
  --cards-note: #4493F8; --cards-tip: #3FB950; --cards-important: #AB7DF8; --cards-warning: #D29922; --cards-caution: #F85B54;
  --cards-series-1: #6BBAF0; --cards-series-2: #F7BF77; --cards-series-3: #F889AD; --cards-series-4: #3CB173; --cards-series-5: #A97CF0; --cards-series-6: #B85AA8;

/* the stack, its groups, its cards (rule 2) */
.cards-stack {
  background: var(--cards-ground); color: var(--cards-ink);
  font: var(--cards-body-weight) var(--cards-body-size)/var(--cards-body-line) var(--cards-sans);
  padding: 12px var(--cards-margin) 32px; display: flex; flex-direction: column; gap: var(--cards-group-gap);
  overflow-wrap: anywhere;
}
/* WebKit sets editable text with its spaces hanging at a line's end
   (line-break: after-white-space, which no style undoes); read text is
   set so too, so opening a card wraps no line differently. Other
   engines ignore the value, and differ in neither. */
.cards-stack :is(p, li, dt, dd, h1, h2, h3, h4, h5, h6, pre) { line-break: after-white-space; }
.cards-stack a { color: var(--cards-accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
.cards-stack code { font: 400 0.88em/1.4 var(--cards-mono); background: var(--cards-chip); padding: 1px 5px; border-radius: 5px; }
.cards-group { display: flex; flex-direction: column; gap: var(--cards-card-gap); }
.cards-card { margin: 0; }

/* headings: type, not boxes; the level is a styling hook */
.cards-heading { font: var(--cards-h3-weight) var(--cards-h3-size)/var(--cards-h3-line) var(--cards-sans); text-wrap: balance; margin: 0; }
.cards-heading[data-level="1"] { font: var(--cards-h1-weight) var(--cards-h1-size)/var(--cards-h1-line) var(--cards-sans); }
.cards-heading[data-level="2"] { font: var(--cards-h2-weight) var(--cards-h2-size)/var(--cards-h2-line) var(--cards-sans); }
.cards-heading[data-level="4"], .cards-heading[data-level="5"], .cards-heading[data-level="6"] {
  font: var(--cards-h4-weight) var(--cards-h4-size)/var(--cards-h4-line) var(--cards-sans);
  letter-spacing: var(--cards-h4-tracking); color: var(--cards-ink2);
}
/* a record's key: a small label over its name */
.cards-record-key {
  display: block; margin-bottom: 2px; font: var(--cards-label-weight) var(--cards-label-size)/var(--cards-label-line) var(--cards-sans);
  letter-spacing: var(--cards-label-tracking); color: var(--cards-ink2);
}

/* ground text on the column (rule 1) */
.cards-heading, .cards-prose { padding: 0 var(--cards-inset); }
.cards-prose { display: flex; flex-direction: column; gap: var(--cards-line-gap); }
.cards-prose p { margin: 0; }

/* the boxed kinds: edge at margin, text at margin + inset (rule 1) */
.cards-list, .cards-code, .cards-quote, .cards-table, .cards-html, .cards-image, .cards-footnotes {
  background: var(--cards-card); border-radius: var(--cards-radius); overflow: hidden;
  box-shadow: inset 0 0 0 var(--cards-hairline) var(--cards-hair);
}
.cards-list, .cards-quote, .cards-html, .cards-footnotes { padding: var(--cards-inset-block) var(--cards-inset); }

/* lists: a list's first mark is its marker, so the marker stands on the
   column and the words follow it, as in the source (`- ` then the
   words). A list's markers share one column, as wide as its widest
   (numbers right-aligned in it, so 9. and 10. line up), then markerGap,
   then every item's words on one edge. A nested list does the same from
   its item's words. */
.cards-list ul, .cards-list ol {
  margin: 0; list-style: none;
  padding-left: calc(var(--marker-box) + var(--cards-marker-gap));
}
.cards-list ul { --marker-box: var(--cards-font-bullet); }
.cards-list ol { --digits: 1; --marker-box: calc(var(--digits) * var(--cards-font-figure) + var(--cards-font-period)); }
.cards-list ol[data-digits="2"], .cards-list li ol:has(> li:nth-child(10)) { --digits: 2; }
.cards-list ol[data-digits="3"], .cards-list li ol:has(> li:nth-child(100)) { --digits: 3; }
.cards-list ol[data-digits="4"] { --digits: 4; }
.cards-list li { margin: 0; position: relative; }
.cards-list li + li { margin-top: 6px; }
.cards-list li p { margin: 6px 0; }
.cards-list li ul, .cards-list li ol { margin-top: 6px; }
.cards-list li::before {
  position: absolute; left: calc(-1 * (var(--marker-box) + var(--cards-marker-gap))); width: var(--marker-box);
  color: var(--cards-ink3);
}
.cards-list ul > li::before { content: '•'; text-align: left; }
.cards-list ol > li::before { content: counter(list-item) '.'; text-align: right; font-variant-numeric: tabular-nums; }
/* done: a task item's box where its marker would be (a task list's
   markers as wide as a box); a done item's words quieter */
.cards-list [data-tasks] { --marker-box: 1.05em; }
.cards-list li.cards-task::before { content: none; }
.cards-check { position: absolute; left: calc(-1 * (var(--marker-box) + var(--cards-marker-gap)));
  top: calc((1lh - 1em) / 2); width: 1em; height: 1em; box-sizing: border-box;
  border: 1.5px solid var(--cards-ink3); border-radius: 4px; }

.cards-check[aria-checked="true"]::after { content: ''; position: absolute; left: 0.3em; top: 0.1em; width: 0.25em; height: 0.5em;
  border: solid var(--cards-card); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.cards-list li.cards-done { color: var(--cards-ink3); }
/* a step's sign where its bullet would be, in its tone (a list with
   signs makes its markers room for one) */
.cards-list [data-signs] { --marker-box: 1.05em; }
/* as weighty as the tones below, so they win (above the bullet's ul > li) */
.cards-list li.cards-sign::before { content: attr(data-sign); text-align: center; color: var(--cards-ink3); }
.cards-list li.cards-sign-tip::before { color: var(--cards-tip); }
.cards-list li.cards-sign-note::before { color: var(--cards-note); }
.cards-list li.cards-sign-warning::before { color: var(--cards-warning); }
.cards-list li.cards-sign-caution::before { color: var(--cards-caution); }

/* rows: a key on the column, its value beside it when it fits on one
   line there and under it when not: the row wraps, and a lone item on a
   space-between line sits at its start. Nothing is cut short, and no
   length is guessed (CardsUI: RowLayout). A hairline between rows
   starts on the column too. */
.cards-rows { padding: 0; }
.cards-rows dl { margin: 0; }
.cards-row {
  margin-left: var(--cards-inset); padding: var(--cards-inset-block) var(--cards-inset) var(--cards-inset-block) 0;
  display: flex; flex-wrap: wrap; column-gap: 12px; row-gap: 2px;
  justify-content: space-between; align-items: baseline;
  font-size: var(--cards-row-size); line-height: var(--cards-row-line);
}
.cards-row + .cards-row { border-top: var(--cards-hairline) solid var(--cards-sep); }
.cards-row dt { color: var(--cards-ink2); font-size: inherit; }
.cards-row dd { margin: 0; min-width: 0; font-size: inherit; }
.cards-row-body { flex-direction: column; gap: 4px; }
.cards-row dd ul, .cards-row dd ol { margin: 6px 0 0; padding-left: 20px; }

/* a row drawn as a choice (the host's choices): the select, one chip,
   ‹ value ›, turned through the values (lib/select.js); or a rocker, on and off. Each keeps to the
   row's line, so a row is as tall chosen as written: the chip's pill is
   drawn outward (::before), into the row's own inset, never laid out. */
.cards-select { --select-rise: 8px; position: relative; display: inline-grid; grid-template-columns: auto minmax(0, auto) auto;
  align-items: center; max-width: 100%; min-width: 0; height: calc(var(--cards-row-line) * 1em); vertical-align: middle;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  cursor: grab; outline: none; }
.cards-select[hidden] { display: none; }
/* depth (the person, 10-20): a drum seen side on, its ends turning away into the ground */
.cards-select::before { content: ''; position: absolute; z-index: 0; inset: calc(-1 * var(--select-rise)) 0; border-radius: 999px;
  background: linear-gradient(90deg, var(--cards-card), var(--cards-chip) 24%, var(--cards-chip) 76%, var(--cards-card));
  box-shadow: inset 0 0 0 var(--cards-hairline) var(--cards-hair),
    inset 6px 0 6px -6px color-mix(in srgb, var(--cards-ink) 18%, transparent), inset -6px 0 6px -6px color-mix(in srgb, var(--cards-ink) 18%, transparent); }
.cards-select:focus-visible::before { box-shadow: 0 0 0 2px var(--cards-accent), inset 0 0 0 var(--cards-hairline) var(--cards-hair); }
.cards-select.cards-select-lifted { visibility: hidden; }
.cards-select > * { position: relative; z-index: 1; }
.cards-select-step { width: 1.6em; font-size: 1.25em; line-height: 1; text-align: center; color: var(--cards-ink2); cursor: pointer; }
/* tapped by a finger: the target as tall as one, whatever the chip's own */
.cards-select-step::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: var(--cards-target); transform: translateY(-50%); }
.cards-select-step[aria-disabled="true"] { opacity: 0.25; cursor: default; }
@media (hover: hover) { .cards-select-step:not([aria-disabled="true"]):hover { color: var(--cards-accent); } }
/* every value in one place, the one shown seen: the chip as wide as its longest */
.cards-select-values { display: grid; min-width: 0; }
.cards-select-values > * { grid-area: 1 / 1; visibility: hidden; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  text-align: center; color: var(--cards-accent); font-weight: var(--cards-label-weight); }
.cards-select-values > .cards-select-at { visibility: visible; }
.cards-select-values .cards-count { display: none; }
.cards-select-written { color: var(--cards-ink); font-weight: inherit; }
/* no words and no default: "Choose", in quiet ink, never the accent, so it never reads as a value picked */
.cards-select-values > .cards-select-choose { color: var(--cards-ink3); }
/* an open list's New…: the chip becomes a field for the words, with ✕ and Done */
.cards-select-new { display: inline-flex; align-items: center; gap: 12px; max-width: 100%; min-width: 0; height: calc(var(--cards-row-line) * 1em); }
.cards-select-new input { flex: 1 1 8em; min-width: 0; width: 10em; height: 100%; margin: 0; padding: 0 0.6em; border: none; border-radius: 999px;
  font: inherit; line-height: inherit; color: var(--cards-ink); background: var(--cards-card); outline: none;
  box-shadow: 0 0 0 var(--select-rise, 8px) var(--cards-card), 0 0 0 calc(var(--select-rise, 8px) + 1px) var(--cards-accent); }
.cards-select-new button { position: relative; flex: none; margin: 0; padding: 0 0.6em; border: none; border-radius: 999px; font: inherit; line-height: inherit;
  color: var(--cards-ink2); background: var(--cards-chip); cursor: pointer; box-shadow: 0 0 0 5px var(--cards-chip), 0 0 0 6px var(--cards-hair); }
.cards-select-new button::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: var(--cards-target); transform: translateY(-50%); }
.cards-select-new .cards-select-done { color: var(--cards-accent); box-shadow: 0 0 0 5px var(--cards-chip), 0 0 0 6px var(--cards-accent); }
/* the wheel, over the page (lib/select.js draws it in the body, the stack's colours copied onto it) */
.cards-wheel { position: fixed; inset: 0; z-index: 50; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  font: var(--cards-label-weight) var(--cards-row-size) var(--cards-sans); color: var(--cards-ink); }
.cards-wheel[hidden] { display: none; }
.cards-wheel-scrim { position: absolute; inset: 0; background: color-mix(in srgb, var(--cards-ground) 93%, transparent); }
.cards-wheel-lens { position: absolute; border-radius: 999px; background: var(--cards-card); box-shadow: 0 0 0 var(--cards-hairline) var(--cards-accent); }
.cards-wheel-lens.cards-wheel-tick { animation: cards-wheel-tick 110ms ease-out; }
@keyframes cards-wheel-tick { from { box-shadow: 0 0 0 var(--cards-hairline) var(--cards-accent), 0 0 0 3px color-mix(in srgb, var(--cards-accent) 35%, transparent); }
  to { box-shadow: 0 0 0 var(--cards-hairline) var(--cards-accent); } }
.cards-wheel-list { position: absolute; top: 0; height: 0; outline: none; }
.cards-wheel-item { position: absolute; left: 0; top: -22px; width: 100%; height: 44px; display: grid; place-items: center; will-change: transform; }
.cards-wheel-words { grid-area: 1 / 1; max-width: 100%; padding: 0 12px; box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 44px; }
.cards-wheel-item.cards-wheel-in .cards-wheel-words { color: var(--cards-accent); }
.cards-wheel-item.cards-wheel-now .cards-wheel-words::after { content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 3px; background: var(--cards-accent); margin-left: 6px; vertical-align: middle; }
.cards-wheel-item.cards-wheel-new .cards-wheel-words { color: var(--cards-ink2); font-style: italic; }
.cards-wheel-dash { grid-area: 1 / 1; width: 22px; height: 2px; border-radius: 1px; background: var(--cards-ink3); }
.cards-wheel-more { position: absolute; font: 500 var(--cards-label-size) var(--cards-mono); color: var(--cards-ink3); text-align: center; pointer-events: none; }
/* a field's chip (lib/turns.js): the date, the time, the span, the number, the

   row's inset, its ends shading into the card, so a row is as tall chosen as
   written. As wide as its longest words (`data-size`), so the arrows never move. */
.cards-turn { --select-rise: 8px; position: relative; display: inline-grid; grid-template-columns: auto minmax(0, auto) auto; align-items: center;
  max-width: 100%; min-width: 0; height: calc(var(--cards-row-line) * 1em); vertical-align: middle; font-variant-numeric: tabular-nums;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  cursor: grab; outline: none; }
.cards-turn[hidden] { display: none; }
.cards-turn::before { content: ''; position: absolute; z-index: 0; inset: calc(-1 * var(--select-rise)) 0; border-radius: 999px;
  background: linear-gradient(90deg, var(--cards-card), var(--cards-chip) 24%, var(--cards-chip) 76%, var(--cards-card));
  box-shadow: inset 0 0 0 var(--cards-hairline) var(--cards-hair),
    inset 6px 0 6px -6px color-mix(in srgb, var(--cards-ink) 18%, transparent), inset -6px 0 6px -6px color-mix(in srgb, var(--cards-ink) 18%, transparent); }
.cards-turn:focus-visible::before, .cards-turn.cards-turn-typing::before { box-shadow: 0 0 0 2px var(--cards-accent), inset 0 0 0 var(--cards-hairline) var(--cards-hair); }
.cards-turn.cards-turn-live::before, .cards-turn.cards-turn-open::before { background: color-mix(in srgb, var(--cards-accent) 18%, var(--cards-chip)); }
.cards-turn > * { position: relative; z-index: 1; }
.cards-turn-step { width: 1.6em; font-size: 1.25em; line-height: 1; text-align: center; color: var(--cards-ink2); cursor: pointer; }
.cards-turn-step::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: var(--cards-target); transform: translateY(-50%); }
.cards-turn-step[aria-disabled="true"] { opacity: 0.25; cursor: default; }
@media (hover: hover) { .cards-turn-step:not([aria-disabled="true"]):hover { color: var(--cards-accent); } }
.cards-turn-words { display: inline-block; text-align: center; justify-items: center; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--cards-accent); font-weight: var(--cards-label-weight); }
.cards-turn-words[data-size] { display: inline-grid; }
.cards-turn-words[data-size] > * { grid-row: 1; }
.cards-turn-words[data-size]::after { content: attr(data-size); grid-area: 1 / 1 / 2 / 99; height: 0; visibility: hidden; overflow: hidden; }
.cards-turn-written { color: var(--cards-ink); font-weight: inherit; }
/* nothing written and no default: Choose, in quiet ink, never the accent */
.cards-turn-choose { color: var(--cards-ink3); }
.cards-turn-as { grid-column: 1 / 99; }

.cards-chart-series { display: flex; justify-content: space-between; gap: 8px; margin: 0;

.cards-photo img { object-fit: cover; background: var(--cards-hair); }

  flex: 1 1 auto; min-width: 0; overflow-x: auto;
  background:
    linear-gradient(to right, var(--cards-card) 40%, transparent) left / 28px 100% no-repeat local,
    linear-gradient(to left, var(--cards-card) 40%, transparent) right / 28px 100% no-repeat local,
    linear-gradient(to right, color-mix(in srgb, var(--cards-ink) 14%, transparent), transparent) left / 16px 100% no-repeat scroll,
    linear-gradient(to left, color-mix(in srgb, var(--cards-ink) 14%, transparent), transparent) right / 16px 100% no-repeat scroll,
    var(--cards-card);
}
.cards-grid-cells > .cards-chart { max-width: none; }

/* table: every cell drawn; a cell's words in a box as wide as they are,
   up to the cells' measure (cellMax), past which they wrap: a short cell
   stays on one line (never squeezed to fit: the table scrolls first),
   a long one never stretches the table. Figures are
   tabular. Wider than its card, it scrolls sideways inside it, never the
   page, and a shade at an edge says there is more that way (the ink, faint,
   never --cards-edge, the card's shadow, which a flat theme clears; drawn by
   the background alone: the covers scroll with the table, the shades
   stay with the card). Its first column on the column; its last as far
   from the card's edge. */
.cards-table {
  overflow-x: auto;
  background:
    linear-gradient(to right, var(--cards-card) 40%, transparent) left / 28px 100% no-repeat local,
    linear-gradient(to left, var(--cards-card) 40%, transparent) right / 28px 100% no-repeat local,
    linear-gradient(to right, color-mix(in srgb, var(--cards-ink) 14%, transparent), transparent) left / 16px 100% no-repeat scroll,
    linear-gradient(to left, color-mix(in srgb, var(--cards-ink) 14%, transparent), transparent) right / 16px 100% no-repeat scroll,
    var(--cards-card);
}
.cards-table table { border-collapse: collapse; min-width: 100%;
  font: 400 14px/1.35 var(--cards-sans); font-variant-numeric: tabular-nums; }
.cards-table th, .cards-table td { padding: 9px 12px; text-align: left; vertical-align: top; }
.cards-table th { font: 600 11px/1.3 var(--cards-mono); color: var(--cards-ink3); }
.cards-table tbody td { border-top: var(--cards-hairline) solid var(--cards-sep); }
/* a head of no words draws no head row: no rule over the first row then */
.cards-table tbody:first-child tr:first-child td { border-top: 0; }
.cards-table th:first-child, .cards-table td:first-child { padding-left: var(--cards-inset); }
.cards-table th:last-child, .cards-table td:last-child { padding-right: var(--cards-inset); }
.cards-cell { display: inline-block; vertical-align: top; width: max-content; max-width: var(--cards-cell-max);
  white-space: normal; overflow-wrap: break-word; text-align: inherit; }

/* HTML is shown as text */
.cards-html { white-space: pre-wrap; font: 400 12px/1.5 var(--cards-mono); color: var(--cards-ink3); }

/* images: edge to edge in their card */
.cards-image { display: flex; flex-direction: column; gap: 2px; }
.cards-image img { display: block; width: 100%; height: auto; }
/* an image among words: a chip in the line, its words marked as an image */
.cards-image-chip { display: inline-flex; align-items: baseline; gap: 0.35em; padding: 0 0.4em; border-radius: 5px;
  background: var(--cards-chip); color: var(--cards-ink2); font-size: 0.92em; white-space: nowrap; }
.cards-image-chip::before { content: ''; align-self: center; width: 0.85em; height: 0.66em; border: 1.5px solid currentColor;
  border-radius: 2px; box-sizing: border-box; }

/* boxed prose: its box hangs outward like the rest, its words stay put */
[data-prose="card"] .cards-prose {
  background: var(--cards-card); border-radius: var(--cards-radius); padding: var(--cards-inset-block) var(--cards-inset);
  box-shadow: inset 0 0 0 var(--cards-hairline) var(--cards-hair);
}

/* merged: a heading's cards drawn as one card, parted by hairlines; its
   frame drawn over what it holds, so a card with a ground of its own (code)
   fills to the edge without covering the stroke. Nothing is clipped (an
   open card's ring stands outside the group): a ground is rounded where it
   meets the group's corners */
[data-merge="group"] .cards-group {
  background: var(--cards-card); border-radius: var(--cards-radius); gap: 0; position: relative;
}
[data-merge="group"] .cards-group::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: inset 0 0 0 var(--cards-hairline) var(--cards-hair);
}
[data-merge="group"] .cards-group > .cards-card { border-radius: 0; box-shadow: none; }
[data-merge="group"] .cards-group > .cards-card:first-child { border-top-left-radius: var(--cards-radius); border-top-right-radius: var(--cards-radius); }
[data-merge="group"] .cards-group > .cards-card:last-child { border-bottom-left-radius: var(--cards-radius); border-bottom-right-radius: var(--cards-radius); }
[data-merge="group"] .cards-group > .cards-card + .cards-card { border-top: var(--cards-hairline) solid var(--cards-sep); }
[data-merge="group"] .cards-group > .cards-heading { padding-top: var(--cards-inset-block); padding-bottom: var(--cards-inset-block); }
[data-merge="group"] .cards-group > .cards-prose { padding-top: var(--cards-inset-block); padding-bottom: var(--cards-inset-block); }
[data-merge="group"] .cards-group > .cards-heading + .cards-card { border-top: none; }
/* a heading with nothing under it stays type on the ground */
[data-merge="group"] .cards-group:has(> .cards-heading:only-child) { background: none; }
[data-merge="group"] .cards-group:has(> .cards-heading:only-child)::after { content: none; }
[data-merge="group"] .cards-group > .cards-heading:only-child { padding-top: 0; padding-bottom: 0; }

/* wide, where the page asks (data-width="wide"; the web's alone): the
   stack as wide as its page gives it, and each card at the measure, so a
   line of words stays a line to read. A table and a picture of bars, a
   line or a grid are as wide as they are, from the measure up to the
   column, a table scrolling past it as ever. All stand on the column's
   one edge. Where the column is narrower than the measure, nothing
   changes. (The picture's width is the host's to draw: pictures.js's
   widthFor.) */
:root { --cards-measure: calc(36 * var(--cards-body-size)); }
[data-width="wide"] .cards-group > .cards-card { box-sizing: border-box; max-width: var(--cards-measure); }
[data-width="wide"] .cards-group > .cards-table,
[data-width="wide"] .cards-group > .cards-picture[data-picture="bars"],
[data-width="wide"] .cards-group > .cards-picture[data-picture="line"],
[data-width="wide"] .cards-group > .cards-picture[data-picture="grid"],
[data-merge="group"] .cards-group:where([data-width="wide"] *) {
  width: fit-content; min-width: min(100%, var(--cards-measure)); max-width: 100%;
}

/* trimmed to the ink, where the page asks: a gap is then the gap
   between letters */
[data-trim] .cards-stack :is(h1, h2, h3, h4, h5, h6, p, li, dt, dd, th, td, pre, .cards-code-info, .cards-record-key) {
  text-box: trim-both cap alphabetic;
}

/* a choice's value: how many records use it, faint; a stray, marked */
.cards-count { margin-left: 0.4em; opacity: 0.5; font-variant-numeric: tabular-nums; font-size: 0.85em; }
.cards-select-stray { font-style: italic; }
/* a value's colours: one joined shape before its words, its cells touching (placed by lib/choices.js's tileOf),
   cap high and centred on the capitals (a grid's own baseline is its first cell's, so middle, raised), the row as tall as its words; a square, its corners a quarter of its height, or past four a
   pill, as high, wider by its columns, its ends round; ringed once, as a swatch is, so a colour like the ground shows */
.cards-tile { display: inline-grid; grid-template-columns: repeat(var(--cols), 1fr); grid-template-rows: repeat(2, 1fr);
  width: 0.75em; height: 0.75em; margin-right: 0.4em; vertical-align: middle; position: relative; top: -0.08em;
  border-radius: 0.1875em; overflow: hidden;
  box-shadow: 0 0 0 1px var(--cards-hair); }
.cards-tile-pill { width: calc(var(--cols) * 0.35em + 0.2em); border-radius: 999px; }
.cards-tile > i { display: block; }

/* a row's acts: buttons the host does, after the value; a destructive one in
   the callouts' red; a row that opens a page, its mark at the end; an act
   alone, the row its button. A secret's field, on the row's line. */
.cards-action { font: inherit; line-height: inherit; color: var(--cards-accent); background: none; border: none;
  margin: 0 0 0 0.8em; padding: 0; cursor: pointer; white-space: nowrap; }
.cards-action-destructive { color: var(--cards-caution); }
/* an act alone looks like a button, a finger tall; a run of them is one line of
   buttons side by side (html.js's .cards-acts), wrapping when they will not fit */
.cards-act .cards-action { margin-left: 0; padding: 0 calc(0.7em - 5px); border-radius: 999px; position: relative;
  box-shadow: 0 0 0 5px var(--cards-card), 0 0 0 6px currentColor; }
/* tapped by a finger: a target as tall as one, none of it layout */
.cards-act .cards-action::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: var(--cards-target); transform: translateY(-50%); }
.cards-acts dd { display: flex; flex-wrap: wrap; gap: 14px 16px; }
.cards-opens { cursor: pointer; }
.cards-opens-mark { margin-left: 0.6em; color: var(--cards-ink3); }
/* a file's own buttons (html.js's chip, SPEC.md "Buttons"): chips after a block's words, never among them,
   ringed as an act alone is, filled with the card's colour so it reads as one chip on a card or off one,
   a finger tall and none of it layout; a heading's are its toolbar, at its end, in body type */
.cards-buttons { display: inline-flex; flex-wrap: wrap; gap: 14px 16px; margin-left: 0.8em; vertical-align: baseline; }
.cards-button { font: inherit; font-size: 0.92em; line-height: inherit; color: var(--cards-accent); background: var(--cards-card); border: none;
  margin: 0; padding: 0 calc(0.7em - 5px); border-radius: 999px; cursor: pointer; white-space: nowrap; position: relative;
  display: inline-flex; align-items: baseline; gap: 0.35em; box-shadow: 0 0 0 5px var(--cards-card), 0 0 0 6px currentColor; }
.cards-button::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: var(--cards-target); transform: translateY(-50%); }
/* a button's role, the host's (lib/roles.js, SPEC.md "Buttons"): main filled in the accent, the card's colour its ink;
   caution in caution's ink and ring; plain, or none, as above (CardsUI's chip alike) */
.cards-button[data-role="main"] { color: var(--cards-card); background: var(--cards-accent); box-shadow: 0 0 0 6px var(--cards-accent); }
.cards-button[data-role="caution"] { color: var(--cards-caution); }
.cards-toolbar { display: flex; align-items: baseline; gap: 0.8em; }
.cards-toolbar .cards-heading-words { flex: 1 1 auto; }
.cards-toolbar .cards-buttons { margin-left: 0; flex: 0 1 auto; justify-content: flex-end;
  font: var(--cards-body-weight) var(--cards-body-size)/var(--cards-body-line) var(--cards-sans); }
/* a footnote (html.js, SPEC.md "Footnotes"): a cited value's mark after it, its label in a chip in body type,
   as an image among words is; a run of footnotes one quiet card where it is written, each folded as a callout
   folds: its label and words on one line, its rows and body under it when opened, its ↩ back to the first that
   cites it */
.cards-footnotes { display: flex; flex-direction: column; gap: 6px; font-size: var(--cards-quiet-size); }
.cards-footnote-mark, .cards-footnote-label { display: inline-block; padding: 0 0.4em; border-radius: 5px; background: var(--cards-chip);
  color: var(--cards-ink2); font-size: 0.92em; white-space: nowrap; text-decoration: none; }
.cards-footnote-mark { margin-left: 0.3em; }
.cards-footnote-line { margin: 0; color: var(--cards-ink2); }
.cards-footnote-back { text-decoration: none; }
details.cards-footnote > summary { list-style: none; cursor: pointer; }
details.cards-footnote > summary::-webkit-details-marker { display: none; }
details.cards-footnote > summary::before { content: '▸'; display: inline-block; width: 1em; color: var(--cards-ink3); }
details.cards-footnote[open] > summary::before { content: '▾'; }
details.cards-footnote[open] > summary { margin-bottom: 6px; }
/* a footnote with nothing under it: its label where its neighbours' labels stand, after their fold's mark */
div.cards-footnote > .cards-footnote-line { padding-left: 1em; }
details.cards-footnote dl { margin: 0 calc(-1 * var(--cards-inset)); }
/* a heading's mark in body type, as its toolbar's chips are */
.cards-heading .cards-footnote-mark { font: var(--cards-body-weight) var(--cards-body-size)/var(--cards-body-line) var(--cards-sans); }
/* a colour in a code span (SPEC.md "Colours"): a swatch after its text, ringed so a colour like the ground still shows */
.cards-swatch { display: inline-block; width: 0.8em; height: 0.8em; margin-left: 0.3em; vertical-align: -0.05em;
  border-radius: 3px; background: var(--cards-swatch); box-shadow: 0 0 0 1px var(--cards-hair); }
/* a value a host draws live (SPEC.md "Scheme links"): its digits fixed-width, so a changing value moves no word */
[data-scheme] { font-variant-numeric: tabular-nums; }
/* an image a host draws by its scheme, its words standing till it does */
.cards-live[role="img"] { display: block; padding: 10px 12px; border-radius: 5px; background: var(--cards-chip); color: var(--cards-ink2); }
/* a field that looks like one (a secret's, a buffer's text row's): a box round it, drawn and not laid out, so the
   row is as tall as words alone (edits do not move text) */
.cards-secret input, .cards-secret textarea, .cards-text input { font: inherit; line-height: inherit; color: var(--cards-ink); background: none;
  border: none; border-radius: 8px; padding: 0 0.5em; min-width: 8em;
  box-shadow: 0 0 0 5px var(--cards-card), 0 0 0 6px var(--cards-hair); }
.cards-secret-set { color: var(--cards-ink2); margin-right: 0.6em; }
/* a row drawn by its field (SPEC.md "A row's field"): its description a line under its key, quiet; a row the
   file does not write, faint till a tap writes it */
.cards-description { display: block; font-weight: 400; font-size: var(--cards-quiet-size); line-height: 1.35; color: var(--cards-ink3); }
.cards-unwritten { opacity: 0.55; }

/* a chat (proper's chat view): turns, steps and asks, folded as written.
   A callout's words drawn as cards sit inside it, unboxed, on its column. */
.cards-inner { background: none; padding: 0; gap: var(--cards-card-gap); color: inherit; font: inherit; }
.cards-inner .cards-card { background: none; box-shadow: none; border-radius: 0; padding-left: 0; padding-right: 0; }
.cards-inner .cards-heading, .cards-inner .cards-prose { padding: 0; }
details.cards-callout { padding: var(--cards-inset-block) var(--cards-inset); }
details.cards-callout > summary, .cards-steps > summary { list-style: none; cursor: pointer; }
details.cards-callout > summary::-webkit-details-marker, .cards-steps > summary::-webkit-details-marker { display: none; }
/* a fold's mark before its label: shut ▸, open ▾ */
details.cards-callout > summary::before, .cards-steps > summary::before {
  content: '▸'; display: inline-block; width: 1em; color: var(--cards-ink3); }
details.cards-callout[open] > summary::before, .cards-steps[open] > summary::before { content: '▾'; }
details.cards-callout[open] > summary { margin-bottom: 6px; }
/* a step: what the system did, quiet, its title in the machine's type */
.cards-callout[data-callout="card:step"] { --callout: var(--cards-ink3); background: var(--cards-chip); box-shadow: none;
  font-size: var(--cards-quiet-size); line-height: 1.45; color: var(--cards-ink2); }
.cards-callout[data-callout="card:step"] > summary { font: 500 var(--cards-quiet-size)/1.45 var(--cards-mono); color: var(--cards-ink2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cards-callout[data-callout="card:step"][open] > summary { white-space: normal; }
.cards-answer { color: var(--cards-ink2); }
.cards-answer .cards-picture { color: var(--cards-ink); }
/* an ask: waiting on the person, in the accent */
.cards-callout[data-callout="card:ask"] { --callout: var(--cards-accent); box-shadow: inset 0 0 0 1.5px var(--cards-accent); }
/* steps in a row, shut: one quiet line; open, the steps under it */
.cards-steps > summary { padding: 4px var(--cards-inset); font: 500 var(--cards-quiet-size)/1.45 var(--cards-mono); color: var(--cards-ink3); }
.cards-steps[open] { display: flex; flex-direction: column; gap: var(--cards-card-gap); }
/* a turn (`data-who` on its group): how a speaker's turn looks is the host's */

/* The editors, one per card kind (proto/editors.js): each the card's own
   markup with its words editable where they stand, so opening a card
   moves nothing. The edit state is drawn outward -- a ring, a lift,
   fills that bleed past their words -- never taking a pixel of layout.
   How much of it shows is the page's choice, in CSS alone: data-edit
   "quiet" (the ring and lift), "fields" (and every editable part shows
   itself), "paper" (and the card takes a tint). Values: tokens.json,
   edit. Shared by the web bench and the metrics sheet. */

:root { --focus: #2F6F8F; --danger: #B0442C; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --focus: #7DB3CF; --danger: #E07A62; }
}
:root[data-theme="dark"] { --focus: #7DB3CF; --danger: #E07A62; }

/* every style: the card lifts, the rest steps back; colour moves, nothing else */
.cards-stack .cards-card { transition: opacity 120ms ease, box-shadow 120ms ease, background-color 120ms ease; }
.editor { position: relative; z-index: 1; border-radius: var(--cards-radius);
  box-shadow: 0 0 0 var(--cards-edit-ring) var(--focus), 0 10px 28px -14px rgba(0,0,0,0.35); }
/* in a merged group the open card keeps its ring and its corners, and the group's frame steps back behind it */
[data-merge="group"] .cards-group > .cards-card.editor { border-radius: var(--cards-radius);
  box-shadow: 0 0 0 var(--cards-edit-ring) var(--focus), 0 10px 28px -14px rgba(0,0,0,0.35); }
[data-merge="group"] .cards-group:has(> .editor)::after { content: none; }
.cards-stack.is-editing .cards-card:not(.editor) { opacity: var(--cards-edit-dim-others); }
.cards-stack.is-editing .cards-group:has(> .editor) > .cards-card:not(.editor) { opacity: var(--cards-edit-dim-group); }
/* a heading or prose, edited, stands on a card: its box already reaches the card edge */
.editor.cards-heading, .editor.cards-prose { background: var(--cards-card); }

/* words, editable where they stand */
.editor .field { outline: none; caret-color: var(--focus); white-space: pre-wrap; min-height: 1lh; cursor: text; }
.editor .field:empty::after { content: attr(data-placeholder); color: var(--cards-ink3); opacity: 0.7; pointer-events: none; }
/* a callout with no title: its type's name, where the label stands */
.editor .cards-callout-label.field:empty::after { color: var(--callout); opacity: 0.55; }
.editor .heading-words, .editor .row-value, .editor .item-words { display: block; }
.editor .cards-record-key { cursor: default; }
/* a value that stood beside its key stays there as it grows */
.editor .cards-row.beside { flex-wrap: nowrap; }
.editor .cards-row.beside dd { flex: 0 1 auto; margin-left: auto; text-align: left; }
/* (as wide as its words and pushed to the end, as read: not a wide box
   with its words set right, where WebKit keeps the caret room at the end) */
.editor .kept { font: 400 12px/1.4 var(--cards-mono); color: var(--cards-ink3); white-space: pre-wrap; margin-top: 3px; }
.editor .raw-text { margin: 0; padding: var(--cards-inset-block) var(--cards-inset); font: 400 13px/1.5 var(--cards-mono); display: block; }
.editor.cards-html .raw-text { padding: 0; }

/* fields: every editable part shows itself, a fill that bleeds past its words */
[data-edit="fields"] .editor .field, [data-edit="paper"] .editor .field {
  background: color-mix(in srgb, var(--focus) var(--cards-edit-field), transparent);
  box-shadow: 0 0 0 var(--cards-edit-bleed) color-mix(in srgb, var(--focus) var(--cards-edit-field), transparent);
  border-radius: 3px;
}
[data-edit="fields"] .editor .field:focus, [data-edit="paper"] .editor .field:focus {
  background: color-mix(in srgb, var(--focus) var(--cards-edit-field-focus), transparent);
  box-shadow: 0 0 0 var(--cards-edit-bleed) color-mix(in srgb, var(--focus) var(--cards-edit-field-focus), transparent);
}
/* paper: and the card takes a tint of the focus colour */
[data-edit="paper"] .editor:not(.cards-code) { background: color-mix(in srgb, var(--focus) var(--cards-edit-surface), var(--cards-card)); }

/* arranging: a handle to drag, a way to delete; the card may change shape */
.arrange { padding: 4px 0; }
.line { display: flex; align-items: flex-start; gap: 6px; padding: 8px 10px 8px 4px; position: relative; background: var(--cards-card); }
.line + .line { border-top: 1px solid var(--cards-sep); }
.line.dragging { z-index: 2; box-shadow: 0 8px 24px -8px rgba(0,0,0,0.35); border-radius: 10px; }
.handle { flex: none; width: 30px; height: 30px; border: none; background: none; touch-action: none; cursor: grab;
  color: var(--cards-ink3); font-size: 15px; line-height: 30px; }
.marker { flex: none; min-width: 18px; padding-top: 3px; color: var(--cards-ink3); font: 500 15px/1.45 var(--cards-sans); text-align: right; }
.line-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; padding-top: 3px; }
.arrange-key { font: 500 12px/1.3 var(--cards-sans); color: var(--cards-ink3); letter-spacing: 0.01em; }
.kept { font: 400 12px/1.4 var(--cards-mono); color: var(--cards-ink3); white-space: pre-wrap; margin-top: 3px; }
.remove { flex: none; height: 30px; min-width: 30px; border: none; background: none; border-radius: 999px; color: var(--cards-ink3); font-size: 18px; line-height: 30px; }
.remove.armed { background: var(--danger); color: #fff; font-size: 13px; padding: 0 12px; }

/* a table's cells: an empty one keeps room for a finger */
.editor .cards-cell.field { min-height: 0; }
.editor .cards-cell.field:empty { min-width: 1em; }

/* a table on its surface: a grid with room, every cell a place to tap */
.surface-table table { border-collapse: collapse; }
.surface-table th, .surface-table td { border: 1px solid var(--cards-sep); min-width: 72px; }
.surface-table .cards-cell.field { display: block; width: auto; }

/* a task item's box, edited: tapped, not typed in */
.editor .cards-check { cursor: pointer; }

/* The editing prototype: a phone's worth of stack, and beside it (on a
   wide screen) the file's markdown, lines lit where the last edit
   landed. The cards are cards.css's; this is only the editing around
   them. One card is edited at a time: it lifts, the rest recede. */

:root {
  --desk: #E4DED6; --desk-ink: #4E453D; --desk-line: rgba(78,69,61,0.18);
  --phone: #F3F0EB; --lit: rgba(47,111,143,0.14);
  --field: #FFFFFF; --field-line: rgba(36,31,26,0.16); --bar: #241F1A; --bar-ink: #F3F0EB;
  --kbd: #D3D5DB; --kbd-rule: rgba(0,0,0,0.10); --key: #FFFFFF;
  --sheet: #FFFFFF; --shade: rgba(20,18,16,0.38);
  --sans: 'Public Sans', system-ui, -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0A0908; --desk-ink: #BDB2A6; --desk-line: rgba(237,230,220,0.14);
    --phone: #141210; --lit: rgba(125,179,207,0.16);
    --field: #201C18; --field-line: rgba(237,230,220,0.16); --bar: #EDE6DC; --bar-ink: #141210;

  FINE_STEPS: 6, // ...the first six at the small step, then by the big one
  ROLL_PX: 18, // up or down on a half of a time, or a digit: one each this far
  LOCK_PX: 8, // a scrub takes the row only once it has gone this far sideways first
  SCRUB_SHARE: 0.8, // a scrub across this share of the row runs the slider's whole range
  WEEK_H: 44, // a week's line in the date's strip
  TIME_STEP: 5, // a time's step, in minutes, unless the map says

  SPAN_LENGTH: 60, // a new span on a day, in minutes

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

const sign = (x) => (x > 0 ? 1 : x < 0 ? -1 : 0);
const zero = (x) => (x === 0 ? 0 : x); // never -0

/**
 * How far a sideways drag on a stepping chip has moved its value: a step
 * each DRAG_EACH, the first FINE_STEPS at the small step, then by the big
 * one (a date: days, then weeks; a time: its step, then hours). Left is on
 * (later), as with the select.
 * @param {number} dx pixels the finger has moved since it came down (right positive)
 * @param {number} small the small step
 * @param {number} big the big step
 * @returns {number} the signed amount, in the steps' unit
 */

"./height": function (module, exports, require) {
/**
 * About how tall a file draws as cards, in pixels (points on iOS), from
 * the markdown alone: no parse and no layout, so a host can size a thing
 * before drawing it, over thousands of files (a scroll rail that weighs
 * each row by its height). It is a guess, and measured: each line is
 * costed by what it starts with, and the costs are fitted to heights
 * drawn in real browsers (`npm run heights`, SPEC.md, "Height").
 *
 * The height is the cards' own: the stack's padding above and below is
 * the page's, and not counted; a heading's cards drawn merged.
 * An image's height is its picture's, and not known here; a photos
 * card's photos are squares, each row of them a band the column's share wide;
 * a grid and a bar of parts a row of the picture a row of their table,
 * however wide, under their key.
 *
 * Swift has the same scan (CardsKit/Height.swift), held to
 * vectors/heights.json.
 */

const COSTS = require('./height-costs');
// a photos card's words under a strip's photos, a line of 11px type
const PHOTO = { words: 15 };

// A character's width, in characters of body text: a symbol from U+2000
// up (an emoji, a block bar ████░░, a star) draws from a fallback font,
// about twice as wide.
const wide = (s) => {
  let n = 0;
  for (const ch of s) n += ch.codePointAt(0) >= 0x2000 ? 1.8 : 1;
  return n;
};
const wrap = (chars, perLine) => Math.max(1, Math.ceil(chars / Math.max(8, perLine)));
// The words a line shows: a link its words, marks and tags gone.
const plain = (s) => s.replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[*_`~]/g, '').replace(/<[^>]+>/g, '');

const TABLE_RULE = /^\s*\|?[\s:|-]+\|?\s*$/;
// A button's definition (`[^➕]: hemlock:…`, `[^↩sam]: [Reply](hemlock:…)`; lib/buttons.js), drawn as
// nothing: a label from a symbol up (U+2000, as wide() reads one), then a URI with a scheme. Height.swift's alike.
function button(l) {
  const m = /^ {0,3}\[\^([^[\]\s]+)\]:[ \t]*/.exec(l);
  if (!m || m[1].codePointAt(0) < 0x2000) return false;
  let rest = l.slice(m[0].length);
  if (rest.startsWith('[')) { const e = rest.indexOf(']('); if (e < 0) return false; rest = rest.slice(e + 2); }
  return /^[A-Za-z][A-Za-z0-9+.-]*:/.test(rest);
}
// A footnote's definition that is no button (SPEC.md, "Footnotes"), drawn folded: its line alone, as a shut
// callout's title, its own lines four spaces in (a tab is four) not drawn till opened. Height.swift's alike.
const FOOTNOTE = /^ {0,3}\[\^[^[\]\s]+\]:/;
const UNDER = /^(?: {0,3}\t| {4})/;
// a line that starts a block of its own, and so is no lazy line of a footnote's words (`gap` none, words before it)
const OPENS = /^ {0,3}(?:[#>|<]|[-*+](?:\s|$)|\d{1,9}[.)](?:\s|$)|```|~~~|[-*_=]{2,})/;
const ROW = /^\s*[-*+]\s+([^:`[\]]{1,40}):(\s|$)/;
const ITEM = /^(\s*)([-*+]|\d+[.)])\s+(\[[ xX]\]\s+)?/;

// A grid or a bars card: held, for a grid and a bar of parts are drawn
// a row 18 high, whatever their table's words, under a key.
const PICTURE = /^\s*>\s*\[!CARD:(grid|bars)\][+-]?/i;
// a callout shut by its mark, but a picture, which draws whatever its mark
const SHUT = /^\s*>\s*\[!(?!CARD:(?:grid|bars|photos|line)\])[^\]]+\]-/i;
// a grid's cell: a number, true or false, ✓ or ✗, or empty (lib/pictures.js's cellOf)
const VALUE = (s) => { const t = s.replace(/,/g, '').trim().toLowerCase(); return t === '' || ['true', 'false', '✓', '✗'].includes(t) || /^-?\d+(\.\d+)?$/.test(t); };

// A grid's groups, each a line of the picture (a key's): the columns'
// names one line, where any `- Groups:` item names a range of the head;
// each run of rows another, by a column the value names that holds a word
// (or is the first), a blank or the value again continuing the run above.
function groupLines(rows, values) {
  const head = rows[0].map((h) => h.trim());
  const at = (name) => head.indexOf(name);
  const range = (token) => at(token) >= 0 || [...token].some((ch, i) => ch === '-' && i > 0 && at(token.slice(0, i)) >= 0 && at(token.slice(i + 1)) >= 0);
  let lines = 0;
  const by = values.map(at).find((j) => j >= 0 && (j === 0 || rows.slice(1).some((r) => !VALUE(r[j] ?? ''))));
  if (by !== undefined) {
    // a run's line each: a row starts one unless blank or its run's value again
    let run = null;
    rows.slice(1).forEach((r, i) => { const v = (r[by] ?? '').trim(); if (i === 0 || (v !== '' && v !== run)) { lines++; run = v; } });
  }
  if (values.some((v) => at(v) < 0 && v.split(',').some((item) => { const m = /^(.*\S)\s+(\S+)$/.exec(item.trim()); return m && range(m[2]); }))) lines++;
  return lines;
}

/**
 * A held grid or bars card as drawn, or null where it is not drawn as a
 * picture of rows (a bars card not of parts) or its drawer declines: its
 * table's rows, and how many lines its key wraps to at `room` px (10px
 * type, 6 a character). A grid's row is drawable where, past its first
 * cell, its leading and trailing words (labels, gutters), the rest are
 * values, and no fewer than its labels; a bar of parts' where every part is a number not below 0.
 */
function picture(lines, room) {
  const type = PICTURE.exec(lines[0])[1].toLowerCase();
  const inner = lines.slice(1).map((l) => l.replace(/^\s*>\s?/, ''));
  const rows = inner.filter((q) => /^\s*\|/.test(q) && !(TABLE_RULE.test(q) && q.includes('-')))
    .map((q) => q.replace(/^\s*\||\|\s*$/g, '').split(/(?<!\\)\|/));
  const said = (key) => inner.map((q) => /^\s*[-*+]\s+([^:]+):\s*(.*)$/.exec(q)).filter((m) => m && m[1].trim().toLowerCase() === key).map((m) => m[2].trim());
  const body = rows.slice(1);
  if (rows.length < 1 || rows[0].length < 2 || !body.length) return null;
  const px = (words) => words.reduce((a, w) => a + 6 * [...w].length, 0);
  if (type === 'bars') {
    if (!said('bars').some((v) => v.toLowerCase() === 'parts')) return null;
    if (!body.every((r) => r.slice(1).every((x) => { const t = x.replace(/,/g, '').trim(); return t === '' || /^\d+(\.\d+)?$/.test(t); }))) return null;
    // a part's dot and its name, 12 apart
    const key = rows[0].slice(1).reduce((a, h) => a + px([h.trim()]) + 14 + 12, 0);
    return { rows: body.length, key: wrap(key, room) };
  }
  // a grid of words: a key's words (`- Key: \`M\` \`m\` for the majority`) are its values
  const keys = said('key').map((v) => /^((?:`[^`]+`\s*)+)(.*)$/.exec(v)).filter(Boolean)
    .map((m) => ({ words: [...m[1].matchAll(/`([^`]+)`/g)].map((x) => x[1].trim()), meaning: m[2].trim() }));
  const keyWords = new Set(keys.flatMap((k) => k.words));
  const value = (x) => VALUE(x) || keyWords.has(x.trim());
  const drawable = body.every((r) => {
    let a = 1;
    let b = r.length;
    while (a < b && !value(r[a])) a++;
    while (b > a && !value(r[b - 1])) b--;
    return a < b && a <= b - a && r.slice(a, b).every(value);
  });
  if (!drawable) return null;
  const top = said('top')[0];
  const unit = said('unit')[0];
  // the key, where Top or Unit is said: none, 0, the shades and the top, the unit
  const key = top !== undefined || unit !== undefined ? 37 + 12 + 19 + 12 + 47 + px([top || '000']) + 6 + (unit ? 12 + px([unit]) : 0) : 0;
  // the words' key: each key's swatch (two where it has a lighter word), its words and meaning, 12 apart; good and bad
  const words = keys.reduce((a, k) => a + 12 + (k.words.length > 1 && k.meaning.toLowerCase() !== 'none' ? 12 : 0) + 4 + px([k.words.join(' ')]) + 4 + px([k.meaning]) + 12, 0)
    + ['good', 'bad'].filter((t) => said(t).length).reduce((a, t) => a + 13 + px([t]) + 12, 0);
  return { rows: body.length, key: (key ? wrap(key, room) : 0) + (words ? wrap(words, room) : 0) + groupLines(rows, said('groups')) };
}

/**
 * What the scan counts, each the number its cost is paid for.
 * @param {string} markdown
 * @param {number} width
 * @param {{column: number, perChar: number, cellChars: number, rowScale: number}} c
 *   the width less the text column, a body character's pixels, a table
 *   cell's characters, and body type to rows' type
 */
function features(markdown, width, c) {
  const cpl = (width - c.column) / c.perChar;
  const f = { prose: 0, blank: 0, h12: 0, h3plus: 0, item: 0, itemLine: 0, row: 0, rowLine: 0,
    tableRow: 0, tableWrap: 0, table: 0, codeLine: 0, codeBlock: 0, quote: 0,
    picture: 0, pictureRow: 0, pictureKey: 0, photoPx: 0 };
  let fence = null;
  let inTable = false;
  // a photos card (`> [!CARD:photos]`): its head as a quote's line, each row after a band of squares
  let photos = null;
  // a grid or a bar of parts: its lines held till its callout ends, then costed as drawn, or,
  // where its drawer would decline, line by line as any callout
  let held = null;
  // a callout drawn shut (`> [!type]-`): its title line alone, its words not drawn till opened
  let shut = false;
  // a footnote, folded: its own lines skipped, and the blank lines among them (`gap`, paid if none follows)
  let foot = false;
  let gap = 0;
  let words = false; // the footnote's line before has words a lazy line goes on
  const unfold = () => { for (; gap > 0; gap--) step(''); };
  const flush = () => {
    const drawn = picture(held, width - c.column);
    if (drawn) {
      step(held[0]);
      f.picture++;
      f.pictureRow += drawn.rows;
      f.pictureKey += drawn.key;
    } else held.forEach(step);
    held = null;
  };
  for (const raw of markdown.split(/\r\n|\r|\n/)) {
    if (foot) {
      if (!raw.trim()) { gap++; words = false; continue; }
      if (UNDER.test(raw) || (words && !FOOTNOTE.test(raw) && !OPENS.test(raw))) { gap = 0; words = true; continue; }
      foot = false;
      unfold();
    }
    if (!fence && !held && FOOTNOTE.test(raw) && !button(raw.trimEnd())) {
      foot = true;
      words = raw.slice(FOOTNOTE.exec(raw)[0].length).trim() !== '';
      f.quote += wrap(wide(plain(raw.trim())), cpl - 2);
      continue;
    }
    if (shut) {
      if (/^\s*>/.test(raw)) continue;
      shut = false;
    }
    if (!fence && !held && SHUT.test(raw)) { shut = true; step(raw); continue; }
    if (held) {
      if (/^\s*>/.test(raw)) { held.push(raw); continue; }
      flush();
    }
    if (!fence && PICTURE.test(raw)) { held = [raw]; continue; }
    step(raw);
  }
  if (held) flush();
  unfold();
  return f;

  function step(raw) {
    const l = raw.trimEnd();
    if (fence) {
      if (l.trimStart().startsWith(fence)) fence = null; else f.codeLine++;
      return;
    }
    const open = /^\s*(```+|~~~+)/.exec(l);
    if (open) { fence = open[1]; f.codeBlock++; inTable = false; return; }
    if (!l.trim()) { f.blank++; inTable = false; photos = null; return; }
    if (button(l)) return;
    if (/^\s*\|/.test(l)) {
      if (TABLE_RULE.test(l) && l.includes('-')) return; // the rule under a table's head
      if (!inTable) { f.table++; inTable = true; }
      const cells = l.replace(/^\s*\||\|\s*$/g, '').split(/(?<!\\)\|/);
      const tall = Math.max(...cells.map((cell) => wrap(wide(plain(cell.trim())), c.cellChars)));
      f.tableRow++;
      f.tableWrap += tall - 1;
      return;
    }
    inTable = false;
    if (!/^\s*>/.test(l)) photos = null;
    else if (/^\s*>\s*\[!CARD:photos\]/i.test(l)) photos = { head: null };
    else if (photos && /^\s*>\s*\|/.test(l)) {
      const q = l.replace(/^\s*>\s?/, '');
      if (TABLE_RULE.test(q) && q.includes('-')) return;
      const cells = q.replace(/^\s*\||\|\s*$/g, '').split(/(?<!\\)\|/);
      if (photos.head !== null) {
        // a row: squares the column's share wide, 4 apart; a strip's words under them (a grid's
        // first column its names, about 30 wide), not a guess but drawn so, paid as it is (PHOTO)
        const strip = photos.head;
        const side = (width - c.column - (strip ? 0 : 30) - 4 * (cells.length - 1)) / (strip ? cells.length : cells.length - 1);
        f.photoPx += side + 4 + (strip ? PHOTO.words : 0);
        return;
      }
      photos.head = cells.every((x) => !x.trim());
    }
    const h = /^\s{0,3}(#{1,6})\s/.exec(l);
    if (h) {
      if (h[1].length <= 2) f.h12 += wrap(wide(l), cpl * 0.72); else f.h3plus += wrap(wide(l), cpl * 0.9);
      return;
    }
    // `- Key: value`: a row, padded apart as a list's items are not
    if (ROW.test(l)) { f.row++; f.rowLine += wrap(wide(plain(l)) - 2, cpl * c.rowScale - 1); return; }
    const li = ITEM.exec(l);
    if (li) {
      f.item++;
      f.itemLine += wrap(wide(plain(l.slice(li[0].length))), cpl - 3 - li[1].length / 2);
      return;
    }
    if (/^\s*>/.test(l)) { f.quote += wrap(wide(plain(l.replace(/^\s*>\s?/, ''))), cpl - 2); return; }
    f.prose += wrap(wide(plain(l)), cpl);
  }
}

/**
 * @param {string} markdown
 * @param {{width?: number}} [options] the stack's width, the screen's in a phone's column
 * @returns {number} about how tall its cards draw
 */
function height(markdown, { width = 390 } = {}) {
  const f = features(markdown, width, COSTS);
  // photos as drawn, the rest as fitted
  let h = COSTS.intercept + f.photoPx;
  for (const [k, n] of Object.entries(f)) if (k !== 'photoPx') h += COSTS.costs[k] * n;
  return Math.max(0, h);
}

module.exports = { height, features };

"./tables": function (module, exports, require) {
/**
 * Tables, read quickly: markdown-it's own table rule (15.0.2,
 * src/rules_block/table.ts), line for line, but a top-level table is
 * kept as one token, `table`, holding its alignments, head and rows,
 * where the rule makes three tokens a cell. Most of a databook's bytes
 * are tables, and most of a read's time went to their tokens. Nothing
 * reads a table nested in a quote or a list from its tokens (a
 * callout's card reads its words again), so there it is one token too.
 *
 * Where a table starts and where it ends is markdown-it's to say, as
 * before: this rule stands in the table rule's place, asks what it asks
 * (the terminators too, in the state they saw), and gives the same
 * cells. Every silent call (may a table start here?) goes to the rule
 * itself. Held to it by test/tables.test.js, and by
 * hand over whole folders with tools/tables-parity.js.
 */

// The rule gives up autocompleting cells past this, as markdown-it's does.
const MAX_AUTOCOMPLETED_CELLS = 65536;

const isSpace = (ch) => ch === 0x09 || ch === 0x20;

function getLine(state, line) {
  return state.src.slice(state.bMarks[line] + state.tShift[line], state.eMarks[line]);
}

// A row's cells: split at each pipe not escaped, an escaped one read as a pipe.
function escapedSplit(str) {
  const result = [];
  const max = str.length;
  let pos = 0;
  let ch = str.charCodeAt(pos);
  let isEscaped = false;
  let lastPos = 0;
  let current = '';
  while (pos < max) {
    if (ch === 0x7c) {
      if (!isEscaped) {
        result.push(current + str.substring(lastPos, pos));
        current = '';
        lastPos = pos + 1;
      } else {
        current += str.substring(lastPos, pos - 1);
        lastPos = pos;
      }
    }
    isEscaped = ch === 0x5c;
    pos++;
    ch = str.charCodeAt(pos);
  }
  result.push(current + str.substring(lastPos));
  return result;
}

// A row's cells, its outer pipes' empty cells dropped.
function cellsOf(lineText) {
  const columns = escapedSplit(lineText);
  if (columns.length && columns[0] === '') columns.shift();
  if (columns.length && columns[columns.length - 1] === '') columns.pop();
  return columns;
}

// The delimiter row's alignments ('left', 'center', 'right' or null), or null when it is none.
function delimiters(state, nextLine) {
  if (state.sCount[nextLine] < state.blkIndent) return null;
  if (state.sCount[nextLine] - state.blkIndent >= 4) return null;
  let pos = state.bMarks[nextLine] + state.tShift[nextLine];
  if (pos >= state.eMarks[nextLine]) return null;
  const firstCh = state.src.charCodeAt(pos++);
  if (firstCh !== 0x7c && firstCh !== 0x2d && firstCh !== 0x3a) return null;
  if (pos >= state.eMarks[nextLine]) return null;
  const secondCh = state.src.charCodeAt(pos++);
  if (secondCh !== 0x7c && secondCh !== 0x2d && secondCh !== 0x3a && !isSpace(secondCh)) return null;
  if (firstCh === 0x2d && isSpace(secondCh)) return null;
  while (pos < state.eMarks[nextLine]) {
    const ch = state.src.charCodeAt(pos);
    if (ch !== 0x7c && ch !== 0x2d && ch !== 0x3a && !isSpace(ch)) return null;
    pos++;
  }
  const columns = getLine(state, nextLine).split('|');
  const aligns = [];
  for (let i = 0; i < columns.length; i++) {
    const t = columns[i].trim();
    if (!t) {
      if (i === 0 || i === columns.length - 1) continue;
      return null;
    }
    if (!/^:?-+:?$/.test(t)) return null;
    if (t.charCodeAt(t.length - 1) === 0x3a) aligns.push(t.charCodeAt(0) === 0x3a ? 'center' : 'right');
    else if (t.charCodeAt(0) === 0x3a) aligns.push('left');
    else aligns.push(null);
  }
  return aligns;
}

/**
 * Put the quick rule in the table rule's place in `md`.
 * `fast.tables` false leaves every table to the rule (the parity check).
 */
function quickTables(md, fast) {
  const { fn: rule, alt } = md.block.ruler.__rules__.find((r) => r.name === 'table');
  md.block.ruler.at('table', (state, startLine, endLine, silent) => {
    if (silent || !fast.tables) return rule(state, startLine, endLine, silent);
    if (startLine + 2 > endLine) return false;
    const align = delimiters(state, startLine + 1);
    if (!align) return false;
    const headText = getLine(state, startLine).trim();
    if (headText.indexOf('|') === -1) return false;
    if (state.sCount[startLine] - state.blkIndent >= 4) return false;
    const head = cellsOf(headText);
    const columnCount = head.length;
    if (columnCount === 0 || columnCount !== align.length) return false;

    // The body's lines, asked of the terminators in the state the rule
    // leaves them: parent `table`, one level in, then two once a body is open.
    const oldParentType = state.parentType;
    const level = state.level;
    state.parentType = 'table';
    state.level = level + 1;
    const terminatorRules = state.md.block.ruler.getRules('blockquote');
    const rows = [];
    let autocompletedCells = 0;
    let nextLine = startLine + 2;
    for (; nextLine < endLine; nextLine++) {
      if (state.sCount[nextLine] < state.blkIndent) break;
      let terminate = false;
      for (let i = 0, l = terminatorRules.length; i < l; i++) {
        if (terminatorRules[i](state, nextLine, endLine, true)) { terminate = true; break; }
      }
      if (terminate) break;
      const lineText = getLine(state, nextLine).trim();
      if (!lineText) break;
      if (state.sCount[nextLine] - state.blkIndent >= 4) break;
      const columns = cellsOf(lineText);
      autocompletedCells += columnCount - columns.length;
      if (autocompletedCells > MAX_AUTOCOMPLETED_CELLS) break;
      const cells = new Array(columnCount);
      for (let i = 0; i < columnCount; i++) cells[i] = columns[i] ? columns[i].trim() : '';
      rows.push({ line: nextLine, cells });
      state.level = level + 2;
    }
    state.level = level;
    state.parentType = oldParentType;
    const token = state.push('table', 'table', 0);
    token.map = [startLine, nextLine];
    token.meta = { align, head: head.map((c) => c.trim()), rows };
    state.line = nextLine;
    return true;
  }, { alt }); // what it may interrupt, as the rule may (a paragraph)
}

module.exports = { quickTables };

"./blocks": function (module, exports, require) {
/**
 * Any markdown file, split into blocks by markdown syntax alone: no
 * schema, no guessing at meaning (SPEC.md, "Blocks").
 *
 * Only top-level blocks count; anything nested stays inside its parent.
 * Every block owns a range of source lines, `[start, end)` over
 * `markdown.split('\n')`, and the ranges tile the file: blank lines
 * (and link reference definitions, which markdown-it reads but emits
 * no token for) belong to the block before them, leading ones to the
 * first. So an edit to one block is a splice of its lines, and nothing
 * else in the file moves.
 *
 * Lines are split on `\n` alone: a `\r\n` file reads as an `\n` one,
 * and a stray `\r` inside a line is not a line ending (markdown-it would
 * take it for one, so it is hidden from the parser as a space). A
 * leading byte-order mark is hidden the same way. A YAML front matter
 * header at the very top is one block, code in YAML (`form: front`);
 * the parser sees blank lines in its place, so every other line keeps
 * its number.
 */

const MarkdownIt = require('./markdownit');
const { quickTables } = require('./tables');
const { definitions, keepSchemes } = require('./buttons');

// Whether a line goes on a paragraph before it, as a lazy line does (a footnote's, lib/buttons.js)
const continues = (line) => {
  const ts = md.parse(`a\n${line}`, {}).filter((t) => t.level === 0 && t.nesting !== -1);
  return ts.length === 1 && ts[0].type === 'paragraph_open' && ts[0].map[1] === 2;
};

const NO_DEFS = { lines: [], cut: [], under: [], buttons: new Map(), footnotes: [], byLabel: new Map() };

const md = keepSchemes(new MarkdownIt({ html: true, linkify: false, typographer: false }));

// A YAML key at the left edge: `title: …`, `tags:`.
const YAML_KEY = /^([^\s#-][^:]*):(\s|$)/;
const ALIGN = /text-align:(left|center|right)/;

const trimBlankEnd = (ls) => { while (ls.length && isBlank(ls[ls.length - 1])) ls.pop(); return ls; };
const dropCR = (l) => l.replace(/\r$/, '');

// A row's or item's own lines end at its last non-blank one: blank
// lines after it belong to the block, so editing a row keeps them.
function own(plainLines, [start, end]) {
  while (end > start + 1 && isBlank(plainLines[end - 1])) end--;
  return [start, end];
}

// Take up to `n` leading spaces off a line, never text.
const outdent = (line, n) => line.slice(Math.min(n, /^ */.exec(line)[0].length));

// The tokens between a block's opening token and its close.
function inside(tokens, open) {
  const from = tokens.indexOf(open);
  if (open.nesting === 0) return [open];
  const close = open.type.replace(/_open$/, '_close');
  for (let j = from + 1; j < tokens.length; j++) {
    if (tokens[j].type === close && tokens[j].level === open.level) return tokens.slice(from, j + 1);
  }
  /* c8 ignore next */
  return tokens.slice(from);
}

// A callout's marker line: `[!NOTE]`, `[!tip]- Folded, titled`, a card
// `[!CARD:bars] Steps`.
const CALLOUT = /^\[!([A-Za-z][\w-]*(?::[A-Za-z][\w-]*)?)\]([+-]?)(?:[ \t]+(.+))?$/;
const CARD = /^card:/i;
// A block's id (Obsidian's `^id`), at the end of its words after a space:
// `Let me log it. ^e2`, a callout's `[!note] Title ^e3`. Taken off the
// words a host draws; the block's markdown and lines keep it as written.
const BLOCK_ID = /[ \t]+\^([A-Za-z0-9-]+)$/;
// A callout's fold mark: `-` folded, `+` open and foldable.
const FOLD = { '-': 'folded', '+': 'open' };

const struck = (markdown) => /^~~(?:(?!~~)[\s\S])+~~$/.test(firstParagraph(markdown).join('\n').trim());

// An item's own words: its lines dedented from its marker, a task
// item's box read and taken off, an item struck through whole read done.

  const markdown = trimBlankEnd([ls[0].slice(width), ...ls.slice(1).map((l) => outdent(l, width))]).join('\n');
  const task = TASK.exec(markdown);

  // Struck through whole is done, as a checked box is, and keeps its mark, read inside the strike.
  return struck(markdown) ? { markdown, ...marked(markdown.trimStart().slice(2)), ...extra, done: true, lines: [start, end], ...pressed(markdown, notes) }
    : { markdown, ...marked(markdown), ...extra, lines: [start, end], ...addressed(markdown), ...pressed(markdown, notes) };
}

// A list's items as an outline: each item, then the items of the list
// that ends it, one deeper (`depth`, and a deeper list's own `ordered`
// and `start`). An item whose nested list is not the last thing in it,
// or opens on its own first line, keeps that list among its own words,
// as written.

  const within = inside(tokens, open);

    const kids = inside(within, t).filter((x) => x.level === t.level + 1 && x.nesting !== -1 && x.type !== 'inline');
    const last = kids[kids.length - 1];

  const within = inside(tokens, open);

    .filter((t) => t.type === 'list_item_open' && t.level === open.level + 1)
    .map(({ map }) => own(plainLines, map));

  });
  return out;
}

    kind: 'code', form: 'front', language: 'yaml', info: '',

    return citedCells({ kind: 'table', align, head, body: rows.map(({ line, cells }) => widened(cells, plainLines[line])), lines: [b.start, b.end] }, notes);

  const head = [];
  const body = [];
  let row = null;
  let line = 0;
  for (let j = 0; j < within.length; j++) {

// an image read, with its scheme where a host may draw it live (SPEC.md, "Scheme links")

      // A turn: a heading whose words begin with a handle (`### @Hamlet`), whoever spoke what follows it

      return { ...(record ? { ...out, as: 'record', record } : out), ...pressed(b.markdown, notes) };
    }

    }
  }

  if (block.kind !== 'code' || block.form === 'front') throw new RangeError(`card ${c} is not code`);

/**
 * Quote card `c` with new words: each line under a `>` again, a blank
 * line as a bare `>`. The same words leave it as written. A callout's
 * words are its body, under its marker's line; given its type and title
 * (`{type, title}`) and they differ from its own, that line is written

 * alignment (as read, when not given). A row from the card says which
 * (`from`); unchanged, its line is copied as written, and changed, it is
 * written anew, `| a | b |`, a pipe in a cell escaped and a line break
 * made a space. The head and delimiter rows are written anew only when
 * the head or alignment changes. A table's rows go on one line each, one
 * after the other, so row n stands on the table's third line plus n.
 * @param {{head?: string[], align?: Array<string|null>, rows: Array<{cells: string[], from?: number}>}} table
 * @returns {string} the file
 */
function editTable(markdown, c, table) {

  const [block] = cardOf(st, c, markdown).blocks;
  if (block.kind !== 'table') throw new RangeError(`card ${c} is not a table`);
  const head = table.head || block.head;

    ? lines.slice(first, first + 2)

    const was = r.from === undefined ? null : block.body[r.from];

"./diff": function (module, exports, require) {
/**
 * What changed between two versions of a file, said as cards.md's own
 * edits (edits.js): a thing ticked, items added or taken away, a card's
 * words, a card added, taken away or moved. So a change made by writing
 * the whole file, as an agent does, can be shown as a UI shows the edits
 * it makes itself. The one promise: `applyEdits(before, diffCards(before, after)) === after`.
 * When the cards come right but the blank lines between them do not,
 * the edits end with a `write` of the whole file, to settle it; what
 * the edits cannot say at all (two lists run into one) is that write alone.
 */

const { stack } = require('./stack');
const { isBlank } = require('./blocks');
const E = require('./edits');

// each card's written lines, as text: what a card is, for matching
function texts(markdown) {
  const lines = markdown.split('\n');
  return stack(markdown).cards.map(({ lines: [s, e] }) => {
    while (s < e - 1 && isBlank(lines[s])) s++;
    while (e > s + 1 && isBlank(lines[e - 1])) e--;
    return lines.slice(s, e).join('\n');
  });
}

// the longest run of cards the two share, in order: [i, j] pairs
function common(a, b) {
  const n = a.length;
  const m = b.length;
  const len = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) len[i][j] = a[i] === b[j] ? len[i + 1][j + 1] + 1 : Math.max(len[i + 1][j], len[i][j + 1]);
  const out = [];
  for (let i = 0, j = 0; i < n && j < m;) {
    if (a[i] === b[j]) { out.push([i, j]); i++; j++; } else if (len[i + 1][j] >= len[i][j + 1]) i++; else j++;
  }
  return out;
}

// a list whose items are the same but for which are done: the items to tick
function ticks(was, now) {
  const [x] = was.blocks;
  const [y] = now.blocks;
  if (x.kind !== 'list' || y.kind !== 'list' || x.as === 'rows' || y.as === 'rows' || x.items.length !== y.items.length) return null;
  const flipped = x.items.map((it, n) => (!!it.done !== !!y.items[n].done ? n : -1)).filter((n) => n >= 0);
  return flipped.length ? flipped : null;
}

// The cards taken away and the same text put back elsewhere: each one
// moved (moveCard) to stand after the card before it in `after` that is
// already in place, so the cards kept and moved stand in their order.
// A move refused is left to be taken away and put anew.
function moves(before, a, b, edits) {
  const pairs = common(a, b);
  const kept = new Set(pairs.map(([, j]) => j));
  const free = a.map((t, i) => i).filter((i) => !pairs.some(([x]) => x === i));
  const placed = new Map(pairs.map(([i, j]) => [j, i]));
  const order = a.map((t, i) => i); // the cards of `before`, in the file's order as edited
  let doc = before;
  for (let j = 0; j < b.length; j++) {
    const at = kept.has(j) ? -1 : free.findIndex((i) => a[i] === b[j]);
    if (at < 0) continue;
    const [i] = free.splice(at, 1);
    let p = j - 1;
    while (p >= 0 && !placed.has(p)) p--;
    const from = order.indexOf(i);
    const to = p < 0 ? 0 : order.indexOf(placed.get(p)) + 1;
    let moved;
    try { moved = E.moveCard(doc, from, to); } catch { continue; }
    if (moved !== doc) { doc = moved; edits.push({ fn: 'moveCard', args: [from, to] }); }

    placed.set(j, i);
  }

}

// a list's items as `after` has them, for editItems: those kept (the most
// in order) and those changed in their place say `from`, the new do not.
// Null when no item is kept, or either is not a list of items.
function items(was, now) {
  const [x] = was.blocks;
  const [y] = now.blocks;
  if (x.kind !== 'list' || y.kind !== 'list' || x.as === 'rows' || y.as === 'rows') return null;
  const key = (it) => JSON.stringify([it.markdown, it.depth || 0, !!it.task, !!it.done]);
  const pairs = common(x.items.map(key), y.items.map(key));
  if (!pairs.length) return null;
  const from = new Map();
  let i = 0;
  let j = 0;
  for (const [ci, cj] of [...pairs, [x.items.length, y.items.length]]) {
    while (i < ci && j < cj) from.set(j++, i++); // changed in its place
    if (cj < y.items.length) from.set(cj, ci); // kept
    i = ci + 1;
    j = cj + 1;
  }
  return y.items.map((it, n) => ({
    markdown: it.markdown,
    ...(it.depth ? { depth: it.depth } : {}),
    ...(it.task ? { task: true } : {}),
    ...(it.done ? { done: true } : {}),
    ...(from.has(n) ? { from: from.get(n) } : {}),
  }));
}

function applyEdits(markdown, edits) {
  return edits.reduce((md, { fn, args }) => (fn === 'write' ? args[0] : E[fn](md, ...args)), markdown);
}

/**
 * @param {{author?: any}} [options] the author, the host's to say, put on every edit
 * @returns {{fn: string, args: any[], author?: any}[]} the edits that make `after` of `before`
 */
function diffCards(before, after, { author } = {}) {
  const by = (edits) => (author === undefined ? edits : edits.map((e) => ({ ...e, author })));
  if (before === after) return [];
  const b = texts(after);
  const whole = [{ fn: 'write', args: [after] }];
  const edits = [];
  let doc;
  let k = 0; // the card's place in the file as edited so far
  const edit = (fn, ...args) => { doc = E[fn](doc, ...args); edits.push({ fn, args }); };
  // an edit kept only if card k then reads as card j of `after`
  const tryEdit = (j, fn, ...args) => {
    let tried;
    try { tried = E[fn](doc, ...args); } catch { return false; }
    if (texts(tried)[k] !== b[j]) return false;
    doc = tried;
    edits.push({ fn, args });
    return true;
  };
  try {
    doc = moves(before, texts(before), b, edits);
    const a = texts(doc);
    let i = 0;
    let j = 0;
    for (const [ci, cj] of [...common(a, b), [a.length, b.length]]) {
      // between shared cards: pair what was with what is, then take away or add the rest
      while (i < ci && j < cj) {
        const was = stack(doc).cards[k];
        const now = stack(after).cards[j];
        const flips = ticks(was, now);
        const tried = flips && flips.reduce((md, n) => E.toggleDone(md, k, n), doc);
        if (tried && texts(tried)[k] === b[j]) for (const n of flips) edit('toggleDone', k, n);
        else {
          const list = items(was, now);
          if (!list || !tryEdit(j, 'editItems', k, list)) edit('replaceCard', k, b[j]);
        }
        i++; j++; k++;
      }
      for (; i < ci; i++) edit('replaceCard', k, null);
      for (; j < cj; j++) { edit('insertCard', k - 1, b[j]); k++; }
      i++; j++; k++;
    }
  } catch {
    return by(whole);
  }
  if (doc === after) return by(edits);
  // the cards all as they should be, the blank lines between not: the
  // card edits, then the file as written, settled
  const same = texts(doc);
  return by(same.length === b.length && same.every((t, n) => t === b[n]) && edits.length ? [...edits, ...whole] : whole);
}

module.exports = { diffCards, applyEdits, texts };

"./motion": function (module, exports, require) {
/**
 * Motion: how a change arrives (hemlockos specs/motion.md, taken upstream
 * 10-14). The motion vocabulary is the edit vocabulary: every change to a
 * file is cards.md's own edits (diffCards), so each is an event whose
 * start and end are known before it is drawn. Here, the pure half, the
 * same for every renderer: the Motion table read, an event resolved to
 * plain numbers, and two versions of a file said as events on drawn
 * cards. How it is played (the web's animations, SwiftUI's, Compose's)
 * is each renderer's.
 *
 * The Motion table lives in .cards/config.md under `## Motion`: a row
 * an event (`all`, `edit`, `insert`…), its curve, time, style and
 * effect. An empty cell takes its parent's (`insert` → `edit` → `all`),
 * and the person's rows win over a preset's (`- preset: Barnett`), cell
 * by cell. A motion carries no colour of its own: its effects name the
 * palette's roles, and `who` is whoever made the change, the host's to
 * map.
