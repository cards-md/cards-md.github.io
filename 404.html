const { stack } = require('./stack');
const { diffCards, texts } = require('./diff');

// cards.md's events: the edits, editing begun and ended (chrome only: no
// word moves), and a change landing. A host adds its own (a page, a
// chat's arrivals) through `tree`, resolved the same way.
const TREE = {
  all: null,
  edit: 'all', insert: 'edit', remove: 'edit', replace: 'edit', done: 'edit', move: 'edit', items: 'edit',
  open: 'all', close: 'all', commit: 'all',
};
const EDITS = new Set(['insert', 'remove', 'replace', 'done', 'move', 'items']);
const COLUMNS = ['curve', 'time', 'style', 'effect'];

// named curves, as cubic beziers
const BEZIERS = {
  linear: [0, 0, 1, 1], 'out-quint': [0.22, 1, 0.36, 1], 'out-back': [0.34, 1.56, 0.64, 1],
  'in-out': [0.65, 0, 0.35, 1], snap: [0.2, 0, 0, 1], hypr: [0.05, 0.9, 0.1, 1.05],

/** A spring's settling time, in ms: when it stays within 0.2% of its end. */
function settle(damping, stiffness) {
  const w = Math.sqrt(stiffness);
  const z = damping;
  const x = (t) => (z < 1
    ? 1 - Math.exp(-z * w * t) * (Math.cos(w * Math.sqrt(1 - z * z) * t) + (z / Math.sqrt(1 - z * z)) * Math.sin(w * Math.sqrt(1 - z * z) * t))
    : 1 - Math.exp(-w * t) * (1 + w * t));

  for (let i = 0; i < 720; i++) if (Math.abs(1 - x(i / 240)) > 0.002) last = i / 240;

// a preset's table as cards.md reads it
function headBody(src) {
  const t = stack(src).cards[0].blocks[0];
  return [t.head, t.body];
}

/**
 * An event resolved: `{event, curve, ms, style, effects, layout, who}`,
 * plain numbers for any renderer. `curve` is `{kind: 'spring', damping,
 * stiffness}` or `{kind: 'bezier', points}`; `ms` its time (a spring's

 *
 * `- Hide:` names columns (one or more, by commas) the card carries and
 * the picture never draws, as if they were not there: an id an agent sums
 * by. The table, where it is shown, keeps them.
 *
 * Its cells may be words, each in a key (`- Key: \`M\` \`m\` for the
 * majority`: its words as code, the first strong and the rest lighter,
 * then what they mean; `none` an outline): a column whose filled cells are
 * mostly key words is cells, and a word in no key, or a number among the
 * words, declines. Keys take their slots by meaning (slotsOf): the
 * host's `colours`, the vocabulary, then the six hues in order, a mark
 * each (MARKS), their word. A grid of numbers ignores keys; it may say
 * `- Good:` and `- Bad:` (ranges, or a row's name), and `- Pips: yes`
 * (each count of 0 to 6 drawn as a die's).
 *
 * `- Groups:` groups it, on either axis. A value naming a label column
 * runs the rows by it: each run of one value (a blank, or the value again,
 * continues the run above) a group, its name over the run, the column no longer a label. A
 * value of named ranges, `Q1 1-12, Q2 13-24`, groups the cells' columns,
 * each name over its columns; a range out of order, overlapping one
 * before it, or of no cell's column is dropped. Any other is nothing.
 *
 * Its figure: `cols`, the cells' columns; `labels` and `gutters`, the
 * names of the columns on either side; each row's `labels`, its cells'
 * `levels`, 0 to 4, null where empty, and its `gutters`, as written;
 * `top`, the value full is measured to, and `fixed`, whether the card said
 * it; `unit`, null where unsaid; `key`, whether a key is drawn;
 * `rowGroups` and `colGroups`, each `{name, from, to}` (rows', and
 * `cols`' indices, inclusive), none where unsaid; `said`, a row group's
 * name before its rows and a column group's before its cells, then the
 * keys, and good and bad, as written; `keys`, each `{words, meaning, hue,
 * mark}` (a grid of words; else none); `pips`; and, on each row where the
 * card says them, `words` (each cell's `{key, light}`), `tones` (good,
 * bad or null) and `counts` (a die's count, else null).
 */
function gridFigure(card, title, colours) {
  // `- Hide:` a column the card carries for its readers (an id an agent sums by) and the picture never draws
  const hide = new Set(rowsOf(card, 'hide').flatMap((v) => v.split(',')).map((v) => v.trim()).filter(Boolean));
  const shown = card.table ? card.table.head.map((h, j) => (hide.has(String(h).trim()) ? -1 : j)).filter((j) => j >= 0) : [];
  const t = card.table && { head: shown.map((j) => card.table.head[j]), body: card.table.body.map((r) => shown.map((j) => r[j])) };
  if (!t || t.head.length < 2 || !t.body.length) return null;
  const n = t.head.length;
  const named = (key) => new Set(rowsOf(card, key).map((v) => v.trim()));
  // the keys' words: a column whose filled cells are mostly in them is cells, a grid of words
  const keys = keysOf(card, colours);
  const keyOf = new Map();
  keys.forEach((k, i) => k.words.forEach((w, j) => { if (!keyOf.has(w)) keyOf.set(w, { key: i, light: j > 0, w }); }));
  const keyed = (j) => {
    const filled = t.body.map((r) => String(r[j] ?? '').trim()).filter(Boolean);
    return filled.length > 0 && 2 * filled.filter((w) => keyOf.has(w)).length > filled.length;
  };
  const words = (j) => !keyed(j) && t.body.some((r) => isWord(r[j]));
  const asLabel = named('label');
  const asGutter = named('gutter');
  let first = 1;
  while (first < n && (words(first) || asLabel.has(String(t.head[first]).trim()))) first++;
  let end = n;
  while (end > first && (words(end - 1) || asGutter.has(String(t.head[end - 1]).trim()))) end--;
  // no cells, or more labels than cells (a grid of words, its words taken for labels): its table
  if (end === first || first > end - first) return null;
  const cols = t.head.slice(first, end);
  const rows = t.body.map((r) => ({
    labels: Array.from({ length: first }, (_, j) => r[j] ?? ''),
    vs: cols.map((_, i) => keyOf.get(String(r[first + i] ?? '').trim()) ?? cellOf(r[first + i])),
    gutters: Array.from({ length: n - end }, (_, j) => r[end + j] ?? ''),
  }));
  if (rows.some((r) => r.vs.some((v) => Number.isNaN(v)))) return null;
  // cells all words of the keys, or none of them
  const all = rows.flatMap((r) => r.vs).filter((v) => v !== null);
  const isWords = all.some((v) => typeof v === 'object');
  if (isWords && !all.every((v) => typeof v === 'object')) return null;
  const names = new Set(rows.flatMap((r) => r.labels.map((l) => String(l).trim())).filter(Boolean));
  const good = isWords ? [] : rangesOf(card, 'good', names);
  const bad = isWords ? [] : rangesOf(card, 'bad', names);
  const toned = good.length > 0 || bad.length > 0;
  const tone = (v, labels) => (typeof v !== 'number' ? null : within(good, v, labels) ? 'good' : within(bad, v, labels) ? 'bad' : null);
  // `- Pips: yes`: a count, 0 to 6, drawn as a die's pips; a cell past it (a sum) shaded as any
  const pips = !isWords && rowsOf(card, 'pips').some((v) => v.trim().toLowerCase() === 'yes') && all.some(pip);
  // (by every label the row has, before a group's column is taken from them)
  if (toned) rows.forEach((r) => { r.tones = r.vs.map((v) => tone(v, r.labels.map((l) => String(l).trim()))); });
  const gutters = t.head.slice(end);
  let labels = t.head.slice(0, first);
  // `- Groups:` a label column's name: its rows in runs, the column drawn once over each run
  const values = rowsOf(card, 'groups').map((v) => v.trim());
  const by = values.map((v) => labels.findIndex((h) => String(h).trim() === v)).find((j) => j >= 0) ?? -1;
  const rowGroups = [];
  if (by >= 0) {
    rows.forEach((r, i) => {
      const v = String(r.labels[by]).trim();
      // a blank, or the run's own value again (a gathered table keeps each row's group), continues it
      if (rowGroups.length && (v === '' || v === rowGroups[rowGroups.length - 1].name)) rowGroups[rowGroups.length - 1].to = i;
      else rowGroups.push({ name: v, from: i, to: i });
    });
    labels = labels.filter((_, j) => j !== by);
    rows.forEach((r) => { r.labels = r.labels.filter((_, j) => j !== by); });
  }
  // `- Groups:` named ranges of the cells' columns, in order, none overlapping; any other dropped
  const colGroups = [];
  const at = (name) => cols.findIndex((c) => String(c).trim() === name);
  for (const v of values) {
    if (labels.concat(by >= 0 ? [t.head[by]] : []).some((h) => String(h).trim() === v)) continue;
    for (const item of v.split(',').map((x) => x.trim())) {
      const m = /^(.*\S)\s+(\S+)$/.exec(item);
      if (!m) continue;
      const range = rangeOf(m[2], at);
      const last = colGroups.length ? colGroups[colGroups.length - 1].to : -1;
      if (range && range[0] <= range[1] && range[0] > last) colGroups.push({ name: m[1], from: range[0], to: range[1] });
    }
  }
  const said = rowsOf(card, 'top').map(num).find((v) => v !== null && v > 0) ?? null;
  const unit = rowsOf(card, 'unit').map((v) => v.trim()).find(Boolean) ?? null;
  const top = said ?? Math.max(0, ...rows.flatMap((r) => r.vs).filter((v) => typeof v === 'number'));
  const level = (v) => (v === null ? null : typeof v === 'object' ? (keys[v.key].hue === null && keys[v.key].mark === null ? null : v.light ? 2 : 4) : v === true ? 4 : v === false || v <= 0 ? 0 : Math.min(4, Math.max(1, Math.ceil(4 * v / top))));
  const word = (v) => (v === null ? 'none' : typeof v === 'number' ? fmt(v).replace(/,/g, '') : typeof v === 'object' ? v.w : String(v));
  // a row's cells, a column group's by its name: `Q1 (3, 5), 2`
  const cellsSaid = (vs) => {
    const out = [];
    for (let j = 0; j < vs.length;) {
      const g = colGroups.find((x) => x.from === j);
      if (g) { out.push(`${g.name} (${vs.slice(g.from, g.to + 1).map(word).join(', ')})`); j = g.to + 1; } else out.push(word(vs[j++]));
    }
    return out.join(', ');
  };
  const spoken = (r) => `${r.labels.join(' ')}: ${cellsSaid(r.vs)}${r.gutters.map((g, j) => `, ${gutters[j]} ${g}`).join('')}`;
  // a row group's name before its rows, the groups sentences apart
  const allSaid = rowGroups.length ? rowGroups.map((g) => `${g.name ? `${g.name}: ` : ''}${rows.slice(g.from, g.to + 1).map(spoken).join('; ')}`).join('. ') : rows.map(spoken).join('; ');
  // the keys after the rows, as written; good and bad as written
  const keysSaid = (isWords ? keys.map((k) => `. ${k.words.join(' ')} ${k.meaning}`).join('') : '')
    + (toned ? ['good', 'bad'].map((k) => rowsOf(card, k).map((v) => `. ${k[0].toUpperCase()}${k.slice(1)}: ${v.trim()}`).join('')).join('') : '');
  return {
    cols,
    labels,
    gutters,
    rows: rows.map((r) => ({
      labels: r.labels,
      levels: r.vs.map(level),
      gutters: r.gutters,
      ...(isWords ? { words: r.vs.map((v) => (v === null ? null : { key: v.key, light: v.light })) } : {}),
      ...(toned ? { tones: r.tones } : {}),
      ...(pips ? { counts: r.vs.map((v) => (pip(v) ? v : null)) } : {}),
    })),
    top,
    fixed: said !== null,
    unit,
    key: said !== null || unit !== null,
    rowGroups,
    colGroups,
    keys: isWords ? keys : [],
    pips,
    said: `${title || unit ? `${title || ''}${unit ? `${title ? ' ' : ''}(${unit})` : ''}: ` : ''}${allSaid}${keysSaid}`,
  };
}

/**
 * viewinfo: not a picture, the facts of what made the card above it (a
 * dashboard's footer): its rows, folded under one line where the marker
 * folds it (`[!CARD:viewinfo]-`).
 *
 * Its figure: `folded`, and its `rows` as written.
 */
function viewinfoFigure(card) {
  if (!card.rows.length) return null;
  return { folded: Boolean(card.folded), rows: card.rows.map(({ key, value }) => ({ key, value })) };
}

// a cell's photo: `![words](src)`, its words unescaped, its source as written (an id is never split
// nor unescaped; `<…>` the form a source with a space takes); empty is none; anything else no photo
const IMAGE = /^!\[((?:\\.|[^\]\\])*)\]\(\s*(<[^<>]*>|[^\s()<>]+)(?:\s+"[^"]*")?\s*\)$/;
const photoOf = (cell) => {
  const t = String(cell ?? '').trim();
  if (t === '') return null;
  const m = IMAGE.exec(t);
  return m ? { src: m[2].replace(/^<|>$/g, ''), alt: m[1].replace(/\\(.)/g, '$1') } : NaN;
};

/**
 * photos: a cell a photo, `![words](src)`, its words under it in a
 * strip (in a grid, its alt alone). With a
 * head of no words, a strip: every cell a photo, a row of the table a row
 * of photos. With words in the head, a grid: the first column the rows'
 * names, the head the columns' (a week of days). A source is the host's
 * to resolve (`photo:<id>`, a path, a link), never read here.
 *
 * Its figure: `cols`, the columns' names (null, a strip); each row's
 * `name` (null, a strip) and its `photos`, each `{src, alt}` or null where
 * the cell is empty; `said`.
 */
function photosFigure(card, title) {
  const t = card.table;
  if (!t || !t.body.length) return null;
  const strip = t.head.every((h) => !String(h).trim());
  const cols = strip ? null : t.head.slice(1);
  const n = strip ? t.head.length : cols.length;
  const rows = t.body.map((r) => ({ name: strip ? null : r[0] ?? '', photos: Array.from({ length: n }, (_, i) => photoOf(r[strip ? i : i + 1])) }));
  const all = rows.flatMap((r) => r.photos);
  if (!n || all.some((p) => Number.isNaN(p)) || !all.some(Boolean)) return null;
  return { cols, rows, said: `${title ? `${title}: ` : ''}${all.filter(Boolean).map((p) => p.alt || 'a photo').join(', ')}` };
}

const FIGURES = { bars: barsFigure, line: lineFigure, grid: gridFigure, photos: photosFigure, viewinfo: viewinfoFigure };

/**
 * A card's figure, as every host draws it: null where its type has none,
 * or its words cannot be one. `colours`, the host's (none, the reader's):
 * a category's slot by its name, over the vocabulary (slotsOf).
 */
function figure(card, title, colours) {
  const f = FIGURES[card.type];
  return f ? f(card, title, colours) : null;
}

// ---- The web's drawing of each figure: SVG, its classes in cards.css.
//
// A figure is drawn at the card's width W, in CSS px, so its words are
// never scaled: heights fixed, the bars and the line spread to W, a
// grid's cell 18, scrolling where it is wider than W. Unsized, it is drawn on a 320 plane that the
// stylesheet scales to the card (a host that does not measure).

const PLANE = 320;
// the svg's open tag: sized, it says its width and height, as drawn
const svg = (W, height, sized, said) => `<svg class="cards-chart" viewBox="0 0 ${W} ${height}"${sized ? ` width="${W}" height="${height}"` : ''} role="img" aria-label="${esc(said)}">`;

// a strip of bars, on its scale; the goal's level, and the marks at their x
function strip(xs, ys, { W, sized, height, max, goal, marks, axis, label, tones = null, zones = [] }) {
  const top = marks.length ? 16 : 6;
  const bottom = axis ? 16 : 2;
  const bw = W / xs.length;
  const Y = (v) => height - bottom - (height - bottom - top) * v / (max || 1);
  const zone = zoned(zones, Y, 0, max || 1, W);
  const parts = [...zone.washes];
  parts.push(...ys.map((y, i) => {
    if (y === null) return '';
    const h = Math.max(Y(0) - Y(y), y > 0 ? 1.5 : 0.75);
    const kind = y === 0 ? 'cards-bar-none' : tones && tones[i] ? `cards-${tones[i]}` : goal !== null && y >= goal ? 'cards-bar-met' : 'cards-bar';
    return `<rect class="${kind}" x="${(i * bw + bw * 0.15).toFixed(1)}" y="${(Y(0) - h).toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5"/>`;
  }), ...zone.words);
  parts.push(...overlay((i) => i * bw + bw / 2, { W, goal, gy: goal === null ? 0 : Y(goal), marks, top, height, bottom }));
  if (axis) parts.push(ends(xs, height, W));
  // read aloud: its name and its figures, as the table gives them
  const said = `${label ? `${label}: ` : ''}${figures(ys)}`;
  return `${svg(W, height, sized, said)}${parts.join('')}</svg>`;
}

// good and bad's zones, each a wash across at its range (clipped to the scale, lo to hi), drawn
// under the bars or lines; its word at its top, drawn over them
function zoned(zones, Y, lo, hi, W) {
  const shown = zones.filter((z) => z.lo <= hi && (z.hi === null || z.hi >= lo))
    .map((z) => ({ tone: z.tone, y1: Y(z.hi === null ? hi : Math.min(z.hi, hi)), y2: Y(Math.max(z.lo, lo)) }));
  return {
    washes: shown.map((z) => `<rect class="cards-zone cards-zone-${z.tone}" x="0" y="${z.y1.toFixed(1)}" width="${W}" height="${Math.max(z.y2 - z.y1, 1).toFixed(1)}"/>`),
    words: shown.map((z) => `<text class="cards-chart-note" x="${W - 2}" y="${(z.y1 + 9).toFixed(1)}" text-anchor="end">${z.tone === 'good' ? 'Good' : 'Bad'}</text>`),
  };
}

// the goal's level across, and each mark a line at its x, with their words
function overlay(X, { W, goal, gy, marks, top, height, bottom }) {
  const parts = [];
  if (goal !== null) {
    parts.push(`<line class="cards-goal" x1="0" x2="${W}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}"/>`, `<text class="cards-chart-note" x="${W - 2}" y="${(gy - 3).toFixed(1)}" text-anchor="end">Goal ${esc(fmt(goal))}</text>`);
  }
  for (const m of marks) {
    const x = X(m.at).toFixed(1);
    parts.push(`<line class="cards-mark" x1="${x}" x2="${x}" y1="${top - 6}" y2="${height - bottom}"/>`, `<text class="cards-chart-note" x="${(Number(x) + 3).toFixed(1)}" y="${top - 6 + 8}">${esc(m.words)}</text>`);
  }
  return parts;
}
// the axis's ends: the first x and the last
// a series' colour (cards.css): one alone the accent; of several, its hue, none quiet ink (the seventh)
// (a series named by - Good: or - Bad: in its tone)
const seriesClass = (f, n) => (f.series[n].tone ? `cards-tone-${f.series[n].tone}` : f.series.length === 1 ? 'cards-series' : `cards-series-${f.series[n].hue || 7}`);
const ends = (xs, height, W) => `<text x="0" y="${height - 3}">${esc(xs[0])}</text><text x="${W}" y="${height - 3}" text-anchor="end">${esc(xs[xs.length - 1])}</text>`;

// A bar of parts: the parts' key; then a row each, its name at the left,
// its bar across to its total, each part its share in its hue (`hues`; as a
// line's, none quiet ink), a row of nothing an outline.
function parts(f, { W, sized }) {
  const lw = widthOf(f.series.map((s) => s.name));
  const totals = f.series.map((s) => fmt(s.total));
  const tw = widthOf(totals);
  const x1 = W - tw - 4;
  const height = f.series.length * 18;
  const y = (i) => (i * 18 + 12.5).toFixed(1);
  const rows = f.series.map((s, i) => {
    const out = [`<text x="0" y="${y(i)}">${esc(cut(s.name))}</text>`];
    if (s.total <= 0) out.push(`<rect class="cards-part-none" x="${lw.toFixed(1)}" y="${(i * 18 + 3).toFixed(1)}" width="${(x1 - lw).toFixed(1)}" height="12"/>`);
    let x = lw;
    s.ys.forEach((v, n) => {
      if (!v || s.total <= 0) return;
      const w = (x1 - lw) * v / s.total;
      out.push(`<rect class="cards-part cards-series-${f.hues[n] || 7}" x="${x.toFixed(1)}" y="${(i * 18 + 3).toFixed(1)}" width="${w.toFixed(1)}" height="12"/>`);
      x += w;
    });
    out.push(`<text class="cards-grid-gutter" x="${W}" y="${y(i)}" text-anchor="end">${esc(totals[i])}</text>`);
    return out.join('');
  });
  const key = `<p class="cards-chart-key">${f.xs.map((x, n) => `<span><span class="cards-series-${f.hues[n] || 7}">●</span> ${esc(x)}</span>`).join('')}</p>`;
  return `${key}${svg(W, height, sized, f.said)}${rows.join('')}</svg>`;
}

function bars(f, title, { W, sized }) {
  if (f.parts) return parts(f, { W, sized });
  if (f.series.length === 1) {
    const s = f.series[0];
    const label = f.label ? `<p class="cards-chart-series">${esc(f.label)}</p>` : '';
    return `${label}${strip(f.xs, s.ys, { W, sized, height: 130, max: s.top, goal: f.goal, marks: f.marks, axis: true, label: s.name, tones: s.tones, zones: f.zones || [] })}`;
  }
  const strips = f.series.map((s) => `<div class="cards-chart-strip"><p class="cards-chart-series">${esc(s.name)}<span>${esc(fmt(s.total))}</span></p>${strip(f.xs, s.ys, { W, sized, height: 34, max: s.top, goal: null, marks: [], axis: false, label: s.name, tones: s.tones })}</div>`);
  return `${strips.join('')}<p class="cards-chart-axis"><span>${esc(f.xs[0])}</span><span>${esc(f.xs[f.xs.length - 1])}</span></p>`;
}

// a run of points with a number each: [[i, y], …], split where one is none
const runs = (ys) => ys.reduce((out, y, i) => {
  if (y === null) out.push([]);
  else out[out.length - 1].push([i, y]);
  return out;
}, [[]]).filter((r) => r.length);

function line(f, title, { W, sized }) {
  const { xs, lo, hi } = f;
  const height = 130;
  const top = f.marks.length ? 16 : 8;
  const bottom = 16;
  const pad = (hi - lo) * 0.08 || 1;
  const Y = (v) => height - bottom - (height - bottom - top) * (v - lo + pad) / (hi - lo + 2 * pad);
  const X = (i) => (xs.length > 1 ? 4 + i * (W - 8) / (xs.length - 1) : W / 2);
  const pt = ([i, y]) => `${X(i).toFixed(1)} ${Y(y).toFixed(1)}`;
  const band = (low, high, kind) => (low && high ? runs(xs.map((_, i) => (low[i] === null || high[i] === null ? null : i)))
    .map((r) => `<path class="${kind}" d="M${r.map(([i]) => pt([i, high[i]])).join(' L')} L${r.reverse().map(([i]) => pt([i, low[i]])).join(' L')} Z"/>`).join('') : '');
  const drawn = f.series.map((s, n) => {
    const points = runs(s.line);
    // a dot each point where few, else only a point standing alone
    const dots = points.filter((r) => xs.length <= 14 || r.length === 1).flat();
    return `<g class="${seriesClass(f, n)}">${band(s.min, s.max, 'cards-band-outer')}${band(s.low, s.high, 'cards-band')}${points.map((r) => `<path class="cards-line" d="M${r.map(pt).join(' L')}"/>`).join('')}${dots.map(([i, y]) => `<circle class="cards-dot" cx="${X(i).toFixed(1)}" cy="${Y(y).toFixed(1)}" r="2.2"/>`).join('')}</g>`;
  });
  // the greatest and the least, each just over its own height
  const scale = [`<text class="cards-chart-note" x="0" y="${(Y(hi) - 3).toFixed(1)}">${esc(fmt(hi))}</text>`, `<text class="cards-chart-note" x="0" y="${(Y(lo) - 3).toFixed(1)}">${esc(fmt(lo))}</text>`];
  const zone = zoned(f.zones || [], Y, lo - pad, hi + pad, W);
  const parts = [...zone.washes, ...drawn, ...zone.words, ...scale, ...overlay(X, { W, goal: f.goal, gy: f.goal === null ? 0 : Y(f.goal), marks: f.marks, top, height, bottom }), ends(xs, height, W)];
  // the series' names: one, unless the card's title already says it; several, a key
  const key = f.key ? `<p class="cards-chart-key">${f.series.map((s, n) => `<span><span class="${seriesClass(f, n)}">●</span> ${esc(s.name)}</span>`).join('')}</p>`
    : f.label ? `<p class="cards-chart-series">${esc(f.label)}</p>` : '';
  return `${key}${svg(W, height, sized, f.said)}${parts.join('')}</svg>`;
}

// A grid's words beside its cells, labels and gutters: a column as wide as
// its longest words at 6 a character, and 8; a word past 12 characters cut
// to 11 and an ellipsis, so it never runs into the cells.
const CUT = 12;
const cut = (s) => { const c = [...String(s)]; return c.length > CUT ? `${c.slice(0, CUT - 1).join('')}…` : String(s); };
const widthOf = (words) => 6 * Math.max(0, ...words.map((w) => [...cut(w)].length)) + 8;
// the label columns' widths, then the gutters' (a gutter's name is written under it, so it counts)
const labelWidths = (f) => f.labels.map((_, j) => widthOf(f.rows.map((r) => r.labels[j])));
const gutterWidths = (f) => f.gutters.map((g, j) => widthOf([g, ...f.rows.map((r) => r.gutters[j])]));

  // The track (R1): the day, an hour each 64 px, the span a block on it; drag

  const HOUR = 64;
  function openTrack(el) {
    const s = spanOf(el);
    const box = panel(el, 'track', 'cards-track');
    const SN = stepOf(el, V.SPAN_STEP);

      const by = Number(b.dataset.by);
      P.s = { a: { day: P.s.a.day + by, minutes: P.s.a.minutes }, b: { day: P.s.b.day + by, minutes: P.s.b.minutes } };

    P.done = () => { if (P.changed) spanTake(el, P.s); return P.changed; };

  }

  // The dial (T3, a host's choice): a ring round the chip; wind round it, a

  function openDial(el, sticky) {

ies-2":"#B28C39","series-3":"#E15E8E","series-4":"#5C6C14","series-5":"#395EB2","series-6":"#A32C74"},"Dark":{"scheme":"Dracula"}}}]},"start":"# Markdown, drawn as cards\n\nAny public GitHub repo's markdown, drawn with [cards.md](https://github.com/proper-md/cards.md): its records, rows, tables, callouts and pictures as cards, its folders to browse. To open a repo here, change `github.com` in its link to this site's address:\n\n- [sindresorhus/awesome](/sindresorhus/awesome)\n- [jlevy/the-art-of-command-line](/jlevy/the-art-of-command-line)\n"}</script>

<script>// A path written in a file, as the folder's path it names (npm run
// edit): an image's src or a link's target, read from the open file's
// own folder, as the markdown means it. Each segment is percent-decoded
// (a link to `Anderson%20County.md` names the file `Anderson County.md`);
// `.` and `..` are walked. What names no file of the folder is null: a
// target with a scheme (https:, mailto:), an absolute path, an anchor
// alone, or one that climbs out of the folder.
//
// One file for the tests (node) and the page (the browser, as
// window.cardsPaths).
(function (root, make) {
  if (typeof module === 'object' && module.exports) module.exports = make();
  else root.cardsPaths = make();
}(this, () => {
  const decode = (s) => { try { return decodeURIComponent(s); } catch { return s; } };

  /** The folder's path `target` names, written in the file at `from`
   *  (both the folder's paths, '/'-joined); null when it names none. */
  function linked(from, target) {
    if (typeof target !== 'string' || /^([a-z][a-z0-9+.-]*:|\/|#|\?)/i.test(target.trim())) return null;
    const parts = from.split('/').slice(0, -1);
    const segments = target.trim().split(/[?#]/)[0].split('/');
    if (!segments.some((p) => p && p !== '.' && p !== '..')) return null;
    for (const p of segments.map(decode)) {
      if (p === '..') { if (!parts.length) return null; parts.pop(); } else if (p && p !== '.') parts.push(p);
    }
    return parts.join('/');
  }

  /** The server's URL for a folder's path, as the browser takes it. */
  const raw = (p) => `/raw/${p.split('/').map(encodeURIComponent).join('/')}`;

  // Left out of a listing (vectors/listing.json's `hidden`): every name
  // beginning with `.`, and the folders tools make that a person does not
  // open by hand.
  const HIDDEN = { dot: true, folders: ['node_modules'] };
  const hidden = (name, dir) => name.startsWith('.') || (dir && HIDDEN.folders.includes(name));

  // A name's place in a folder, case and accents set aside: lowercased,
  // decomposed (NFD), its combining marks (U+0300 to U+036F) dropped.
  const keyOf = (name) => name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  // Two strings by Unicode code point, as Swift's and Kotlin's can match.
  const byPoint = (a, b) => {
    const x = Array.from(a, (c) => c.codePointAt(0)); const y = Array.from(b, (c) => c.codePointAt(0));
    for (let i = 0; i < Math.min(x.length, y.length); i++) if (x[i] !== y[i]) return x[i] - y[i];
    return x.length - y.length;
  };
  const byName = (a, b) => byPoint(keyOf(a.name), keyOf(b.name)) || byPoint(a.name, b.name);

  /** One folder's entries ({name, path, dir}) as Files lists them
   *  (vectors/listing.json): `rows`, what is hidden left out, its folders
   *  first, then its files, each by name with case and accents set aside;
   *  and `front`, the folder's README.md (its name in any case), drawn
   *  under the list and not a row, or null. Nothing else is special: a
   *  same-named file beside a folder (`notes.md`, `notes/`) is a row. */
  function listing(entries) {
    const shown = entries.filter((e) => !hidden(e.name, e.dir)).map(({ name, path, dir }) => ({ name, path, dir: !!dir }));
    const dirs = shown.filter((e) => e.dir).sort(byName);
    const files = shown.filter((e) => !e.dir).sort(byName);
    // more than one in a folder kept by case (README.md, readme.md): the first by code point
    const readme = files.filter((e) => e.name.toLowerCase() === 'readme.md').sort((a, b) => byPoint(a.name, b.name))[0];
    return { rows: [...dirs, ...files.filter((e) => e !== readme)], front: readme ? readme.path : null };
  }

  return { linked, raw, listing, hidden, HIDDEN };
}));

<script>// The editors, one per card kind: each takes the stack and a card's
// index and gives { el, focus, bar, apply, label }, where apply(md)
// asks the engine for the edited file, and bar is what the bar holds
// for it: { control, chips(), more() } (proto/editing.js draws it). Shared by the web bench (proto/
// editing.js) and the metrics sheet (design/), so what the sheet
// measures is what the bench draws. `env` is the host's: the engine
// (lib), the file's source, Done, a record's and a card's actions, and
// refresh() to draw the bar again when what it offers changes.
//
// An editor is the card's own markup, its words made editable where
// they stand: the same elements, classes and boxes html() draws, so
// opening a card moves nothing. Every control that is not words goes to
// the bar (env's accessory), and rearranging (handles, delete, drag) is
// a mode of its own, where the card may change shape because it was
// asked to. How much of the edit state shows is the page's choice, in
// CSS alone (data-edit; proto/editors.css).
(function () {
  function el(tag, props = {}, ...kids) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') node.className = v;
      else if (k === 'data') Object.assign(node.dataset, v);
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null && v !== false) node[k] = v;
    }
    node.append(...kids.flat().filter((k) => k !== null && k !== undefined));
    return node;
  }
  // (Kept for hosts that grew textareas; an editor has none now.)
  const grow = () => {};

  // Words made editable where they stand: plain text only, drawn as the
  // element drew them, a placeholder when empty.
  function words(node, value, { placeholder = '', spell = true } = {}) {
    node.contentEditable = 'plaintext-only';
    node.spellcheck = spell;
    node.textContent = value;
    node.classList.add('field');
    if (placeholder) node.dataset.placeholder = placeholder;
    return node;
  }
  const textOf = (node) => node.textContent;
  // A callout's types, as GitHub has them; a type as its label reads: as
  // written, or, stepped to another, in the case it was written in (as
  // editQuote saves it: all capitals, or none)
  const CALLOUTS = ['note', 'tip', 'important', 'warning', 'caution'];
  const named = (c) => (!c.written || c.written.toLowerCase() === c.type ? c.written || c.type
    : c.written === c.written.toUpperCase() ? c.type.toUpperCase() : c.type);
  // Return in text written line by line (code, markdown) is a line
  // break, typed as a character: left to the browser (or to insertText)
  // it is a <br>, which the words do not hold.
  const lineBreaks = (node) => node.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.shiftKey || e.metaKey || e.ctrlKey || e.altKey) return;
    e.preventDefault();
    const sel = window.getSelection();
    const range = sel.getRangeAt(0);
    range.deleteContents();
    // at the very end a lone newline is no line the caret can stand on:
    // two, the caret between them
    const tail = document.createRange();
    tail.selectNodeContents(node);
    tail.setStart(range.endContainer, range.endOffset);
    const atEnd = !tail.toString().length;
    const nl = document.createTextNode(atEnd ? '\n\n' : '\n');
    range.insertNode(nl);
    range.setStart(nl, 1);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
    // (not normalized: merging the text nodes moves WebKit's caret)
    node.dispatchEvent(new Event('input', { bubbles: true }));
  });
  // The field in a part: the part itself, or the words it holds.
  // Which of box's lines (rows, items) holds the caret, or -1.
  const lineOf = (box, lines) => {
    const at = document.activeElement;
    return [...box.querySelectorAll(lines)].findIndex((l) => l.contains(at));
  };
  const fieldOf = (node) => (node.classList.contains('field') ? node : node.querySelector('.field'));

  // Where the caret is in a field, as a count of characters.
  function caretIn(node) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return null;
    const r = sel.getRangeAt(0);
    if (!node.contains(r.startContainer)) return null;
    const before = document.createRange();
    before.selectNodeContents(node);
    before.setEnd(r.startContainer, r.startOffset);
    return before.toString().length;
  }
  // Put the caret `at` characters into a field (its end if not given).
  function placeCaret(node, at) {
    node.focus();
    const sel = window.getSelection();
    const range = document.createRange();
    let left = at === undefined ? Infinity : at;
    const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
    let last = null;
    for (let t = walker.nextNode(); t; t = walker.nextNode()) {
      last = t;
      if (left <= t.length) { range.setStart(t, left); range.collapse(true); sel.removeAllRanges(); sel.addRange(range); return; }
      left -= t.length;
    }
    if (last) range.setStart(last, last.length); else range.setStart(node, 0);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }
  // The caret where the finger landed, if that is in one of the fields:
  // the editor stands where the card stood, so the point is the same word.
  function caretAtPoint(root, point) {
    if (!point) return false;
    let range = null;
    if (document.caretRangeFromPoint) range = document.caretRangeFromPoint(point.x, point.y);
    else if (document.caretPositionFromPoint) {
      const p = document.caretPositionFromPoint(point.x, point.y);
      if (p) { range = document.createRange(); range.setStart(p.offsetNode, p.offset); }
    }
    if (!range) return false;
    const field = (range.startContainer.nodeType === 1 ? range.startContainer : range.startContainer.parentElement).closest('.field');
    if (!field || !root.contains(field)) return false;
    field.focus();
    range.collapse(true);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    return true;
  }

  window.cardsEditors = function (env) {
    const lib = env.lib;

    // Each kind of card says how it is edited (SPEC.md, "Where a card is
    // edited"): `inPlace`, its editor where it stands, or null -- none
    // (an image), or not this time (a table too wide for its card), and
    // the card opens on its surface; and `surfaces`, its own full-screen
    // views by name. Every kind has Markdown too, last: the view of what
    // is written, and a kind's only surface when it has none of its own.
    const KINDS = {
      heading: { inPlace: (c) => headingEditor(c.st, c.i, c.b, c.options) },
      prose: { inPlace: (c) => proseEditor(c.i, c.card) },
      list: { inPlace: (c) => (c.b.as === 'rows' ? rowsEditor(c.st, c.i, c.b, c.options) : itemsEditor(c.b, c.i, c.options)) },
      code: { inPlace: (c) => (c.b.form === 'front' ? rawEditor(c.i, c.card) : codeEditor(c.i, c.b)) },
      quote: { inPlace: (c) => quoteEditor(c.i, c.b) },
      html: { inPlace: (c) => htmlEditor(c.i, c.b) },
      table: {
        inPlace: (c) => (fits(c.options.view) ? tableEditor(c.i, c.b, {}) : null),
        surfaces: { Cells: (c) => tableEditor(c.i, c.b, { surface: true }) },
      },
      image: { inPlace: () => null },
      // a footnote (SPEC.md, "Footnotes"): a card like any other, edited as its markdown, its lines replaced
      footnote: { inPlace: (c) => rawEditor(c.i, c.card) },
    };
    const at = (st, i, options = {}) => ({ st, i, card: st.cards[i], b: st.cards[i].blocks[0], options });
    // The views of a kind's surface, its own first.
    const viewsOf = (kind) => [...Object.keys(KINDS[kind].surfaces || {}), 'Markdown'];

    // Card i's editor in place, or null: it opens on its surface.
    function editorFor(st, i, options = {}) {
      const editor = KINDS[st.cards[i].kind].inPlace(at(st, i, options));
      if (!editor) return null;
      const first = editor.focus;
      editor.focus = () => { if (!caretAtPoint(editor.el, options.point)) first(); };
      editor.el.dataset.card = i;
      return editor;
    }

    // Card i on its surface, in `view`; Markdown shows `text`, the draft
    // as it would be written.
    function surfaceFor(st, i, view, text) {
      const c = at(st, i);
      const editor = view === 'Markdown' ? rawEditor(i, c.card, text) : KINDS[c.card.kind].surfaces[view](c);
      editor.el.dataset.card = i;
      return editor;
    }

    // A record's name as written: its heading's words after `Key:`, the
    // footnotes they end with too, which record.name leaves (SPEC.md,
    // "Footnotes"); CardsKit's Block.writtenName the same.
    const writtenName = (b) => b.markdown.trim().slice(b.record.key.length).replace(/^[ \u00a0\u202f]*(?::\s+|：\s*)/u, '').trim();

    // A heading: its words where they stand; its level on the pill in
    // the bar. A record's heading: only its name, as written; the key kept.
    function headingEditor(st, i, b, options) {
      const key = options.recordKey || (b.record && b.record.key);
      let level = b.level;
      const h = el(`h${b.level}`, { class: `cards-card cards-heading${key ? ' cards-record' : ''}` });
      h.dataset.level = level;
      const name = words(el('span', { class: 'heading-words' }), key ? (b.record ? writtenName(b) : '') : b.markdown,
        { placeholder: key ? `Name this ${key}` : 'Heading' });
      name.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); env.finish(); } });
      if (key) h.append(el('span', { class: 'cards-record-key', textContent: key, contentEditable: 'false' }));
      h.append(name);
      const group = st.groups.findIndex((g) => g.heading === i);
      const record = key && b.record ? env.record(group, key) : null;
      return {
        el: h,
        label: key && !b.record ? `Add ${key}` : 'Edit heading',
        focus: () => placeCaret(name),
        bar: {
          control: { level: () => level, setLevel: (n) => { level = n; h.dataset.level = n; } },
          chips: () => (record ? record.chips : []),
          more: () => (record ? [...record.more.filter((m) => !m.danger), ...env.cardActions(i, false), ...record.more.filter((m) => m.danger)] : env.cardActions(i)),
        },
        apply: (md) => {
          const text = textOf(name).trim();
          if (key && !text) throw new Error(`Give this ${key} a name.`);
          return lib.editHeading(md, i, key ? `${key}: ${text}` : text, level);
        },
      };
    }

    // Parts written one after another -- a list's items, prose's
    // paragraphs, a quote's: Return starts the next where the caret is;
    // Delete at the start of one joins it to the one before. Split and
    // joined exactly, as typed; the edges are trimmed when written.
    function sequence(parts, container, make, redraw) {
      parts.forEach((part, n) => {
        const node = make(part, n);
        const field = fieldOf(node);
        field.addEventListener('input', () => { part.markdown = textOf(field); });
        field.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            const at = caretIn(field) ?? part.markdown.length;
            const rest = part.markdown.slice(at);
            part.markdown = part.markdown.slice(0, at);
            parts.splice(n + 1, 0, part.task ? { markdown: rest, task: true } : { markdown: rest });
            redraw(n + 1, 0);
          } else if (e.key === 'Backspace' && n > 0 && !part.rest && caretIn(field) === 0 && window.getSelection().isCollapsed) {
            e.preventDefault();
            const prev = parts[n - 1];
            const join = prev.markdown.length;
            prev.markdown += part.markdown;
            parts.splice(n, 1);
            redraw(n - 1, join);
          } else if (e.key === 'Backspace' && n === 0 && parts.length > 1 && !part.markdown && !part.rest) {
            // the first, empty, has nothing before it to join: it goes
            e.preventDefault();
            parts.splice(0, 1);
            redraw(0, 0);
          }
        });
        container.append(node);
      });
    }

    // Rows: each key and value editable where it stands. A value that
    // stood beside its key when the card was opened stays beside it as it
    // grows; the layout is worked out again after Done. Adding is in the
    // bar, with the keys other records of this kind have; rearranging is
    // its own mode.
    function rowsEditor(st, i, b, options) {
      // the rows as read, the file's own (a row it does not write is no row here)
      const viewRows = options.view ? [...options.view.querySelectorAll('.cards-row:not(.cards-unwritten)')] : [];
      const stoodBeside = (n) => {
        const r = viewRows[n];
        const dt = r && r.querySelector('dt');
        const dd = r && r.querySelector('dd');
        return !!(dt && dd && dd.getBoundingClientRect().top < dt.getBoundingClientRect().bottom - 1);
      };
      const rows = b.rows.map((r, n) => ({ key: r.key, value: r.value, body: r.body, from: n, beside: stoodBeside(n) }));
      const box = el('div', { class: 'cards-card cards-list cards-rows' });
      let arranging = false;

      function write(focusAt, part = 'value') {
        arranging = false;
        const dl = el('dl');
        rows.forEach((row, n) => {
          const rowEl = el('div', { class: `cards-row${row.body ? ' cards-row-body' : ''}${row.beside ? ' beside' : ''}` });
          const dt = words(el('dt'), row.key, { placeholder: 'Field', spell: false });
          const value = row.body ? words(el('span', { class: 'row-value' }), row.value, { placeholder: 'Value' })
            : words(el('dd'), row.value, { placeholder: 'Value' });
          // a number's or a date's words, with the keyboard its field asks (the read row's inputmode)
          const mode = row.from !== undefined && viewRows[row.from] && viewRows[row.from].querySelector(':scope > dd')?.getAttribute('inputmode');
          if (mode) value.setAttribute('inputmode', mode);
          const dd = row.body ? el('dd', {}, value, el('div', { class: 'kept', textContent: row.body })) : value;
          dt.addEventListener('input', () => { row.key = textOf(dt); });
          value.addEventListener('input', () => { row.value = textOf(value); });
          dt.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); placeCaret(value); }
            // Delete in an empty key, its row otherwise empty: the row goes
            if (e.key === 'Backspace' && !row.key && !row.value && !row.body) {
              e.preventDefault();
              rows.splice(n, 1);
              if (!rows.length) addRow();
              else write(Math.max(0, n - 1), n > 0 ? 'value' : 'key');
            }
          });
          value.addEventListener('keydown', (e) => {
            // Delete in an empty value steps back to its key
            if (e.key === 'Backspace' && !row.value) { e.preventDefault(); placeCaret(dt); return; }
            if (e.key !== 'Enter' || e.shiftKey) return;
            e.preventDefault();
            if (n + 1 < rows.length) write(n + 1); else addRow();
          });
          rowEl.append(dt, dd);
          dl.append(rowEl);
        });
        box.replaceChildren(dl);
        if (env.refresh) env.refresh();
        if (focusAt !== undefined) {
          const target = box.querySelectorAll('.cards-row')[focusAt];
          if (target) placeCaret(part === 'key' ? target.querySelector('dt') : target.querySelector('.row-value, dd'));
        }
      }
      function arrange() {
        arranging = true;
        const list = el('div', { class: 'arrange' });
        rows.forEach((row, n) => list.append(line(n,
          [el('div', { class: 'arrange-key', textContent: row.key || 'Field' }), el('div', { textContent: row.value })],
          () => { rows.splice(n, 1); arrange(); })));
        box.replaceChildren(list);
        sortable(list, rows, arrange);
        if (env.refresh) env.refresh();
      }
      function addRow(key) {
        rows.push({ key: key || '', value: '', beside: true });
        write(rows.length - 1, key ? 'value' : 'key');
      }
      const offered = offeredKeys(st, i);
      write();
      return {
        el: box,
        label: 'Edit fields',
        focus: () => { const f = box.querySelector('.row-value, dd'); if (f) placeCaret(f); },
        bar: {
          control: { arranging: () => arranging, arrange: () => (arranging ? write(0) : arrange()) },
          chips: () => [
            { label: 'Add field', run: () => addRow() },
            ...offered.filter((k) => !rows.some((r) => r.key === k)).map((k) => ({ label: `+ ${k}`, dashed: true, run: () => addRow(k) })),
          ],
          more: () => {
            const n = lineOf(box, '.cards-row');
            return [...(n >= 0 ? [{ label: 'Delete this field', danger: true, run: () => {
              rows.splice(n, 1);
              if (!rows.length) addRow(); else write(Math.max(0, n - 1));
            } }] : []), ...env.cardActions(i)];
          },
        },
        apply: (md) => lib.editRows(md, i, rows
          .filter((r) => r.from !== undefined || r.key.trim() || r.value.trim())
          .map((r) => ({ key: r.key.trim(), value: r.value, from: r.from }))),
      };
    }

    // Keys other records of this card's kind have: the shape's rows.
    function offeredKeys(st, i) {
      const g = st.groups.find((gr) => gr.cards.includes(i));
      const head = g && g.heading !== null ? st.cards[g.heading].blocks[0] : null;
      if (!head || !head.record) return [];
      const kind = st.records.find((r) => r.key === head.record.key);
      const keys = [];
      for (const v of kind.variants) for (const c of v.shape) for (const k of c.rows || []) if (!keys.includes(k)) keys.push(k);
      return keys;
    }

    // A list: each item editable where it stands, its marker where it was.
    function itemsEditor(b, i, options) {
      // A list as its outline: every item at every depth a line of its
      // own, its words where they stand, drawn as the renderer draws it.
      // What else an item holds (a paragraph, code) is kept as written.
      // A task item's box is kept as a marker is, a tap its only action.
      // Depth: the bar's pill, Tab and Shift-Tab, and Return or Delete in
      // an empty nested item, which comes out a level.
      const viewItems = options.view ? [...options.view.querySelectorAll('li')] : [];
      const items = b.items.map((it, n) => {
        const [head, ...rest] = it.markdown.split('\n');
        return { markdown: head, rest: rest.join('\n'), keep: rest.length ? viewItems[n] : null, from: n,
          depth: it.depth || 0, ordered: it.depth ? !!it.ordered : b.ordered, start: it.start, task: it.task, done: it.done };
      });
      // item n and the items after it that are deeper: what moves with it
      const span = (n) => { let e = n + 1; while (e < items.length && items[e].depth > items[n].depth) e++; return e; };
      const canIndent = (n) => n > 0 && items[n - 1].depth >= items[n].depth;
      const canOutdent = (n) => n >= 0 && n < items.length && items[n].depth > 0;
      // The kind of list item n now stands in: its siblings', else its
      // parent's list's.
      const kindAt = (n) => {
        const d = items[n].depth;
        for (let k = n - 1; k >= 0; k--) {
          if (items[k].depth === d) return items[k].ordered;
          if (items[k].depth < d) return items[k].depth === 0 ? b.ordered : items[k].ordered;
        }
        return b.ordered;
      };
      const shift = (n, by) => {
        const end = span(n);
        for (let k = n; k < end; k++) items[k].depth += by;
        items[n].ordered = kindAt(n);
      };
      // never more than one deeper than the item before
      const even = () => items.forEach((it, k) => { it.depth = k ? Math.min(it.depth, items[k - 1].depth + 1) : 0; });
      // the item with the caret: the innermost (a parent holds its children)
      const current = () => {
        const li = document.activeElement && document.activeElement.closest && document.activeElement.closest('li');
        return li && box.contains(li) ? [...box.querySelectorAll('li')].indexOf(li) : -1;
      };

      const kept = (item) => {
        const li = el('li');
        li.append(words(el('span', { class: 'item-words' }), item.markdown, { placeholder: 'Item' }));
        if (item.keep) {
          for (const node of item.keep.children) {
            if (!node.classList.contains('cards-check') && !/^(UL|OL)$/.test(node.tagName)) li.append(Object.assign(node.cloneNode(true), { contentEditable: 'false' }));
          }
        } else li.append(el('div', { class: 'kept', textContent: item.rest }));
        return li;
      };
      const itemLi = (item, n) => {
        // its words in a span of their own, so a deeper list can stand
        // beside them, in the item, and not among them
        const li = item.rest ? kept(item) : el('li', {}, words(el('span', { class: 'item-words' }), item.markdown, { placeholder: 'Item' }));
        if (item.task) {
          li.classList.add('cards-task');
          li.prepend(el('span', { class: 'cards-check', role: 'checkbox', ariaChecked: String(!!item.done), contentEditable: 'false',
            onpointerdown: (e) => { e.preventDefault(); item.done = !item.done; write(n); } }));
        }
        if (item.done) li.classList.add('cards-done');
        return li;
      };
      const keys = (item, n, field) => {
        field.addEventListener('input', () => { item.markdown = textOf(field); });
        field.addEventListener('focus', () => { if (env.refresh) env.refresh(); });
        field.addEventListener('keydown', (e) => {
          const empty = !item.markdown && !item.rest;
          const atStart = caretIn(field) === 0 && window.getSelection().isCollapsed;
          if (e.key === 'Tab') {
            e.preventDefault();
            if (e.shiftKey ? canOutdent(n) : canIndent(n)) { shift(n, e.shiftKey ? -1 : 1); write(n, caretIn(field)); }
          } else if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (empty && item.depth > 0) { shift(n, -1); write(n, 0); return; }
            const at = caretIn(field) ?? item.markdown.length;
            const rest = item.markdown.slice(at);
            item.markdown = item.markdown.slice(0, at);
            items.splice(n + 1, 0, { markdown: rest, rest: '', depth: item.depth, ordered: item.ordered, ...(item.task ? { task: true } : {}) });
            write(n + 1, 0);
          } else if (e.key === 'Backspace' && atStart && empty && item.depth > 0) {
            e.preventDefault();
            shift(n, -1);
            write(n, 0);
          } else if (e.key === 'Backspace' && atStart && n > 0 && !item.rest) {
            e.preventDefault();
            const prev = items[n - 1];
            const join = prev.markdown.length;
            prev.markdown += item.markdown;
            items.splice(n, 1);
            even();
            write(n - 1, join);
          } else if (e.key === 'Backspace' && n === 0 && items.length > 1 && empty) {
            // the first, empty, has nothing before it to join: it goes
            e.preventDefault();
            items.splice(0, 1);
            even();
            write(0, 0);
          }
        });
      };

      const box = el('div', { class: 'cards-card cards-list' });
      let arranging = false;
      function write(focusAt, caret) {
        arranging = false;
        const root = el(b.ordered ? 'ol' : 'ul');
        if (b.ordered) {
          if (b.start !== 1) root.setAttribute('start', b.start);
          root.dataset.digits = String(b.start + items.filter((it) => !it.depth).length - 1).length;
        }
        const lists = [root];
        const lis = [];
        items.forEach((item, n) => {
          const d = item.depth;
          lists.length = Math.min(lists.length, d + 1);
          if (!lists[d]) {
            // a deeper list, inside the item it hangs from
            const list = el(item.ordered ? 'ol' : 'ul');
            if (item.ordered && item.start && item.start !== 1) list.setAttribute('start', item.start);
            const parent = [...lis].reverse().find((l) => Number(l.dataset.depth) === d - 1);
            parent.append(list);
            lists[d] = list;
          }
          const li = itemLi(item, n);
          li.dataset.depth = d;
          keys(item, n, fieldOf(li));
          lists[d].append(li);
          lis.push(li);
        });
        for (const list of [root, ...root.querySelectorAll('ul, ol')]) {
          if ([...list.children].some((li) => li.classList.contains('cards-task'))) list.dataset.tasks = '';
        }
        box.replaceChildren(root);
        if (env.refresh) env.refresh();
        if (focusAt !== undefined && lis[focusAt]) placeCaret(fieldOf(lis[focusAt]), caret);
      }
      function arrange() {
        arranging = true;
        const list = el('div', { class: 'arrange' });
        items.forEach((item, n) => {
          const row = line(n, [el('div', { textContent: item.markdown })],
            () => { items.splice(n, 1); even(); arrange(); },
            el('span', { class: 'marker', textContent: item.ordered ? '#' : '•' }));
          row.style.paddingLeft = `${4 + 18 * item.depth}px`;
          list.append(row);
        });
        box.replaceChildren(list);
        sortable(list, items, () => { even(); arrange(); });
        if (env.refresh) env.refresh();
      }
      write();
      return {
        el: box,
        label: 'Edit list',
        focus: () => { const lis = box.querySelectorAll('li'); if (lis.length) placeCaret(fieldOf(lis[lis.length - 1])); },
        bar: {
          control: {
            arranging: () => arranging,
            arrange: () => (arranging ? write() : arrange()),
            depth: {
              canIn: () => !arranging && canIndent(current()),
              canOut: () => !arranging && canOutdent(current()),
              indent: () => { const n = current(); if (canIndent(n)) { shift(n, 1); write(n); } },
              outdent: () => { const n = current(); if (canOutdent(n)) { shift(n, -1); write(n); } },
            },
          },
          chips: () => [{ label: 'Add item', run: () => {
            items.push(items.some((it) => it.task) ? { markdown: '', rest: '', depth: 0, ordered: b.ordered, task: true } : { markdown: '', rest: '', depth: 0, ordered: b.ordered });
            write(items.length - 1, 0);
          } }],
          more: () => {
            const n = current();
            return [...(n >= 0 ? [{ label: 'Delete this item', danger: true, run: () => {
              items.splice(n, 1);
              if (!items.length) items.push({ markdown: '', rest: '', depth: 0, ordered: b.ordered });
              even();
              write(Math.max(0, n - 1));
            } }] : []), ...env.cardActions(i)];
          },
        },
        apply: (md) => {
          const kept = items.filter((it) => it.markdown.trim() || it.rest);
          kept.forEach((it, k) => { it.depth = k ? Math.min(it.depth, kept[k - 1].depth + 1) : 0; });
          return lib.editItems(md, i, kept.map((it) => ({ markdown: it.rest ? `${it.markdown.trim()}\n${it.rest}` : it.markdown.trim(),
            depth: it.depth, from: it.from, task: it.task, done: it.done })));
        },
      };
    }

    // Prose: each paragraph editable where it stands. If the card holds
    // more than its paragraphs (a link reference defined in it), it is
    // edited as its markdown instead, so nothing is lost.
    function proseEditor(i, card) {
      const paras = card.blocks.map((p) => ({ markdown: p.markdown }));
      if (writtenLines(card) !== paras.map((p) => p.markdown).join('\n\n')) return rawEditor(i, card);
      const box = el('div', { class: 'cards-card cards-prose' });
      function write(focusAt, caret) {
        box.replaceChildren();
        sequence(paras, box, (p) => words(el('p'), p.markdown, { placeholder: 'Text' }), write);
        if (focusAt !== undefined && box.children[focusAt]) placeCaret(box.children[focusAt], caret);
      }
      write();
      return {
        el: box, label: 'Edit text',
        focus: () => placeCaret(box.lastElementChild),
        bar: { control: null, chips: () => [], more: () => env.cardActions(i) },
        apply: (md) => {
          const text = paras.map((p) => p.markdown.trim()).filter(Boolean).join('\n\n');
          return lib.replaceCard(md, i, text || null);
        },
      };
    }

    // A quote: its paragraphs editable where they stand, its rule kept. A
    // callout's label is words too, its title (the type's name, faint,
    // when it has none); its type is on the bar, stepped through GitHub's
    // five (and its own, when it is none of them).
    function quoteEditor(i, b) {
      const callout = b.as === 'callout' ? { type: b.callout.type, written: b.callout.written, title: b.callout.title || '' } : null;
      const paras = (callout ? b.callout.markdown : b.markdown).split(/\n\s*\n/).map((markdown) => ({ markdown }));
      const box = el('div', { class: `cards-card cards-quote${callout ? ' cards-callout' : ''}` });
      const quote = el('blockquote');
      box.append(quote);
      const lead = callout ? 1 : 0;
      const types = callout && [...new Set([...(CALLOUTS.includes(callout.type) ? [] : [callout.type]), ...CALLOUTS])];
      let label = null;
      function typed() {
        box.dataset.callout = callout.type;
        label.dataset.placeholder = named(callout);
      }
      function write(focusAt, caret) {
        quote.replaceChildren();
        if (callout) {
          label = words(el('p', { class: 'cards-callout-label' }), callout.title);
          label.addEventListener('input', () => { callout.title = textOf(label); });
          // Return in the title goes on to the words
          label.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); placeCaret(quote.children[1], 0); }
          });
          quote.append(label);
          typed();
        }
        sequence(paras, quote, (p) => words(el('p'), p.markdown, { placeholder: 'Quote' }), write);
        if (focusAt !== undefined && quote.children[focusAt + lead]) placeCaret(quote.children[focusAt + lead], caret);
      }
      write();
      const step = (by) => {
        callout.type = types[(types.indexOf(callout.type) + by + types.length) % types.length];
        typed();
      };
      return {
        el: box, label: callout ? 'Edit callout' : 'Edit quote',
        focus: () => placeCaret(quote.lastElementChild),
        bar: {
          control: callout && { type: () => callout.type, color: () => getComputedStyle(box).getPropertyValue('--callout'), step },
          chips: () => [], more: () => env.cardActions(i),
        },
        apply: (md) => lib.editQuote(md, i, paras.map((p) => p.markdown.trim()).filter(Boolean).join('\n\n'),
          ...(callout ? [callout] : [])),
      };
    }

    // Code: its text editable where it stands, inside fences unseen.
    function codeEditor(i, b) {
      const box = el('div', { class: 'cards-card cards-code' });
      if (b.info) box.append(el('div', { class: 'cards-code-info', textContent: b.info }));
      const code = el('code', { class: b.language ? `language-${b.language}` : '' });
      words(code, b.text.replace(/\n$/, ''), { spell: false });
      lineBreaks(code);
      box.append(el('pre', {}, code));
      return {
        el: box, label: 'Edit code',
        focus: () => placeCaret(code),
        bar: { control: null, chips: () => [], more: () => env.cardActions(i) },
        apply: (md) => lib.editCode(md, i, textOf(code).replace(/\n$/, '')),
      };
    }

    // HTML: drawn as its text already, so its text is edited in place.
    function htmlEditor(i, b) {
      const pre = el('pre', { class: 'cards-card cards-html' });
      const text = words(el('span', { class: 'raw-text' }), b.text, { spell: false });
      pre.append(text);
      return {
        el: pre, label: 'Edit HTML',
        focus: () => placeCaret(text),
        bar: { control: null, chips: () => [], more: () => env.cardActions(i) },
        apply: (md) => lib.replaceCard(md, i, textOf(text).replace(/\s+$/, '') || null),
      };
    }

    // A table: each cell's words editable where they stand; Return fills
    // a row, as a form is filled. In place (a table that fits its card):
    // rows added, taken away and arranged, never columns (SPEC.md, "Where
    // a card is edited"). On its surface (options.surface: full screen,
    // full screen) it is the same editor, drawn in a grid, and
    // what is rare -- columns inserted, moved, aligned, deleted; rows
    // inserted and moved -- is under ⋯, for the cell with the caret.
    function tableEditor(i, b, options) {
      const surface = !!options.surface;
      const width0 = Math.max(b.head.length, ...b.body.map((r) => r.length));
      const pad = (cells) => Array.from({ length: width0 }, (_, n) => cells[n] || '');
      const head = { cells: pad(b.head), length: b.head.length };
      const rows = b.body.map((cells, n) => ({ cells: pad(cells), length: cells.length, from: n }));
      const align = Array.from({ length: width0 }, (_, n) => b.align[n] || null);
      const width = () => head.cells.length;
      const box = el('div', { class: `cards-card cards-table${surface ? ' surface-table' : ''}` });
      let arranging = false;
      const cellsOf = (tr) => [...tr.querySelectorAll('.cards-cell')];
      const rowEl = (r) => (r < 0 ? box.querySelector('thead tr') : box.querySelectorAll('tbody tr')[r]);

      function cellWords(tag, row, n, keydown) {
        const inner = words(el('div', { class: 'cards-cell' }), row.cells[n], { spell: false });
        inner.addEventListener('input', () => { row.cells[n] = textOf(inner); });
        inner.addEventListener('keydown', keydown);
        // a tap anywhere in the cell is a tap in its words (an empty one
        // has almost none to tap)
        const cell = el(tag, { onpointerdown: (e) => { if (e.target === cell) { e.preventDefault(); placeCaret(inner); } } }, inner);
        if (align[n]) cell.style.textAlign = align[n];
        return cell;
      }
      function write(focusAt, column = 0) {
        arranging = false;
        // Return: the next cell across, then the next row's first; past
        // the last row, a new one.
        const onKey = (r, n) => (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            if (n + 1 < width()) placeCaret(cellsOf(rowEl(r))[n + 1]);
            else if (r + 1 < rows.length) write(r + 1, 0); else addRow();
          } else if (e.key === 'Backspace' && r >= 0 && n === 0 && rows[r].cells.every((c) => !c)) {
            // Delete in the first cell of an empty row: the row goes
            e.preventDefault();
            rows.splice(r, 1);
            write(r - 1, width() - 1);
          }
        };
        const thead = el('thead', {}, el('tr', {}, head.cells.map((_, n) => cellWords('th', head, n, onKey(-1, n)))));
        const tbody = el('tbody', {}, rows.map((row, r) => el('tr', {}, row.cells.map((_, n) => cellWords('td', row, n, onKey(r, n))))));
        box.replaceChildren(el('table', {}, thead, tbody));
        if (env.refresh) env.refresh();
        if (focusAt !== undefined) {
          const tr = rowEl(focusAt);
          if (tr) placeCaret(cellsOf(tr)[Math.min(column, width() - 1)]);
        }
      }
      function arrange() {
        arranging = true;
        const list = el('div', { class: 'arrange' });
        rows.forEach((row, n) => list.append(line(n, [el('div', { textContent: row.cells.filter(Boolean).join(' · ') })],
          () => { rows.splice(n, 1); arrange(); })));
        box.replaceChildren(list);
        sortable(list, rows, arrange);
        if (env.refresh) env.refresh();
      }
      const blank = () => ({ cells: Array(width()).fill(''), length: head.length });
      function addRow() {
        rows.push(blank());
        write(rows.length - 1, 0);
      }
      // The cell with the caret: [row (-1 the head), column], or null.
      function caretCell() {
        const at = document.activeElement;
        const cell = at && box.contains(at) && at.closest('td, th');
        if (!cell) return null;
        const tr = cell.parentElement;
        return [tr.parentElement.tagName === 'THEAD' ? -1 : [...tr.parentElement.children].indexOf(tr), [...tr.children].indexOf(cell)];
      }
      const everyRow = (f) => [head, ...rows].forEach(f);
      const columns = {
        insert(c) {
          everyRow((row) => { row.cells.splice(c, 0, ''); if (c < row.length) row.length++; });
          align.splice(c, 0, null);
          write(-1, c);
        },
        remove(c, r) {
          if (width() < 2) return;
          everyRow((row) => { row.cells.splice(c, 1); if (c < row.length) row.length--; });
          align.splice(c, 1);
          write(r, Math.max(0, c - 1));
        },
        move(c, by, r) {
          const to = c + by;
          if (to < 0 || to >= width()) return;
          const swap = (a) => { [a[c], a[to]] = [a[to], a[c]]; };
          everyRow((row) => { swap(row.cells); row.length = Math.max(row.length, Math.max(c, to) + 1); });

          write(r, to);

        align(c, how, r) { align[c] = how; write(r, c); },
      };
      // What ⋯ holds for the cell with the caret.
      function more() {

          const [r, c] = at;
          if (surface) {
            out.push({ label: 'Insert row above', run: () => { rows.splice(r, 0, blank()); write(r, 0); } },
              { label: 'Insert row below', run: () => { rows.splice(r + 1, 0, blank()); write(r + 1, 0); } });
            if (r > 0) out.push({ label: 'Move row up', run: () => { rows.splice(r - 1, 0, ...rows.splice(r, 1)); write(r - 1, c); } });

          const [r, c] = at;

            { label: 'Insert column right', run: () => columns.insert(c + 1) });
          if (c > 0) out.push({ label: 'Move column left', run: () => columns.move(c, -1, r) });
          if (c + 1 < width()) out.push({ label: 'Move column right', run: () => columns.move(c, 1, r) });

          }

      }
      // A row as written: no empty cells past what it had, or the head's count.
      const written = (row) => {
        let end = row.cells.length;
        while (end > row.length && !row.cells[end - 1]) end--;
        return row.cells.slice(0, end);
      };
      write();
      return {
        el: box,
        label: 'Edit table',
        focus: () => { const c = box.querySelector('tbody .cards-cell') || box.querySelector('.cards-cell'); placeCaret(c); },
        bar: {
          control: { arranging: () => arranging, arrange: () => (arranging ? write() : arrange()) },
          chips: () => [{ label: 'Add row', run: () => addRow() },
            ...(surface ? [{ label: 'Add column', run: () => columns.insert(width()) }] : [])],
          more,
        },
        apply: (md) => {
          const top = written(head).map((c) => c.trim());
          return lib.editTable(md, i, {
            head: top,
            align: align.slice(0, top.length),
            rows: rows.filter((r) => r.from !== undefined || r.cells.some((c) => c.trim()))
              .map((r) => ({ cells: written(r).map((c) => c.trim()), from: r.from })),
          });
        },
      };
    }

    // A new card after card `after` (-1: at the top): prose to begin
    // with, whose words become whatever they read as (`# ` a heading,
    // `- ` a list); or, as markdown, anything markdown can write.
    // Written by the engine when done; empty, it adds nothing.
    function newCard(after, { text = '', markdown = false } = {}) {
      let editor;
      if (markdown) {
        editor = rawEditor(after, { kind: 'prose' }, text);
        editor.text = () => textOf(editor.el.querySelector('.raw-text'));
      } else {
        const paras = text.split(/\n\s*\n/).map((m) => ({ markdown: m }));
        const box = el('div', { class: 'cards-card cards-prose cards-new' });
        const write = (focusAt, caret) => {
          box.replaceChildren();
          sequence(paras, box, (p) => words(el('p'), p.markdown, { placeholder: 'Start writing' }), write);
          if (focusAt !== undefined && box.children[focusAt]) placeCaret(box.children[focusAt], caret);
        };
        write();
        editor = { el: box, focus: () => placeCaret(box.lastElementChild), text: () => paras.map((p) => p.markdown.trim()).filter(Boolean).join('\n\n') };
      }
      editor.label = 'Add card';
      editor.bar = { control: null, chips: () => [], more: () => env.cardActions(after, false) };
      editor.apply = (md) => lib.insertCard(md, after, editor.text());
      return editor;
    }

    // Whether a card, as drawn, fits its box: a table that scrolls does not.
    function fits(view) {
      const scroller = view && (view.classList.contains('cards-table') ? view : view.querySelector('.cards-table'));
      return !scroller || scroller.scrollWidth <= scroller.clientWidth + 0.5;
    }

    // Anything else (an image, front matter), or a table's markdown on
    // its surface: its markdown, as written or as the draft had it, in
    // the card's own box. In place this one moves: its words become
    // their markdown.
    function rawEditor(i, card, text) {
      const box = el('div', { class: `cards-card cards-${card.kind} raw` });
      const pre = words(el('pre', { class: 'raw-text' }), text ?? writtenLines(card), { spell: false });
      lineBreaks(pre);
      box.append(pre);
      return {
        el: box, label: `Edit ${card.kind}`, raw: true,
        focus: () => placeCaret(pre),
        bar: { control: null, chips: () => [], more: () => env.cardActions(i) },
        apply: (md) => lib.replaceCard(md, i, textOf(pre).replace(/\s+$/, '') || null),
      };
    }

    // A card's written lines: its blank lines before and after left out.
    function writtenLines(card) {
      const lines = env.source().split('\n');
      let [s, e] = card.lines;
      while (s < e - 1 && !lines[s].trim()) s++;
      while (e > s + 1 && !lines[e - 1].trim()) e--;

    }

    // One row or item, rearranging: a handle, what it holds, a two-tap delete.
    function line(n, body, onRemove, lead) {
      const remove = el('button', { type: 'button', class: 'remove', textContent: '−', ariaLabel: 'Delete',
        onpointerdown: (e) => e.preventDefault(),
        onclick: () => {
          if (remove.classList.contains('armed')) { onRemove(); return; }
          remove.classList.add('armed');
          remove.textContent = 'Delete';
          setTimeout(() => { remove.classList.remove('armed'); remove.textContent = '−'; }, 2500);
        } });
      return el('div', { class: 'line', data: { index: n } },
        el('button', { type: 'button', class: 'handle', textContent: '⠿', ariaLabel: 'Drag to reorder', tabIndex: -1 }),
        lead || null,
        el('div', { class: 'line-body' }, body),
        remove);
    }

    // Drag a line by its handle to a new place in `array`.
    function sortable(list, array, redraw) {
      list.querySelectorAll('.handle').forEach((handle) => {
        handle.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          const row = handle.closest('.line');
          const from = Number(row.dataset.index);
          const mids = [...list.children].map((r) => { const b = r.getBoundingClientRect(); return b.top + b.height / 2; });
          const startY = e.clientY;
          let to = from;
          row.classList.add('dragging');
          handle.setPointerCapture(e.pointerId);
          const move = (ev) => {
            const dy = ev.clientY - startY;
            row.style.transform = `translateY(${dy}px)`;
            to = mids.filter((m, k) => k !== from && m < mids[from] + dy).length;
          };
          const up = () => {
            handle.removeEventListener('pointermove', move);
            handle.removeEventListener('pointerup', up);
            handle.removeEventListener('pointercancel', up);
            row.style.transform = '';
            row.classList.remove('dragging');
            if (to !== from) { const [x] = array.splice(from, 1); array.splice(to, 0, x); }
            redraw();
          };
          handle.addEventListener('pointermove', move);
          handle.addEventListener('pointerup', up);
          handle.addEventListener('pointercancel', up);
        });
      });
    }

    return { editorFor, surfaceFor, viewsOf, newCard, grow };
  };
}());

<script>// Motion, played on the web (SPEC.md, "A change, shown as it happens"):
// the events lib/motion.js says, each resolved from the person's Motion
// table, played with the Web Animations API on the cards just drawn.
// Ported from hemlockos's lab (lab/motion.js), kept to what the stack
// needs: a card entering, a card leaving (its ghost, where it stood),
// cards kept sliding from where they were (FLIP), words crossing, a
// strike drawn, and glow, rim, hold and shake. Nothing moves when idle,
// and no motion blocks a touch.
//
// window.cardsMotion = { snapshot(stackEl), play(was, stackEl, events, motion, options) }

    if (!(root.CSS && CSS.supports('animation-timing-function', 'linear(0, 1)'))) return 'cubic-bezier(0.22,1,0.36,1)';

    const T = lib.resolveMotion({ rows: { all: { curve: `spring ${z}/${k}`, time: '', style: '', effect: '' } } }, 'all').ms / 1000;
    const x = (t) => (z < 1
      ? 1 - Math.exp(-z * w * t) * (Math.cos(w * Math.sqrt(1 - z * z) * t) + (z / Math.sqrt(1 - z * z)) * Math.sin(w * Math.sqrt(1 - z * z) * t))
      : 1 - Math.exp(-w * t) * (1 + w * t));
    const pts = [];
    for (let i = 0; i <= 32; i++) pts.push(i === 32 ? 1 : +x((T * i) / 32).toFixed(4));
    return `linear(${pts.join(', ')})`;
  }

  /** Each drawn card, where it stood and what it was: taken before the stack is drawn anew. */
  function snapshot(stackEl) {
    const host = stackEl.getBoundingClientRect();
    return [...stackEl.querySelectorAll('.cards-card')].map((c) => {
      const r = c.getBoundingClientRect();
      return { x: r.left - host.left, y: r.top - host.top, w: r.width, h: r.height, html: c.outerHTML };
    });
  }

  function frames(style, entering) {
    const n = style.n;
    switch (style.name) {
      case 'grow': return [{ opacity: 0, transform: 'scaleY(0.6)', transformOrigin: 'top' }, { opacity: 1, transform: 'none', transformOrigin: 'top' }];
      case 'collapse': return [{ opacity: 1, transform: 'none', transformOrigin: 'top' }, { opacity: 0, transform: 'scaleY(0.6)', transformOrigin: 'top' }];
      case 'pop': return [{ opacity: 0, transform: `scale(${(n || 90) / 100})` }, { opacity: 1, transform: 'none' }];
      case 'side': return [{ opacity: 0, transform: `translateX(${n || 48}px)` }, { opacity: 1, transform: 'none' }];
      case 'focus': return [{ opacity: 0, filter: `blur(${n || 10}px)` }, { opacity: 1, filter: 'blur(0px)' }];
      case 'rise': return [{ opacity: 0, transform: `translateY(${n || 40}px)` }, { opacity: 1, transform: 'none' }];
      case 'slide': return [{ opacity: 0, transform: `translateY(${n || 16}px)` }, { opacity: 1, transform: 'none' }];
      case 'ink': return [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }];

    }
  }

   * Play `events` on `stackEl`, the cards just drawn, `was` the snapshot taken before.
   * `motion`, readMotion's; options: { author, who (the role the author's glow takes), tree }.
   */
  function play(was, stackEl, events, motion, options = {}) {
    const reduce = reduced();
    const cards = [...stackEl.querySelectorAll('.cards-card')];
    const resolved = (kind) => lib.resolveMotion(motion, kind, { author: options.author, reduce, tree: options.tree });
    const played = [];
    const moved = new Set();
    for (const ev of events) {
      if (ev.kind === 'write') { for (const c of cards) run(c, [{ opacity: 0.4 }, { opacity: 1 }], resolved('replace')); continue; }
      const m = resolved(ev.kind);
      const el = ev.card === null ? null : cards[ev.card];
      if (ev.kind === 'remove' && was[ev.was]) played.push(ghost(stackEl, was[ev.was], m));
      else if (el && ev.kind === 'insert') { const f = frames(m.style, true); if (f) run(el, f, m); effects(el, m, options); }
      else if (el && ev.kind === 'move') { moved.add(ev.card); flip(el, was[ev.was], stackEl, m); effects(el, m, options); }
      else if (el && ev.kind === 'done') { if (m.style.name === 'strike') strike(el, ev.item, m); else cross(el, m); effects(el, m, options); }
      else if (el) { cross(el, m); effects(el, m, options); }
    }
    // the cards kept slide from where they stood: each one's place before, by the events' pairing
    const kept = keptPlaces(was.length, cards.length, events);
    const slide = resolved('move');
    for (const [before, after] of kept) if (!moved.has(after) && cards[after]) flip(cards[after], was[before], stackEl, slide);
    return played;
  }

  // cards neither added nor taken: their place before and after, in order
  function keptPlaces(n, m, events) {
    const gone = new Set(events.filter((e) => e.was !== null && (e.kind === 'remove' || e.kind === 'move')).map((e) => e.was));
    const fresh = new Set(events.filter((e) => e.card !== null && (e.kind === 'insert' || e.kind === 'move')).map((e) => e.card));
    const a = [...Array(n).keys()].filter((i) => !gone.has(i));
    const b = [...Array(m).keys()].filter((j) => !fresh.has(j));
    return a.map((i, k) => [i, b[k]]).filter(([, j]) => j !== undefined);
  }

  function flip(el, from, stackEl, m) {
    if (!from) return;
    const host = stackEl.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    const dx = from.x - (r.left - host.left);
    const dy = from.y - (r.top - host.top);
    if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;
    run(el, [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], m);
  }

  // a card taken away: its likeness where it stood, leaving
  function ghost(stackEl, from, m) {
    const box = document.createElement('div');
    box.innerHTML = from.html;
    const el = box.firstElementChild;
    if (getComputedStyle(stackEl).position === 'static') stackEl.style.position = 'relative';
    Object.assign(el.style, { position: 'absolute', margin: '0', pointerEvents: 'none', left: `${from.x}px`, top: `${from.y}px`, width: `${from.w}px`, height: `${from.h}px` });
    el.classList.add('cards-ghost');
    stackEl.appendChild(el);
    const a = run(el, frames(m.style, false) || [{ opacity: 1 }, { opacity: 0 }], m, { fill: 'both' });
    a.finished.then(() => el.remove(), () => el.remove());
    return el;
  }

  const cross = (el, m) => run(el, m.style.name === 'ink' ? frames(m.style, true) : [{ opacity: 0.35 }, { opacity: 1 }], m);

  // the item ticked, drawn in from the left as it now stands
  function strike(el, item, m) {
    const li = el.querySelectorAll('li')[item] || el;
    run(li, [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], m);
  }

  root.cardsMotion = { snapshot, play };
}(typeof window !== 'undefined' ? window : globalThis));

// choices (cards.css's data-theme, data-prose, data-merge, data-width), the column's
// space and each type role's size and line (design/tokens.json), and the
// colours (cards.css's --cards-* variables), light and dark; and the
// pictures' colours, a category's slot by its name (SPEC.md, "Named
// colours"), read and given to the page but not in the panel.
//
// Kept as rows, in ~/.cards/config.md, under the headings Page, Space,
// Type, Light, Dark and Colours; a key is its CSS name without --cards-
// (under Colours, a category's name). A folder's own .cards/config.md
